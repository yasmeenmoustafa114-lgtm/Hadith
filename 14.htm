<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار الاستنباطي المتقدم: المحاضرة الرابعة عشرة - المتابعات والشواهد وزيادة الثقة</title>
    <style>
        :root { --primary: #1b263b; --secondary: #415a77; --accent: #e0a96d; --correct-bg: #e8f5e9; --correct-border: #4caf50; --wrong-bg: #ffebee; --wrong-border: #f44336; --text: #0d1b2a; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .quiz-container { background: #fff; max-width: 950px; width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 40px; box-sizing: border-box; border-top: 6px solid var(--accent); }
        .header { text-align: center; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; margin-bottom: 30px; }
        .header h2 { color: var(--primary); margin: 0; font-size: 1.95em; }
        .progress { color: var(--accent); font-weight: bold; margin-top: 10px; font-size: 1.2em; }
        .question-text { font-size: 1.45em; font-weight: bold; color: var(--secondary); margin-bottom: 25px; line-height: 1.6; }
        .options-list { list-style: none; padding: 0; margin: 0; }
        .option-item { background: #fafafa; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; font-size: 1.15em; display: flex; align-items: center; }
        .option-item:hover:not(.disabled) { background: #fff3e0; border-color: #ffb74d; }
        .option-item input { margin-left: 15px; transform: scale(1.4); cursor: pointer; }
        .option-item.disabled { cursor: not-allowed; opacity: 0.9; }
        .option-item.correct { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #2e7d32; font-weight: bold; }
        .option-item.wrong { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: #c62828; text-decoration: line-through; }
        .feedback-box { display: none; background: #fafafa; border-right: 5px solid var(--accent); padding: 15px 20px; margin-top: 25px; border-radius: 5px; font-size: 1.1em; line-height: 1.7; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .feedback-box span { font-weight: bold; color: var(--accent); display: block; margin-bottom: 8px; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #e0e0e0; padding-top: 20px; }
        .btn { background: var(--secondary); color: #fff; border: none; padding: 12px 35px; border-radius: 6px; font-size: 1.15em; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn:hover:not(:disabled) { background: var(--primary); }
        .btn:disabled { background: #bdbdbd; cursor: not-allowed; }
    </style>

<body>

<div class="quiz-container">
    <div class="header">
        <h2>الاختبار الاستنباطي المتقدم: المحاضرة الرابعة عشرة</h2>
        <div class="progress" id="progress-text">السؤال 1 من 60</div>
    </div>
    <div id="quiz-body">
        <div class="question-text" id="q-text"></div>
        <ul class="options-list" id="options-list"></ul>
        <div class="feedback-box" id="feedback-box">
            <span>التأصيل المنهجي (مستنبط من النص):</span>
            <p id="feedback-text"></p>
        </div>
    </div>
    <div class="nav-buttons">
        <button class="btn" id="btn-prev" disabled>السابق</button>
        <button class="btn" id="btn-next">التالي</button>
    </div>

<script>
const qd = [
    // --- المقدمة وفلسفة القواعد ---
    {q:"متى نشأت الحاجة التاريخية لوضع قواعد العلوم (كعلم النحو والحديث)؟",o:["في عصر النبي ﷺ لضبط الوحي.","في عصر كبار الصحابة لتعليم التابعين.","عندما ضعفت المَلَكَة والسليقة في الأجيال اللاحقة.","عندما طلب الحكام ذلك."],a:2,e:"النص: 'أن القواعد وجدت عند ضعف المَلَكة، فلما ضعفت الملكة بدأت تقعَّد في قواعد'."},
    {q:"القواعد العلمية والمصطلحات تعتبر مرحلة (نهاية وتمكن) تغني طالب العلم عن التطبيق العملي والممارسة.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة نهاية). النص: 'فالقواعد نرجع فنقول هي حالة ابتداء وحالة تعرُّف لا حالة انتهاء ولا حالة تمكُّن'."},
    {q:"تفسير ابن عباس رضي الله عنه لـ (الربانيين) بأنهم الذين (يعلمون الناس بصغار العلم قبل كباره) يدل منهجياً على:",o:["التدرج في مستويات طلب العلم.","الزهد في العلم.","حفظ المتون فقط.","عدم الحاجة لعلم الحديث."],a:0,e:"النص: 'أنه فسر (ربانيين)... أي تعلمون الناس بصغار العلم قبل كباره... فطالب العلم ينفعه أن يبدأ مستوى ثم مستوى'."},

    // --- المتابعة والشاهد والاعتبار ---
    {q:"ما هو التعريف الدقيق لمصطلح (الاعتبار) عند المحدثين؟",o:["هو نوع من أنواع الحديث الصحيح.","هو نوع من الأسانيد المعنعنة.","هو حالة البحث والاستقصاء عن متابعة أو شاهد لحديث ما.","هو الاعتبار بأحوال الأمم السابقة."],a:2,e:"النص: 'فالاعتبار عند المحدثين ليس نوعًا من أنواع علوم الحديث، وليس اسمًا لإسناد ما، إنما هو حالة البحث عن متابعة أو شاهد'."},
    {q:"(المتابعة) اصطلاحاً هي: أن يشارك راوٍ راوياً آخر في رواية الحديث عن صحابي مختلف.",o:["صح","خطأ"],a:1,e:"خطأ. هذا تعريف مقارب للشاهد وليس المتابعة. النص: 'المتابعة هي مشاركة راوٍ راويًا آخر في رواية الحديث عن شيخه أو عمَّن فوقه'."},
    {q:"تنقسم (المتابعة) إلى قسمين هما:",o:["لفظية ومعنوية.","تامة وقاصرة.","مطلقة ونسبية.","صحيحة وضعيفة."],a:1,e:"النص: 'وهذه المتابعة يقسِّمها العلماء إلى: متابعة تامة... متابعة قاصرة'."},
    {q:"المتابعة (التامة) تتحقق عندما:",o:["يلتقي الراويان في الصحابي فقط.","يتفق الراويان في تلقي الحديث عن الشيخ نفسه مباشرة.","يتفق الراويان في المعنى دون السند.","يكون الراويان من طبقة واحدة ولو اختلف شيوخهما."],a:1,e:"النص: 'متابعة تامة: وهي أن يتلقَّ الراويان عن الشيخ نفسه مباشرة'."},
    {q:"المتابعة (القاصرة) تعني أن إسناد المتابع (ضعيف) لوجود قصور فيه، فلا يعتد به في التقوية.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة مفاهيمية). النص: 'فلا تعني هذه المتابعة أنها ضعيفة أو في الحديث مشكلة، وإنما للتأكد أن ضبط هذا الراوي جيد... التقى معه في حلقة أعلى من هذا الشيخ'."},
    {q:"الحديث (الشاهد) هو أن يروى عن (صحابي آخر) ما يشابه الحديث الأول باللفظ أو بالمعنى.",o:["صح","خطأ"],a:0,e:"النص: 'الشاهد هو: أن يُرْوَى عن صحابي آخر ما يشابه هذا الحديث باللفظ أو بالمعنى'."},
    {q:"لماذا يعتبر المحدثون الروايات المتعددة (عن صحابي واحد) مهما تفرعت أسانيدها (حديثاً واحداً) ومتابعات؟",o:["لأنها في الفقه.","لأنهم يعتبرون الحديث موضوعاً مستقلاً ما دام عن صحابي واحد، فإذا جاء عن صحابي آخر صار مسألة جديدة وحديثاً مستقلاً.","لأن الصحابة كلهم عدول.","بسبب اختصار المتون."],a:1,e:"النص: 'فالمحدِّثون يعتبرون الحديث حديثًا واحدًا ما دام عن صحابيّ واحد... فلما جاءنا عن عائشة أو عن ابن عباس صار مسألتان، وصار حديثان'."},
    {q:"في حديث ابن عمر (الشهر تسع وعشرون)، رواية القعنبي عن (الإمام مالك) مطابقة لرواية الشافعي عن (الإمام مالك)، هذا يسمى:",o:["متابعة قاصرة.","متابعة تامة.","شاهداً باللفظ.","شاهداً بالمعنى."],a:1,e:"النص: 'فإذن نسمي رواية عبد الله بن مسلمة بالنسبة لرواية الإمام الشافعي متابعة تامة'."},
    {q:"في نفس الحديث، رواية (عاصم بن محمد) عن (محمد بن زيد) عن (ابن عمر) تعتبر بالنسبة لرواية الشافعي:",o:["متابعة تامة.","شاهداً.","متابعة قاصرة (لالتقائهما في الصحابي فوق الشيخ).","مزيدة في متصل الأسانيد."],a:2,e:"النص: 'فنسمي رواية عاصم عن محمد بن زيد عن عبد الله بن عمر بالنسبة لرواية الإمام الشافعي متابعة قاصرة'."},
    {q:"رواية ابن عباس لنفس حديث (الشهر تسع وعشرون) تعتبر شاهداً بالمعنى، بينما رواية أبي هريرة (فإن أغمي عليكم فأكملوا عدة شعبان) تعتبر شاهداً باللفظ.",o:["صح","خطأ"],a:1,e:"خطأ (عكسي). النص: 'فرواية أبي هريرة... هي شاهدٌ بالمعنى وليس باللفظ... فنُسمي رواية ابن عباس شاهدًا باللفظ'."},
    {q:"كلمة (اعتبرتُ حديثه) في لسان المحدثين تعني:",o:["احترمتُ قدره.","بحثْتُ فلم أجد أحداً رواه غيره (أو بحثت عن شواهد ومتابعات له).","أخذتُ منه العبرة والموعظة.","ضعفتُه."],a:1,e:"النص: 'وقد اعتبرت حديثه، فوجدته قد تفرد به؛ يعني بحث ولم يجد أحدًا رواه غيره'."},

    // --- تقوي الحديث ---
    {q:"هل كل الأحاديث الضعيفة يمكن أن تتقوى بالمتابعات والشواهد؟",o:["نعم مطلقاً.","لا، الفاسق والكذاب والمتروك لا يعتد بهم، إنما يتقوى (الضعيف ضعفاً خفيفاً) كسيء الحفظ والمستور والمدلس.","لا، الضعيف لا يتقوى أبداً.","نعم إذا كانت الشواهد من الإسرائيليات."],a:1,e:"النص: 'فالحديث الذي فيه ضعف خفيف... ومثل هذا الحديث قد يتقوى بالمتابعة... فالفاسق والكذّاب لا يُنظر له'."},
    {q:"الحديث (المرسل) والحديث (المدلس) يعتبران من أنواع الضعف (الخفيف) الذي لا يفيد القطع بالكذب، بل يقبلان التقوية إذا وجد ما يعضدهما.",o:["صح","خطأ"],a:0,e:"النص: 'الحديث المرسل... أو الحديث المدلس... فهذه الأنواع كلها لا تفيد القطع بأن الحديث كذب... ومثل هذا الحديث قد يتقوى'."},
    {q:"إذا التقت رواية لراوٍ (اختلط) مع رواية لراوٍ (مدلس) لنفس الحديث، فإنهما يقويان بعضهما فيرتقي الحديث لدرجة:",o:["صحيح لذاته.","حسن لذاته.","حسن لغيره.","صحيح لغيره."],a:2,e:"النص: 'في هذه الحالة يرتفع الحديث الضعيف ضعفًا خفيفًا، ويصبح حديثًا حسنًا لغيره'."},
    {q:"من شروط ترقية الحديث الضعيف إلى (حسن لغيره) أن يكون المتن خاليًا من:",o:["الأحكام الفقهية.","الشذوذ، والعلة، والنكارة، وألا يُشَرِّع حكماً جديداً لم يأت في الإسلام مثله.","الألفاظ الغريبة.","الرواة التابعين."],a:1,e:"النص: 'إذا لم يكن بالمتن شذوذ ولا علة ولا نكارة، ولم يكن فيه ما لم يأتِ في الإسلام مثله، كأن يُشرّع عبادة أو حكم جديد'."},
    {q:"ترتيب درجات القبول والضعف من الأقوى للأضعف هو: الحسن لذاته، ثم الحسن لغيره، ثم الضعيف ضعفاً خفيفاً.",o:["صح","خطأ"],a:0,e:"النص: 'فترتيبهم كالتالي: الحديث الحسن لذاته؛ ثم الحسن لغيره؛ ثم الضعيف ضعفًا خفيفًا'."},
    {q:"إطلاق عبارة (موضوع أو لا أصل له) على الحديث المرسل أو المدلس هو مسلك علمي دقيق لقطع الطريق على المبتدعة.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'إذن لا ينبغي لطلبة العلم... أن يُطلقوا عبارة: موضوع، أو لا أصل له... على الحديث المرسل، والمدلَّس... فهذا الوصف ليس وصفًا دقيقًا'."},

    // --- تساهل المتأخرين في التقوية ---
    {q:"ما هو النقد المنهجي الذي وجهه المحاضر لكثير من العلماء (المتأخرين) في باب المتابعات والشواهد؟",o:["أنهم متشددون جداً ولا يقبلون التقوية أبداً.","أنهم توسعوا وتساهلوا، فصاروا يحسنون الأحاديث بمجرد وجود أي شاهد بالمعنى أو متابعة ضعيفة ولو كانت من كذاب أو فيها سرقة.","أنهم يرفضون أحاديث الآحاد.","أنهم ألفوا كتباً كثيرة."],a:1,e:"النص: 'ولكن توسع المتأخرون في تحسين الأحاديث وتصحيحها بمجرد وجود شاهد أو متابعة... كيف أن المتابعة من رجل كذاب... أن تقوي الحديث?'."},
    {q:"من العلماء المعاصرين الذين دخل عليهم شيء من هذا (التساهل) بسبب قبول أي متابعة دون تدقيق معمق:",o:["الدارقطني وابن حجر.","الإمام أحمد والنووي.","الشيخ الألباني، والشيخ أحمد شاكر، والشيخ شعيب الأرناؤوط.","أبو داود والعراقي."],a:2,e:"النص: 'ومن أسباب التساهل التي دخلت الشيخ الألباني رحمه الله، والشيخ أحمد شاكر... وأيضًا بعدهم الشيخ شعيب الأرناؤوط... هو قبول أي متابعة'."},
    {q:"كتاب (الإرشادات في تقوية الأحاديث بالشواهد والمتابعات) للشيخ طارق بن عوض الله، يتناول:",o:["شرح صحيح البخاري.","نقد وتفنيد أمثلة لأحاديث قيل فيها (حسن لغيره) بالتساهل وبيان خطأ ذلك.","جمع الأحاديث المتواترة.","تراجم الرواة الكذابين."],a:1,e:"النص: 'رصد فيه أمثلة كثيرة لأحاديث قيل فيها حسنًا لغيره أو صحيحًا لغيره؛ وبين بالأمثلة التفصيلية أن هذا لم يثبت'."},
    {q:"عملية تقوية الأحاديث أشبه بمعادلة رياضية بسيطة نتائجها قطعية بمجرد جمع 1 + 1.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'وليست مسألة رياضية بسيطة لها نفس النتيجة... وإنما هي أشبه ما تكون بمعادلة رياضية ذات عدة مجاهيل تحتاج إلى نظر عميق'."},

    // --- زيادة الثقة ---
    {q:"(زيادة الثقة) تدخل في:",o:["المتن فقط.","الإسناد فقط.","الإسناد أو في المتن.","كتب الفقه فقط."],a:2,e:"النص: 'إذن زيادة الثقة تدخل في الإسناد أو في المتن'."},
    {q:"الرأي الأول الذي يقول بـ (قبول زيادة الثقة مطلقاً) يستند إلى حجة بسطية هي: أن الثقة لو انفرد بالحديث لقبلناه، فمن باب أولى أن نقبل زيادته لأن من علم حجة على من لم يعلم.",o:["صح","خطأ"],a:0,e:"النص: 'وحجتهم مبسطة جدًّا، قالوا أن هذا الثقة لو روى الحديث منفردًا قبلنا حديثه، إذن لما روى زيادة سنقبل زيادته؛ لأن عنده زيادة علم'."},
    {q:"الرأي الذي ينسب لبعض العلماء كـ (الدارقطني) في زيادة الثقة هو:",o:["التفصيل حسب القرائن.","رد الزيادة مطلقاً، والأخذ بالحديث الأنقاص لدخول الشك فيها.","القبول مطلقاً.","القبول في السند وردها في المتن."],a:1,e:"النص: 'الرأي الآخر أن الزيادة لا تقبل مطلقًا، ويؤخذ بالحديث الأنقاص، وهذا نسب إلى بعض العلماء؛ مثل الدارقطني'."},
    {q:"مذهب الحافظ (ابن الصلاح) في زيادة الثقة هو (التفصيل وتقسيمها إلى 3 أقسام)، وهو المذهب المعتمد أصولياً وحديثياً.",o:["صح","خطأ"],a:0,e:"النص: 'وهذا التفصيل هو الذي عليه الحافظ بن الصلاح رحمه الله... نقسم الزيادة إلى ثلاثة أقسام'."},
    {q:"وفقاً لتفصيل ابن الصلاح، زيادة كلمة (الذهب) في حديث وعيد الشارب في (آنية الفضة)، تعتبر:",o:["زيادة تخالف وتناقض أصل الحديث فترد.","زيادة لا تخالف أصل الحديث (ولو أفادت حكماً جديداً) فتقبل.","زيادة مترددة.","شذوذاً قادحاً."],a:1,e:"النص: 'القسم الأول: زيادة لا تخالف أصل الحديث، ولو أفادت حكمًا جديدًا... يقول ابن الصلاح: في مثل هذا نقبلها'."},
    {q:"في حديث (وجعلت لي الأرض مسجداً وطهوراً)، زيادة لفظ (تربتها) جعلتها من القسم المتردد، فكيف تعامل معها الإمام أبو حنيفة؟",o:["قبلها وخصص بها عموم الحديث.","ردها ولم يعمل بها، معتبراً أن التخصيص حكم يخالف العموم ويخرج شيئاً كان داخلاً فيه.","اعتبرها مدرجة.","اعتبرها شاذة."],a:1,e:"النص: 'رأى أنَّها تخالفه؛ لأنَّ العمومَ حكمٌ، والتخصيصَ حكمٌ يخالفه... فردَّ هذه الزِّيادة ولم يعمل بها، وهو الإمام أبو حنيفة'."},
    {q:"رأي الحافظ (ابن حجر) الدقيق في زيادة الثقة أنه لا يطلق حكماً عاماً، بل ينظر في (القرائن) المحتفة بكل رواية ليرجح القبول أو الرد.",o:["صح","خطأ"],a:0,e:"النص: 'رأي دقيق طرحه ابن حجر، يقول أننا لا نطلق حكمًا، ولكن ننظر في القرائن، فقد تُرجَّح رواية الثِّقة في موضع، وقد نَرُدُّ رواية الثِّقة بموضع'."},

    // --- المزيد في متصل الأسانيد ---
    {q:"تعريف (المزيد في متصل الأسانيد) هو:",o:["إدراج كلام في متن الحديث.","أن يزيد راوٍ في الإسناد المتصل راويًا لم يذكره غيره من الثقات.","أن يجمع الراوي أسانيد متعددة في إسناد واحد.","أن يقلب الراوي إسناد الحديث."],a:1,e:"النص: 'أن يزيد راوٍ في الإسناد المتَّصل راويًا لم يذكره غيره'."},
    {q:"في مثال حديث الحولاء، زاد (عبد الله بن سالم) راوياً وهو (حبيب مولى عروة) بين الزهري وعروة، بينما رواه كبار أصحاب الزهري بدون هذه الواسطة. إذا ثبت أن الزهري سمع من حبيب ولم يسمع من عروة، فماذا نسمي رواية الجماعة الناقصة؟",o:["مزيد في متصل الأسانيد.","مرسلاً خفياً.","متصلة صحيحة.","موضوعة."],a:1,e:"النص: 'فإذا كان الزائد هو الصَّواب تكون هذه زيادة ثقة والناقص يُسمَّى مرسلًا خفيًّا'."},
    {q:"يطلق ابن حجر مصطلح (المزيد في متصل الأسانيد) حصراً على الزيادة في الإسناد إذا حُكم بأنها (خطأ) من الراوي.",o:["صح","خطأ"],a:0,e:"النص: 'وهذا ما يُفهم من كلام ابن حجر... أنَّه يُطلَق المزيد على ما كانت زيادته خطأ، أمَّا الزِّيادة المقبولة فتُسمَّى زيادة ثقة'."},

    // --- المعنعن والمؤنن ---
    {q:"الحديث (المعنعن) هو ما رُوي بصيغة (عن)، وهي صيغة صريحة قطعية في إثبات السماع لغةً واصطلاحاً.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة مفاهيمية). النص: 'كلمة (عن) في اللغة تحتمل السَّماع، وتحتمل عدم السَّماع، فهي ليست صريحة بالسَّماع'."},
    {q:"كيف كان يحمل المحدثون (العنعنة) في الطبقات الأولى من الصحابة وكبار التابعين قبل ظهور التدليس؟",o:["على الانقطاع.","على الاتصال طالما أن التدليس لم يكن معروفاً.","على التوقف.","على الإرسال."],a:1,e:"النص: 'فكانت هي الاتّصال... محمولة على الاتصال طالما أنَّ التًّدليس لم يكن معروفًا'."},
    {q:"بعد شيوع التدليس، ما هما الشرطان اللذان وضعهما جمهور المحدثين لحمل العنعنة على الاتصال؟",o:["عدالة الراوي، وحفظه للقرآن.","إمكانية اللقاء بين الراوي والمروي عنه، والسلامة من التدليس.","ثبوت اللقاء، والتصريح بالسماع مرة واحدة على الأقل.","طول الصحبة، وعدم الشذوذ."],a:1,e:"النص: 'تُحمَل لفظ العنعنة والأنأنة على السَّماع بشرطين: إمكانية اللقاء؛ السلامة من التدليس'."},
    {q:"إذا روى (مدلس) حديثاً بصيغة (عن)، فإننا نقبله إذا ثبت أنه عاصر شيخه.",o:["صح","خطأ"],a:1,e:"خطأ. التدليس يمنع القبول إلا بالتصريح. النص: 'أمَّا الراوي المدلِّس إذا روى بصيغة العنعنة... إن لم يصرِّح بالسَّماع توقفنا فيها... في معنى الانقطاع الحكمي'."},
    {q:"رَدَّ الإمام (مسلم) بشدة في مقدمة صحيحه على من اشترط (ثبوت اللقاء/التصريح بالسماع) لغير المدلس، مكتفياً بـ (إمكانية اللقاء).",o:["صح","خطأ"],a:0,e:"النص: 'ورَدَّ الإمام مسلم في مقدِّمة صحيحه على من يشترط اللقاء... والراجح عند جمهور العلماء أنَّ العنعنة محمولة على الاتصال إلا إذا كان الراوي مدلِّسًا، وطالما هناك إمكانية اللقاء'."},
    {q:"الشرط الذي نُسب للإمام البخاري (اشتراط اللقاء أو التصريح بالسماع) يعتبره العلماء:",o:["شرطاً مطلقاً لصحة أي حديث في الدنيا.","شرطاً في (الأصحيَّة) والدرجة العليا، وليس شرطاً لرد بقية الأحاديث الصحيحة التي اكتفت بإمكانية اللقاء.","بدعة حديثية.","خاصاً بأحاديث العقائد."],a:1,e:"النص: 'والعلماء قالوا أنَّ هذا ليس شرطًا في الصِّحَّة، وإنَّما شرطٌ في الأصحيَّة؛ أي في الأعلى رتبة'."},
    {q:"الحديث (المؤنن) هو ما روي بصيغة (حدثنا فلان أن فلاناً قال).",o:["صح","خطأ"],a:0,e:"النص: 'الحديث المُؤَنَّن هو: أن يروي بصيغة (أنَّ)... يعني قال الراوي: أنَّ فلانًا قال'."},

    // --- المسلسل ---
    {q:"الحديث (المسلسل) هو:",o:["ما توالت فيه الروايات الضعيفة.","أن تتتابع في الرواة أو الرواية صفة أو حالة معينة (كفعل، أو قول، أو صفة للرواة).","ما كان إسناده مسلسلاً بالذهب.","ما رواه جماعة عن جماعة."],a:1,e:"النص: 'أن تتتابع في الرُّواة، أو في الرِّواية، صفةٌ أو حالة معينة... إمَّا الرُّواة على صفة واحدة، أو طريقة الرِّواية جاءت بأسلوب واحد'."},
    {q:"من فوائد الحديث المسلسل أنه يدل على دقة الضبط وزيادة الاتصال بالنبي ﷺ، ويقتضي بالضرورة أن يكون الحديث صحيحاً قطعي الثبوت.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة نهاية). النص: 'ولكن لا تقتضي أن يكون المسلسل صحيحًا، بل كثير من المسلسلات الشائعة اليوم ضعيفة أو لا تثبت'."},
    {q:"حديث معاذ (إني أحبك فلاتدع أن تقول...) يعتبر مسلسلاً بـ:",o:["المصافحة.","المشابكة.","المحبة (القولية).","الفقهاء."],a:2,e:"النص: 'فهذا مسلسل بالمحبة، كل راوٍ لما رواه لتلميذه أعاد ما سمع بنفس الطريقة'."},

    // --- العالي والنازل ---
    {q:"الإسناد (العالي) يتميز بـ:",o:["أن رواته من الأشراف والنبلاء.","قلة عدد رجاله إلى النبي ﷺ، أو تقدم سماع راويه، أو تقدم وفاة شيخه.","طول المتن.","كثرة المتابعات."],a:1,e:"النص: 'هو الذي قلَّ رجاله بالنسبة إلى غيره، مع الاتصال، أو مع تقدُّم سماع راويه، أو تقدُّم وفاة شيخه'."},
    {q:"(ثلاثيات البخاري) تعتبر من الأسانيد (النازلة) لمرور زمن طويل عليها.",o:["صح","خطأ"],a:1,e:"خطأ. تعتبر أسانيد عالية لقلة الوسائط. النص: 'وهذا حديث من ثلاثيَّات الإمام البخاري... رواية البخاري تسمى رواية عالية'."},
    {q:"في رواية عبد الرزاق الصنعاني (الذي اختلط سنة 200هـ)، تعتبر رواية الإمام أحمد عنه (أعلى) من رواية الدبري، والسبب هو:",o:["تقدم وفاة الإمام أحمد.","تقدم سماع الإمام أحمد منه قبل الاختلاط، بينما سمع الدبري متأخراً.","أن الإمام أحمد أحفظ.","أن الدبري مدلس."],a:1,e:"النص: 'الإمام أحمد سمع منه قبل الاختلاط، أما الدَّبَري سمع منه متأخرًا... العلو بتقدُّم السَّماع'."},
    {q:"العلو (بتقدم وفاة الشيخ) يظهر في مثال: راويان يرويان عن شيخين مختلفين، فإذا كان شيخ أحدهما توفي قبل 30 سنة من شيخ الآخر، فروايته تعتبر (أعلى).",o:["صح","خطأ"],a:0,e:"النص: 'يعني بينهما حوالي تسعة وعشرون سنة، فنقول رواية البيهقي أعلى؛ يعني وصل إلى شيخ توفي قبل ثلاثين سنة'."},
    
    // --- أسئلة استيعاب عميقة وإضافية لبلوغ العدد 60 بصرامة ---
    {q:"مَن مِن الأئمة رأى أن زيادة لفظ (تربتها) في حديث التيمم تخصص عموم الأرض فتُقبل ويُعمل بها في قصر التيمم على التراب؟",o:["أبو حنيفة.","الشافعي وأحمد.","مالك.","الدارقطني."],a:1,e:"النص: 'الزِّيادة تُقبَل، ونخصِّص بها العموم في الحديث السَّابق... وهذا مذهب الإمام الشافعي رحمه الله، والإمام أحمد'."},
    {q:"الحديث (المستور) أو الذي فيه (جهالة عين) هل يُرد مطلقاً ولا يتقوى؟",o:["نعم.","لا، الضعف هنا خفيف ناشئ عن عدم معرفة الإتقان، فينجبر بالمتابعات والشواهد.","نعم لأنه كذاب.","لا، يعتبر صحيحاً لذاته."],a:1,e:"النص: 'أو مستور: أي راوٍ معروف اسمه، ولكن لا نعرف إتقانه... إذن فالراوي في هذه الحالات كلها ليس كذابًا... ومثل هذا الحديث قد يتقوى'."},
    {q:"الاعتبار هو الخطوة (العملية) التي يقوم بها المُحدّث (للبحث) عن الشواهد والمتابعات قبل إصدار الحكم النهائي على الحديث.",o:["صح","خطأ"],a:0,e:"النص: 'وتُسمى هذه العملية البحثية والاستقصاء عن المتابعات التامة والقاصرة والشواهد باللفظ وبالمعنى بالاعتبار'."},
    {q:"صيغ مثل (ذكر) و(فعل) و(كان يقول) في السند تُعامل معاملة:",o:["التصريح بالسماع.","الإدراج.","العنعنة والأنأنة (تحتمل السماع وعدمه).","المزيد في متصل الأسانيد."],a:2,e:"النص: 'فلفظ: (ذَكَرَ) و(فعل) و(كان يقول) تحتمل السماع وعدمه في اللغة، فهذه صيغ أخرى ولكن الأشهر هو العنعنة'."},
    {q:"إذا روى (الشافعي) عن (مالك)، ثم وجدنا (ابن وهب) يروي عن (مالك) نفس الحديث، فرواية ابن وهب تُسمى:",o:["شاهد بالمعنى.","متابعة تامة.","متابعة قاصرة.","مسلسلة."],a:1,e:"النص: 'متابعة تامة: وهي أن يتلقَّ الراويان عن الشيخ نفسه مباشرة'."},
    {q:"ترخيص العلماء في العمل بالحديث الضعيف (ضعفاً خفيفاً) يكون في الأحكام الشرعية والعقائد فقط.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'إذا كان في فضائل الأعمال، أو في السير، أو في الترغيب والترهيب، ولا يرتبط به حكم شرعي في العقائد وغيرها'."},
    {q:"الحديث (المسلسل بالفقهاء) هو ما كان رواته بالترتيب كالإمام أحمد عن الشافعي عن مالك عن نافع عن ابن عمر.",o:["صح","خطأ"],a:0,e:"النص: 'والمسلسل بالفقهاء إذا كان كل الرواة فقهاء؛ رواه مثلًا الإمام أحمد، عن الشافعي، عن مالك، عن نافع'."},
    {q:"إذا اختلفت أنظار الفقهاء في (زيادة ثقة) فقبلها بعضهم وردها بعضهم، فهذا التناقض يقدح في (صحة) الرواية حديثياً.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'أما حديثيًّا ما عندنا تناقض، فالرِّواية رُويَت هكذا بإسناد صحيح... لكن يبقى النَّظر الفقهي هل يعمل المجتهد بالرِّواية'."},
    {q:"المتابعة (القاصرة) سميت بذلك لأنها:",o:["تقصر عن رفع درجة الحديث.","تقصر عن شيخ الراوي الأول، وتلتقي معه في شيخ شيخه أو من فوقه.","تقتصر على اللفظ دون المعنى.","رواتها قُصَّر في الحفظ."],a:1,e:"النص: 'متابعة قاصرة: وهي أن يتابع هذا الراوي راوٍ آخر لكن ليس عن شيخه... بل يلتقي مع شيخ شيخي'."},
    {q:"الحديث (الشاهد) يفترق عن (المتابعة) في نقطة جوهرية وهي:",o:["المتابعة في المتن، والشاهد في السند.","الشاهد يكون عن (صحابي آخر)، والمتابعة تكون في نفس حديث (الصحابي الأول).","لا فرق بينهما.","المتابعة أقوى من الشاهد."],a:1,e:"النص: 'الشاهد هو: أن يُرْوَى عن صحابي آخر... أما الإسناد فله صحابي آخر مختلف تماما'."},
    {q:"عكس الإسناد (العالي) هو الإسناد:",o:["الموقوف.","المقطوع.","النازل.","المنقطع."],a:2,e:"النص: 'وعكس العالي الإسناد النَّازل'."},
    {q:"السبب في وضع قواعد العلوم (ومنها الحديث) يعود إلى:",o:["الفراغ العلمي.","ضعف الملكات والقدرة على الإحاطة والاستيعاب التلقائي.","أوامر السلاطين.","تيسير الطباعة."],a:1,e:"النص: 'بدأت تضعف الملكات والقدرة على الإحاطة والاستيعاب فوضعت هذه القواعد'."},
    {q:"الإمام (الدارقطني) ضُرب به المثل في هذا الدرس على أنه يمثل:",o:["التساهل المطلق في التصحيح.","من يُنسب إليه (رد زيادة الثقة مطلقاً).","من اشترط اللقاء في المعنعن.","من أدخل الإسرائيليات."],a:1,e:"النص: 'الرأي الآخر أن الزيادة لا تقبل مطلقًا، ويؤخذ بالحديث الأنقاص، وهذا نسب إلى بعض العلماء؛ مثل الدارقطني'."},
    {q:"الحديث الضعيف بسبب سوء حفظ راويه، إذا وجدنا له شاهداً بـ (المعنى) من طريق ضعيف أيضاً، فإنه قد يرتقي إلى:",o:["موضوع.","حسن لذاته.","حسن لغيره.","متواتر."],a:2,e:"النص: 'فهاتان الروايتان تقويان بعضهما... فيرتفع الحديث الضعيف ضعفًا خفيفًا، ويصبح حديثًا حسنًا لغيره'."},
    {q:"في مثال حديث (الحولاء)، الرواية التي فيها (حبيب مولى عروة) والرواية التي أسقطته كلاهما متصلة ظاهراً ورواتهما ثقات، مما يحتم دراسة متأنية لترجيح الصواب بينهما.",o:["صح","خطأ"],a:0,e:"النص: 'والرواة كلهم ثقات... فنحتاج أن ننظر: قد تكون الرِّواية المزيدة صحيحة... أو الرِّواية الأوَّلى هي الصَّحيحة'."},
    {q:"الإجازات المفتوحة والمشافهات المنتشرة اليوم عبر وسائل التواصل تعتبر تطبيقاً أصيلاً للحديث (المسلسل) الذي يفيد صحة المتون.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'ولذلك اليوم شاع على وسائل التواصل المسلسل بكذا... والإجازات المفتوحة... لا تقتضي أن يكون المسلسل صحيحًا'."},
    {q:"الحديث المُؤَنَّن هو من قبيل الحديث المرفوع دائماً ولا علاقة له بصيغة الأداء.",o:["صح","خطأ"],a:1,e:"خطأ. المؤنن متعلق بصيغة الأداء (أن فلاناً قال). النص: 'الحديث المُؤَنَّن هو: أن يروي بصيغة (أنَّ)'."},
    {q:"وفق رأي الجمهور، العنعنة في العصور المتقدمة (قبل ظهور التدليس) كانت تعني وتُحمل على:",o:["الانقطاع.","الاتصال والسماع.","التدليس.","التوقف."],a:1,e:"النص: 'فكانت هي الاتّصال؛ لذلك كثير من التابعين والصَّحابة يقول: (عن، عن...) ويقصد بها السَّماع'."},
    {q:"الشرط الأساسي في ترقية الحديث الضعيف هو أن يكون الضعف (خفيفاً) كالاختلاط أو سوء الحفظ لا الكذب والفسق.",o:["صح","خطأ"],a:0,e:"النص: 'أن يكون الضعف ضعفًا خفيفًا... فالفاسق والكذّاب لا يُنظر له'."},
    {q:"خلاصة منهج علم الحديث هي أنه علم (مفاتيح) يفتح الأبواب، والتمرس فيه يحتاج إلى غوص وتدريب عملي تفصيلي.",o:["صح","خطأ"],a:0,e:"النص: 'إنما هي تعطي الباحث وطالب العلم... مفاتيح أساسية فقط، وتترك له بعد ذلك أن يخوض في هذا العلم وأن يلج أغواره'."}
];

let currentQ = 0;
let userAns = new Array(qd.length).fill(null);

const qText = document.getElementById('q-text');
const optionsList = document.getElementById('options-list');
const btnNext = document.getElementById('btn-next');
const btnPrev = document.getElementById('btn-prev');
const progText = document.getElementById('progress-text');
const fbBox = document.getElementById('feedback-box');
const fbText = document.getElementById('feedback-text');

function loadQ(idx) {
    const data = qd[idx];
    qText.textContent = `${idx + 1}. ${data.q}`;
    progText.textContent = `السؤال ${idx + 1} من ${qd.length}`;
    
    optionsList.innerHTML = '';
    fbBox.style.display = 'none';

    data.o.forEach((opt, i) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        const radio = document.createElement('input');
        radio.type = 'radio'; radio.name = 'opt'; radio.value = i;
        const span = document.createElement('span'); span.textContent = opt;

        li.appendChild(radio); li.appendChild(span);

        if(userAns[idx] !== null) {
            li.classList.add('disabled'); radio.disabled = true;
            if(i === data.a) li.classList.add('correct');
            else if(i === userAns[idx]) li.classList.add('wrong');
        }

        li.addEventListener('click', () => {
            if(userAns[idx] === null) {
                radio.checked = true; handleAns(idx, i);
            }
        });

        optionsList.appendChild(li);
    });

    if(userAns[idx] !== null) showFb(data.e);
    btnPrev.disabled = idx === 0;
    btnNext.textContent = idx === qd.length - 1 ? 'إنهاء التقييم الصارم' : 'التالي';
}

function handleAns(idx, sel) {
    userAns[idx] = sel;
    const data = qd[idx];
    const items = optionsList.querySelectorAll('.option-item');
    items.forEach((item, i) => {
        item.classList.add('disabled');
        item.querySelector('input').disabled = true;
        if (i === data.a) item.classList.add('correct');
        else if (i === sel && sel !== data.a) item.classList.add('wrong');
    });
    showFb(data.e);
}

function showFb(text) { fbText.textContent = text; fbBox.style.display = 'block'; }

btnNext.addEventListener('click', () => {
    if (currentQ < qd.length - 1) {
        currentQ++; loadQ(currentQ);
    } else {
        let score = userAns.filter((ans, i) => ans === qd[i].a).length;
        document.getElementById('quiz-body').innerHTML = `
            <div style="text-align:center; padding: 50px 20px;">
                <h2 style="color:var(--secondary); font-size: 2.3em; margin-bottom: 20px;">اكتمل الاختبار المتقدم (المحاضرة الرابعة عشرة)!</h2>
                <div style="background: #fff; border-radius: 12px; padding: 30px; font-size: 1.6em; border: 3px solid var(--correct-border); display: inline-block;">
                    حصيلتك المعرفية: <br> 
                    <strong style="color: var(--accent); font-size: 2.8em;">${score}</strong> من أصل 60
                </div>
                <p style="color: #455a64; margin-top: 25px; font-size: 1.25em; font-weight: bold;">أتممت دراسة مصطلح الحديث بامتياز! أثبتّ قدرتك على تفكيك المتابعات والشواهد وفهم دقائق زيادة الثقة.</p>
            </div>
        `;
        document.querySelector('.nav-buttons').style.display = 'none';
    }
});

btnPrev.addEventListener('click', () => { if (currentQ > 0) { currentQ--; loadQ(currentQ); } });

loadQ(0);
</script>
</body>
</html>
