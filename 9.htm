<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار الاستنباطي المتقدم: المحاضرة التاسعة - أنواع الانقطاع والتدليس</title>
    <style>
        :root { --primary: #283747; --secondary: #1f618d; --accent: #c0392b; --correct-bg: #d5f5e3; --correct-border: #2ecc71; --wrong-bg: #fadbd8; --wrong-border: #e74c3c; --text: #1c2833; --bg: #eaeded; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .quiz-container { background: #fff; max-width: 950px; width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 40px; box-sizing: border-box; border-top: 6px solid var(--accent); }
        .header { text-align: center; border-bottom: 2px solid #d5dbdb; padding-bottom: 15px; margin-bottom: 30px; }
        .header h2 { color: var(--primary); margin: 0; font-size: 1.95em; }
        .progress { color: var(--accent); font-weight: bold; margin-top: 10px; font-size: 1.2em; }
        .question-text { font-size: 1.45em; font-weight: bold; color: var(--secondary); margin-bottom: 25px; line-height: 1.6; }
        .options-list { list-style: none; padding: 0; margin: 0; }
        .option-item { background: #f8f9f9; border: 2px solid #d5dbdb; border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; font-size: 1.15em; display: flex; align-items: center; }
        .option-item:hover:not(.disabled) { background: #e8f8f5; border-color: #76d7c4; }
        .option-item input { margin-left: 15px; transform: scale(1.4); cursor: pointer; }
        .option-item.disabled { cursor: not-allowed; opacity: 0.9; }
        .option-item.correct { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #145a32; font-weight: bold; }
        .option-item.wrong { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: #78281f; text-decoration: line-through; }
        .feedback-box { display: none; background: #fdfefe; border-right: 5px solid var(--accent); padding: 15px 20px; margin-top: 25px; border-radius: 5px; font-size: 1.1em; line-height: 1.7; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .feedback-box span { font-weight: bold; color: var(--accent); display: block; margin-bottom: 8px; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #d5dbdb; padding-top: 20px; }
        .btn { background: var(--secondary); color: #fff; border: none; padding: 12px 35px; border-radius: 6px; font-size: 1.15em; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn:hover:not(:disabled) { background: var(--primary); }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>الاختبار الاستنباطي المتقدم: المحاضرة التاسعة</h2>
        <div class="progress" id="progress-text">السؤال 1 من 60</div>
    </div>
    <div id="quiz-body">
        <div class="question-text" id="q-text"></div>
        <ul class="options-list" id="options-list"></ul>
        <div class="feedback-box" id="feedback-box">
            <span>التأصيل المنهجي (مستنبط من النص):</span>
            <p id="feedback-text"></p>
        </div>
    </div>
    <div class="nav-buttons">
        <button class="btn" id="btn-prev" disabled>السابق</button>
        <button class="btn" id="btn-next">التالي</button>
    </div>
</div>

<script>
const qd = [
    // --- المحور الأول: مرسل الصحابي ---
    { q: "رواية السيدة عائشة لقصة بدء الوحي في غار حراء تعتبر مثالاً صريحاً على مرسل الصحابي، لأنها:", o: ["لم تكن متزوجة من النبي حينها.", "لم تكن قد وُلدت بعد في ذاك الزمان.", "سمعتها من أبي هريرة.", "نسيت من أخبرها بها."], a: 1, e: "النص: 'أين كانت أم المؤمنين عند بدء الوحي؟ فهي لم تكن قد ولدت بعد... ورغم هذا تروي الحديث، فإذن من الممكن أن يسمى مرسل الصحابي'." },
    { q: "بناءً على رأي جماهير أهل العلم، مرسل الصحابي يُرد ولا يُحتج به لاحتمال أن يكون الصحابي قد رواه عن تابعي ضعيف.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). النص: 'متصل حكماً لا يضره الإرسال... ذلك أن الصحابي لا يروي غالباً إلا عن صحابي آخر وكل الصحابة عدول، ورواية الصحابي عن تابعي نادرة جداً'." },
    { q: "ما الدلالة الاستنباطية من قصة تناوب عمر بن الخطاب وجاره الأنصاري على النزول للنبي ﷺ؟", o: ["أن عمر كان فقيراً.", "أن الصحابة كانوا ينقلون عن بعضهم البعض وهم على ثقة تامة (عدول)، مما يؤكد صحة مرسل الصحابي.", "أن الصحابة لا يقبلون المراسيل.", "وجوب تفرغ طالب العلم."], a: 1, e: "النص: 'فهنا إذن إذا روى سيدنا عمر الحديث عن جاره... فهو قطعاً خبر موثق... فهم يروون عن بعضهم بعضاً ولا حرج'." },
    { q: "من هو الإمام الأصولي الذي شذ وقال إن مرسل الصحابي ليس بحجة (إلا إن تبين أنه لا يرسل إلا عن صحابي)، ووافقه ابن حزم؟", o: ["الإمام الشافعي.", "أبو إسحاق الإسفراييني.", "الإمام مالك.", "ابن الصلاح."], a: 1, e: "النص: 'رأي لأحد الأئمة الأصوليين وهو الإمام أبو إسحاق الإسفراييني أن مرسل الصحابي ليس بحجة... وهذا الرأي مما قاله ابن حزم الظاهري'." },
    { q: "مرسل الصحابي يندرج بالكامل تحت أحكام (الحديث المرسل) الضعيف، ويعامل نفس معاملته عند المحدثين.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'مرسل الصحابي لا يندرج تحت الحديث المرسل، وهو حديث متصل صحيح لا غبار عليه'." },
    { q: "صغار الصحابة كابن عباس وأبي موسى الأشعري، إذا رووا عن النبي ﷺ مباشرة دون ذكر الواسطة، فحديثهم:", o: ["ضعيف لانقطاعه.", "متصل صحيح لا غبار عليه عند أهل العلم.", "حسن لغيره.", "موضوع."], a: 1, e: "النص: 'حتى وإن كانوا من صغار الصحابة كابن عباس وعائشة وأبي موسى... فهؤلاء عند أهل العلم حديثهم متصل صحيح لا غبار عليه'." },
    
    // --- المحور الثاني: المنقطع ---
    { q: "وفقاً لتعريف (الجمهور)، الحديث المنقطع هو ما سقط من سنده راويان على التوالي قبل الصحابي.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). النص: 'المنقطع على مذهب الجمهور: هو ما سقط من سنده قبل الصحابي (راوٍ واحد) في موضع واحد أو أكثر'." },
    { q: "إذا روى الزهري عن ابن عمر حديثاً، وأسقط الواسطة بينهما (سالم)، وفي نفس الإسناد أسقط راوٍ آخر شيخه (غير متواليين)، فماذا يسمى؟", o: ["معضلاً.", "منقطعاً في موضعين.", "مرسلاً.", "معلقاً."], a: 1, e: "النص: 'طالما الساقط هو واحد فقط، ولو في موضعين أو ثلاثة، لكن ليس على التوالي؛ فهذا يسمى حديثاً منقطعاً في موضعين'." },
    { q: "لماذا اشترط الجمهور في تعريف المنقطع (ما سقط قبل الصحابي)؟", o: ["لأن الصحابة لا يروون الحديث.", "كاحتراز دقيق لإخراج (الحديث المرسل) الذي يسقط فيه الصحابي، فالمرسل لا يسمى منقطعاً على هذا التعريف.", "لأن التابعين ضعفاء.", "لأن الحديث يصبح متواتراً."], a: 1, e: "النص: 'لأنه لو سقط الصحابي يسمى حديثاً مرسلاً، وبالتالي المرسل لا يسمى منقطعاً على هذا التعريف'." },
    { q: "على رأي الإمام (ابن عبد البر)، مصطلح المنقطع يطلق على كل انقطاع في السند، فيشمل المرسل والمعضل والمعلق.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'المنقطع هو ما لم يتصل بحال... فالمنقطع يصبح هو الدائرة الأم، وكل انقطاع في السند يصبح منقطعاً'." },
    { q: "ما هو الإشكال في قول الحاكم عن المنقطع بأنه: (ما سقط قبل التابعي) بدلاً من (قبل الصحابي)؟", o: ["أنه يُخرج المرسل.", "أنه يُدخل (المرسل) ضمن المنقطع، لأن المرسل يسقط فيه ما بعد التابعي (الصحابي)، وعبارته مشكلة في هذا.", "أنه يجعله متصلاً.", "أنه يرفض رواية التابعي."], a: 1, e: "النص: 'يوجد هنا إشكال من المفترض أن يقول: ما سقط قبل الصحابي وليس التابعي، حتى يُخرج المرسل'." },
    { q: "الراوي (المبهم) كأن يقول: 'حدثني شيخ أو رجل'، يعتبره الجمهور حديثاً منقطعاً كالإمام الحاكم تماماً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). النص: 'الإشكال الآخر: هو أن المبهم عند الجمهور لا يسمى منقطعاً... وإنما يسمى متصلاً فيه رجل مبهم'." },
    { q: "من هو الإمام الذي يطلق على (الحديث المنقطع) مصطلح (المقطوع) بعكس استخدام المحدثين المتأخرين؟", o: ["الإمام مالك.", "الإمام الشافعي والإمام الطبراني.", "الإمام البخاري.", "ابن عبد البر."], a: 1, e: "النص: 'يسمي الشافعي الحديث المنقطع مقطوعاً... يطلق المقطوع على المنقطع'." },
    { q: "حكم الحديث المنقطع هو الضعف دائماً، والسبب يكمن في:", o: ["جهالة الساقط، فقد يكون ضعيفاً أو كذاباً.", "أن الراوي الذي فوقه كذاب.", "لأنه يخالف القرآن.", "لأن التابعين لم يكتبوا الحديث."], a: 0, e: "النص: 'لأنه جُهل الساقط منه، فربما يكون الساقط ضعيفاً كذاباً... طالما هناك احتمال نحكم على الحديث بالضعف'." },
    { q: "رواية أبي عبيدة عن أبيه ابن مسعود تعتبر (متصلة) لأن الابن يروي عن أبيه وهو أدرى الناس به.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'روايته هذه قال عنها العلماء منقطعة؛ لأن أبو عبيدة لم يسمع من أبيه، بل مات أبوه وهو صغير'." },

    // --- المحور الثالث: المعضل ---
    { q: "يُعرف الحديث (المعضل) بأنه:", o: ["ما سقط من سنده راويان فأكثر على التوالي في أي موضع.", "ما سقط من سنده الصحابي فقط.", "ما سقط منه راويان غير متواليين.", "ما روي بصيغة العنعنة."], a: 0, e: "النص: 'قالوا في تعريف الحديث المعضل أنه: ما سقط منه راويان فأكثر على التوالي، في أي موضع كان السقط'." },
    { q: "الحديث المعضل يُعتبر أقوى من المنقطع لأن الانقطاع فيه مزدوج مما يؤكد شهرة الحديث.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). النص: 'بالطبع ضعيف، بل أشد ضعفاً من المنقطع... انقطاع اثنين زاد الفجوة في الإسناد'." },
    { q: "إذا قام الراوي بإسقاط (الصحابي والتابعي معاً) ورواه عن النبي ﷺ مباشرة، فما هو الوصف الدقيق للإسناد؟", o: ["منقطع.", "معلق.", "مرسل ومعضل في نفس الوقت.", "صحيح."], a: 2, e: "النص: 'أسقط الصحابي والتابعي؛ فهذا يسمى أيضاً مرسلاً ومعضلاً'." },
    { q: "قول المحدثين لحديث ما أنه (لا أصل له) هو مرادف تماماً لقولهم إنه (معضل).", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'لا... كلمة لا أصل له يعني كأنه موضوع مكذوب... أما هذا السند قد يكون معضلاً وربما جاء برواية أخرى متصلة'." },
    { q: "تعتبر (بلاغات الإمام مالك) المرفوعة للنبي ﷺ في الموطأ، من قبيل الأحاديث المعضلة لأن:", o: ["مالكاً لا يوثق به.", "بين مالك والنبي ﷺ فجوة زمنية تسع لاثنين على الأقل (تابعي وصحابي)، فيحكم بسقوط اثنين متواليين بناءً على التاريخ.", "مالكاً أسقط الصحابي فقط.", "مالكاً كان في الأندلس."], a: 1, e: "النص: 'أكيد بين الإمام مالك وبين النبي ﷺ اثنين على الأقل تابعي وصحابي، ولذلك تسمى بلاغات الإمام مالك معضلات'." },
    { q: "إذا قال الإمام البخاري (وقال رسول الله ﷺ) حاذفاً كل الإسناد، فإن هذا يُعد (معلقاً ومعضلاً) في آن واحد.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'حذف الإسناد كله؛ فهذا معلق ومعضل'." },
    
    // --- المحور الرابع: التدليس وأنواعه ---
    { q: "ما هو التعريف اللغوي والاصطلاحي الدقيق للتدليس؟", o: ["هو الكذب الصريح على النبي.", "هو الإخفاء (دلس عليه)، وهو أن يروي الراوي حديثاً فيه شبهة انقطاع أو إيهام في اسم راوٍ ببراعة دون كذب صريح.", "هو رواية الحديث بالمعنى.", "هو كتابة الحديث بدون نقاط."], a: 1, e: "النص: 'والتدليس في اللغة: هو الإخفاء... التدليس ليس كذباً، وإنما هو يعنِي براعة في الإخفاء'." },
    { q: "الراوي المُدلس يُعتبر (كذاباً) ومتروك الحديث مطلقاً بمجرد اكتشاف تدليسه.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). النص: 'ولكنه مختلف عن الكذب، فالراوي المدلس ليس راوٍ كذاب... فقد يكون راوياً ثقة وهو يدلس أحياناً'." },
    { q: "الشرط الأساسي في (تدليس الإسناد) أن يقول المدلس: (حدثني فلان) وهو لم يسمع منه ليوهم الناس بالاتصال.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). لو قال (حدثني) وهو لم يسمع لأصبح (كذاباً). النص: 'أما لو قال: حدثنا فلان وهو لم يسمع؛ فهذا يصبح راوياً كذاباً... فيروي بصيغة توهم الرواية (عن/قال)'." },
    { q: "من أشد أنواع التدليس وأكثرها ذماً (تدليس التسوية)، وصورته:", o: ["أن يغير اسم البلد.", "أن يسقط راوياً ضعيفاً كان بين ثقتين (لقي أحدهما الآخر)، ليوهم أن الإسناد كله ثقات متصل.", "أن يروي عن مجنون.", "أن يسقط الصحابي."], a: 1, e: "النص: 'أن يروي الراوي حديثاً من طريق راوٍ ضعيف بين ثقتين... فيسقط الضعيف ويرويه عن الثقتين موهماً اتصاله'." },
    { q: "الراوي (بقية بن الوليد) اشتهر بتدليس التسوية، حيث كان يسقط الرواة المتروكين (كابن أبي فروة) بين ثقتين ويُكني الثقة للتمويه.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'فبقية أسقط راوياً ضعيفاً بين ثقتين... وكنّى عبيد الله بكنية لا يعرفها... هذا يسمى تدليس التسوية'." },
    { q: "ما هو (تدليس القطع)؟", o: ["قطع ورقة المخطوطة.", "أن يصرح بالتحديث ويعطف عليه شيخاً آخر لم يسمعه.", "أن يروي عمن سمع منه ما لم يسمعه منه (دون أن يذكر أداة السماع أصلاً كـ حدثنا أو عن).", "أن ينقطع عن طلب العلم."], a: 2, e: "النص: 'دون أن يذكر لفظ الأداء... دون أن يقول عن أو حدثنا... فحذف لفظ الأداء مباشرة'." },
    { q: "إذا قال الراوي (حدثنا فلان و فلان)، وهو سمع من الأول ولم يسمع من الثاني، فهذا يسمى:", o: ["تدليس القطع.", "تدليس التسوية.", "تدليس العطف.", "تدليس البلاد."], a: 2, e: "النص: 'تدليس العطف... أن يصرح بالتحديث عن شيخ ويعطف عليه شيخاً آخر لم يسمعه منه'." },
    { q: "تدليس الشيوخ (كالذي يفعله الراوي الكلبي لتكثير شيوخه) يعني:", o: ["أن يُغير اسم شيخه أو كنيته بلقب صحيح لكنه (غير مشهور) تعميةً لأمره وإخفاءً لضعفه.", "أن يخترع شيخاً لا وجود له.", "أن يقتل شيخه.", "أن يسرق كتب شيخه."], a: 0, e: "النص: 'أن يسمي شيخه، أو يكنيه... على خلاف ما اشتهر به تعمية لأمره... مثل الراوي الضعيف الكلبي'." },
    { q: "صنيع ابن دقيق العيد حين سأل الإمام الذهبي عن (أبو محمد الهلالي) قاصداً سفيان بن عيينة، يعتبر تدليساً شنيعاً ومحرماً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). النص: 'ومن الأسباب اختبار الطلبة، وهذا وقع كثيراً وفيه مصلحة... فهذا من باب الاختبار لا حرج فيه'." },
    { q: "إذا قال راوٍ مصري (حدثني فلان بالأندلس) وهو يقصد حياً في القاهرة، فهذا يسمى:", o: ["تدليس الشيوخ.", "تدليس البلاد (إيهام الرحلة لتكثير الشيوخ والأسانيد العالية).", "تدليس التسوية.", "حديثاً معضلاً."], a: 1, e: "النص: 'هناك نوع آخر من التدليس يسمى تدليس البلاد... فنظن أن فلاناً رحل إلى الأندلس، والحقيقة أن الأندلس حي في القاهرة'." },
    
    // --- المحور الخامس: حكم المدلس وأسئلة إضافية (تعبئة إلى 60 بذكاء) ---
    { q: "إذا كان الراوي المدلس (ثقة) كالأعمش وقتادة، وروى الحديث بصيغة (صريحة في السماع) مثل: حدثنا أو سمعت، فما حكم حديثه؟", o: ["ضعيف لأنه مدلس.", "متصل صحيح لا غبار عليه وتقبل روايته.", "حسن لغيره.", "موضوع."], a: 1, e: "النص: 'فلو حدّث بصريح السماع تقبل الرواية وتكون صحيحة... حديثه متصل صحيح لا غبار عليه'." },
    { q: "الأحاديث التي رويت بـ (العنعنة) من رواة مدلسين في (صحيح البخاري ومسلم) تعتبر ضعيفة ومنقطعة حكماً ولكن البخاري أخرجها تساهلاً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). النص: 'محمولة على الاتصال وأنهم صرحوا بالسماع في رواية أخرى... لأن الإمامان ينتقيان بدقة الأحاديث الصحيحة'." },
    { q: "المنهجية الصحيحة للتعامل مع ابن إسحاق في (السيرة والمغازي) هي:", o: ["رفض كل ما ينقله لتدليسه.", "قبول كل ما ينقله حتى لو خالف الثقات.", "قبول رواياته في السيرة لضبطه لها (ما لم تخالف الأصح أو تشتد نكارتها)، ولكن يُشترط السماع في أحاديث الأحكام الفقهية.", "تقسيم السيرة لـ صحيح السيرة وضعيف السيرة بقسوة المحدثين."], a: 2, e: "النص: 'أما مروياته في السيرة فتحكم بميزان له خصوصية... البخاري اعتمد في ذكر أول غزوة على ابن اسحاق... لكن في الحكم الشرعي لا يقبل هكذا'." },
    { q: "عصر التابعين يعتبر قرناً منفصلاً بدأ بعد وفاة آخر صحابي تماماً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'فعصر التابعين يبدأ من عصر الصحابة، بل من عصر النبي ﷺ... أويس القرني كان مسلماً في عصر النبي ولكن لم يلتق به'." },
    { q: "هل تعتبر (ثلاثيات البخاري) أحاديث معضلة لوجود فجوة زمنية؟", o: ["نعم.", "لا، هي أسانيد متصلة بأعلى درجات العلو، تحققت بطول عمر الرواة (ثلاثة رجال فقط للوصول للنبي).", "هي أحاديث مرسلة.", "هي أحاديث موقوفة."], a: 1, e: "النص: 'لا... فالإمام البخاري وصل إلى النبي ﷺ عن طريق ثلاثة رجال... طال عمر كل واحد'." },
    { q: "رواية الصحابي الصغير (كابن عباس) لقصة حدثت قبل إسلامه تعتبر مرسلاً ضعيفاً عند المحدثين.", o: ["صح", "خطأ"], a: 1, e: "خطأ. هذا (مرسل صحابي) وهو متصل صحيح عند جماهير العلماء." },
    { q: "الفرق بين المدلس والكذاب أن الكذاب يصرح بالسماع (حدثني) كذباً، بينما المدلس يكتفي بالعنعنة والإيهام.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'أما لو قال: حدثنا فلان وهو لم يسمع؛ فهذا يصبح راوياً كذاباً، فميزوا معي بدقة'." },
    { q: "تدليس (الشيوخ) أشد ذماً وضدية من تدليس (الإسناد) لأنه يصعب اكتشافه.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'وتدليس الشيوخ أخف من تدليس الإسناد؛ لأنه غالباً ما يتم اكتشافه'." },
    { q: "المنقطع على رأي ابن عبد البر يشمل المرسل والمعضل.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'فالمنقطع يصبح هو الدائرة الأم، وكل انقطاع في السند يصبح منقطعاً'." },
    { q: "من هو الإمام الذي قال عنه الذهبي إنه اختبره في اسم (أبو محمد الهلالي)؟", o: ["البخاري.", "ابن دقيق العيد.", "العلائي.", "ابن أبي حاتم."], a: 1, e: "النص: 'فعلها الإمام ابن دقيق العيد... عندما جاءه الإمام الذهبي'." },
    { q: "كتاب (جامع التحصيل في أحكام المراسيل) ألفه الإمام:", o: ["ابن أبي حاتم.", "البرديجي.", "العلائي.", "الشافعي."], a: 2, e: "النص: 'الإمام الحافظ العلائي في كتابه جامع التحصيل'." },
    { q: "مرسل الصحابي يُحتج به إجماعاً بدون أي رأي مخالف في التاريخ الإسلامي.", o: ["صح", "خطأ"], a: 1, e: "خطأ. خالف فيه أبو إسحاق الإسفراييني وابن حزم." },
    { q: "من أمثلة تدليس البلاد قول البغدادي (مما وراء النهر) ويقصد نهر دجلة لا بلاد ما وراء النهر (خراسان).", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'فنظن أنه رحل إلى خرسان... فإذا به يقصد نهر دجلة'." },
    { q: "الراوي (عطية العوفي) كان يكنّي (الكلبي) بأبي سعيد ليوهم الناس أنه أبو سعيد الخدري.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'كان عطية يأتي الكلبي... وكان يكنيه بأبي سعيد... والناس تظن أنه أبو سعيد الخدري'." },
    { q: "تدليس التسوية يقتصر على إسقاط شيخ الراوي فقط.", o: ["صح", "خطأ"], a: 1, e: "خطأ. تدليس التسوية يسقط راوياً (بين ثقتين) أي شيخ شيخه أو أبعد لتسوية السند." },
    { q: "كتاب (التأسيس والتبيين لأسماء المدلسين) ألفه السبط بن العجمي للحافظ ابن حجر.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: '(التأسيس والتبيين لأسماء المدلسين) للإمام سبط بن عجمي للحافظ بن حجر'." },
    { q: "الحارث بن أبي أسامة كان يدلس الشيوخ لأنه يستحي أن يروي عمن هو أصغر منه سناً (ابن أبي الدنيا).", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'قد يأنف الراوي أن يروي عمن هو أصغر منه... الحارث أكبر من شيخه ابن أبي الدنيا، فلذلك كان يدلس حرجاً'." },
    { q: "العنعنة (عن فلان) تعتبر تصريحاً بالسماع عند المحدثين تمنع تدليس المدلس.", o: ["صح", "خطأ"], a: 1, e: "خطأ. العنعنة ليست صريحة بالسماع، والمدلس إذا عنعن يُتوقف فيه." },
    { q: "ابن تيمية والذهبي وابن كثير اعتمدوا على ابن إسحاق في السيرة كحجة قوية إذا لم يُخالف.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'ابن كثير... والذهبي... وابن تيمية... اعتمدوا على أحداث للسيرة قالها ابن إسحاق وحده... فاعتمدوه في هذا الباب'." },
    { q: "مذهب الحاكم النيسابوري في المبهم أنه حديث متصل لا غبار عليه.", o: ["صح", "خطأ"], a: 1, e: "خطأ. الحاكم اعتبر المبهم من قبيل (المنقطع). الجمهور هو من اعتبره متصلاً فيه راوٍ مبهم." },
    { q: "إذا سقط راويان غير متواليين فهو:", o: ["معضل.", "منقطع في موضعين.", "مرسل.", "مسند."], a: 1, e: "النص: 'طالما الساقط هو واحد فقط، ولو في موضعين أو ثلاثة، لكن ليس على التوالي؛ فهذا يسمى حديثاً منقطعاً في موضعين'." },
    { q: "سفيان بن عيينة هو الملقب بـ (أبو محمد الهلالي) في قصة اختبار الذهبي.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'من هو أبو محمد الهلالي؟ فقال الذهبي: هو سفيان بن عيينة'." },
    { q: "قول البيقوني (وكل ما لم يتصل بحال إسناده منقطع الأوصال) يوافق رأي الجمهور بدقة.", o: ["صح", "خطأ"], a: 1, e: "خطأ. يوافق رأي (ابن عبد البر) الذي وسع المنقطع ليشمل كل انقطاع." },
    { q: "إذا قال الراوي (أن فلاناً قال) فهذه صيغة صريحة بالسماع تنفي التدليس.", o: ["صح", "خطأ"], a: 1, e: "خطأ. هي من صيغ (المعنعن والمؤنأن) التي تحتمل الواسطة ولا تصرح بالسماع." },
    { q: "المنقطع هو الدائرة الأم في اصطلاح المتأخرين.", o: ["صح", "خطأ"], a: 1, e: "خطأ. في اصطلاح المتأخرين المنقطع نوع (مستقل). اصطلاح المتقدمين (كابن عبد البر) هو من جعله دائرة أم." },
    { q: "بقية بن الوليد كان يسقط (إسحاق بن أبي فروة) ويروي عن نافع مباشرة.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'يُسقط ابن أبي فروة ويرويه عن نافع... وهذا يسمى تدليس التسوية'." },
    { q: "حديث ضعيف أصالةً أخرجه البخاري ومسلم في صحيحيهما في الأصول (ليس في المتابعات).", o: ["صح", "خطأ"], a: 1, e: "خطأ. المحاضر نفاها تماماً: 'لا يوجد أحاديث متصلة الإسناد ضعيفة... رواية ضعيفة أخرجها أصالة البخاري ومسلم فهذا مردود وغير مقبول القول به'." },
    { q: "يحيى الأنصاري وهشام بن عروة وصفوا بالتدليس النادر الذي لا يُرد حديثهم بسببه.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'فيحيى الأنصاري وهشام بن عروة... نادرًا ما يسمى في زمرة المدلسين ولكن لا يُرَدّ حديثه'." },
    { q: "العلماء يُضَعِّفون المعضل بعبارة 'يروي المنقطعات'.", o: ["صح", "خطأ"], a: 1, e: "خطأ. بعبارة (يروي المعضلات) وهي أشد ضعفاً." },
    { q: "أبو النضر الكوفي هو نفسه محمد بن السائب الكلبي.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'واسمه الكامل محمد بن السائب... أبو النضر الكوفي'." }
];

let currentQ = 0;
let userAns = new Array(qd.length).fill(null);

const qText = document.getElementById('q-text');
const optionsList = document.getElementById('options-list');
const btnNext = document.getElementById('btn-next');
const btnPrev = document.getElementById('btn-prev');
const progText = document.getElementById('progress-text');
const fbBox = document.getElementById('feedback-box');
const fbText = document.getElementById('feedback-text');

function loadQ(idx) {
    const data = qd[idx];
    qText.textContent = `${idx + 1}. ${data.q}`;
    progText.textContent = `السؤال ${idx + 1} من ${qd.length}`;
    
    optionsList.innerHTML = '';
    fbBox.style.display = 'none';

    data.o.forEach((opt, i) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        const radio = document.createElement('input');
        radio.type = 'radio'; radio.name = 'opt'; radio.value = i;
        const span = document.createElement('span'); span.textContent = opt;

        li.appendChild(radio); li.appendChild(span);

        if(userAns[idx] !== null) {
            li.classList.add('disabled'); radio.disabled = true;
            if(i === data.a) li.classList.add('correct');
            else if(i === userAns[idx]) li.classList.add('wrong');
        }

        li.addEventListener('click', () => {
            if(userAns[idx] === null) {
                radio.checked = true; handleAns(idx, i);
            }
        });

        optionsList.appendChild(li);
    });

    if(userAns[idx] !== null) showFb(data.e);
    btnPrev.disabled = idx === 0;
    btnNext.textContent = idx === qd.length - 1 ? 'إنهاء التقييم الصارم' : 'التالي';
}

function handleAns(idx, sel) {
    userAns[idx] = sel;
    const data = qd[idx];
    const items = optionsList.querySelectorAll('.option-item');
    items.forEach((item, i) => {
        item.classList.add('disabled');
        item.querySelector('input').disabled = true;
        if (i === data.a) item.classList.add('correct');
        else if (i === sel && sel !== data.a) item.classList.add('wrong');
    });
    showFb(data.e);
}

function showFb(text) { fbText.textContent = text; fbBox.style.display = 'block'; }

btnNext.addEventListener('click', () => {
    if (currentQ < qd.length - 1) {
        currentQ++; loadQ(currentQ);
    } else {
        let score = userAns.filter((ans, i) => ans === qd[i].a).length;
        document.getElementById('quiz-body').innerHTML = `
            <div style="text-align:center; padding: 50px 20px;">
                <h2 style="color:var(--primary); font-size: 2.3em; margin-bottom: 20px;">اكتمل الاختبار المتقدم (المحاضرة التاسعة)!</h2>
                <div style="background: #fff; border-radius: 12px; padding: 30px; font-size: 1.6em; border: 3px solid var(--correct-border); display: inline-block;">
                    حصيلتك المعرفية: <br> 
                    <strong style="color: var(--secondary); font-size: 2.8em;">${score}</strong> من أصل 60
                </div>
                <p style="color: #455a64; margin-top: 25px; font-size: 1.25em; font-weight: bold;">أثبتّ براعتك في تمييز الانقطاع والتدليس وفك شفرات الأسانيد!</p>
            </div>
        `;
        document.querySelector('.nav-buttons').style.display = 'none';
    }
});

btnPrev.addEventListener('click', () => { if (currentQ > 0) { currentQ--; loadQ(currentQ); } });

// البدء
loadQ(0);
</script>
</body>
</html>
