<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار المتقدم: المحاضرة الرابعة - علوم الحديث</title>
    <style>
        :root {
            --primary: #2b3a42;
            --secondary: #3f5765;
            --accent: #e67e22;
            --correct-bg: #d4edda;
            --correct-border: #c3e6cb;
            --wrong-bg: #fff3cd;
            --wrong-border: #ffeeba;
            --text: #333;
            --bg: #f9f9f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background: #fff;
            max-width: 900px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            padding: 40px;
            box-sizing: border-box;
            border-top: 6px solid var(--accent);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .header h2 { color: var(--primary); margin: 0; font-size: 1.9em;}
        .progress { color: var(--accent); font-weight: bold; margin-top: 10px; font-size: 1.15em;}
        .question-text {
            font-size: 1.4em;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .options-list { list-style: none; padding: 0; margin: 0; }
        .option-item {
            background: #fdfdfd;
            border: 2px solid #eaeaea;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.15em;
            display: flex;
            align-items: center;
        }
        .option-item:hover:not(.disabled) { background: #f0f4f8; border-color: #d1d9e0; }
        .option-item input { margin-left: 15px; transform: scale(1.4); cursor: pointer; }
        .option-item.disabled { cursor: not-allowed; opacity: 0.95; }
        .option-item.correct { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #155724; font-weight: bold; }
        .option-item.wrong { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: #856404; text-decoration: line-through; }
        
        .feedback-box {
            display: none;
            background: #f4f6f7;
            border-right: 5px solid var(--accent);
            padding: 20px;
            margin-top: 30px;
            border-radius: 5px;
            font-size: 1.1em;
            line-height: 1.7;
        }
        .feedback-box span { font-weight: bold; color: var(--accent); display: block; margin-bottom: 8px;}
        
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 35px;
            border-top: 1px solid #eee;
            padding-top: 25px;
        }
        .btn {
            background: var(--secondary);
            color: #fff;
            border: none;
            padding: 12px 35px;
            border-radius: 6px;
            font-size: 1.15em;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background: var(--primary); }
        .btn:disabled { background: #d5dbdb; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>الاختبار الاستنباطي: المحاضرة الرابعة</h2>
        <div class="progress" id="progress-text">السؤال 1 من 60</div>
    </div>
    
    <div id="quiz-body">
        <div class="question-text" id="q-text"></div>
        <ul class="options-list" id="options-list"></ul>
        <div class="feedback-box" id="feedback-box">
            <span>التأصيل والتفسير (مقتبس من النص الحصري):</span>
            <p id="feedback-text"></p>
        </div>
    </div>
    
    <div class="nav-buttons">
        <button class="btn" id="btn-prev" disabled>السابق</button>
        <button class="btn" id="btn-next">التالي</button>
    </div>
</div>

<script>
const quizData = [
    // --- المحور الأول: طبيعة علم المصطلح وتاريخ تدوينه (1 - 10) ---
    { q: "ما المآل المنهجي لوصف المحاضر علم مصطلح الحديث بأنه (علم نظري كاشف) كدراسة الطب النظري؟", o: ["أنه علم لا قيمة له مقارنة بعلم الفقه.", "أن إتقان حفظ قواعده يمنح الطالب فوراً صلاحية نقد الأحاديث وتصحيحها.", "أن دراسته تمحو الأمية المنهجية لتفهم كلام العلماء، لكن النقد والتصحيح يتطلب ممارسة عملية (مشفى ميداني) تحت إشراف الأساتذة وطول قراءة في الأسانيد.", "أنه مقتصر على دراسة متون الأحاديث دون الأسانيد."], a: 2, e: "النص: 'لا يؤهل من يدرسه أن يكون ناقداً... بل يؤهله أن يكون فاهماً لمرام العلماء... كما يدرس الإنسان الطب نظرياً ولا يصبح طبيباً حتى يدخل المشفى الميداني'." },
    { q: "كتاب (مقدمة ابن الصلاح) يمثل التأسيس النظري الناضج لعلم المصطلح، وقد توالى العلماء على اختصاره، ومن أهم هذه الاختصارات (تدريب الراوي) للإمام السيوطي.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). تدريب الراوي ليس اختصاراً، بل هو (شرح موسع) لكتاب (التقريب والتيسير) للنووي، والذي هو بدوره اختصار لكتاب ابن الصلاح." },
    { q: "لماذا اعتبر المحاضر كتاب (نزهة النظر في توضيح نخبة الفكر) للحافظ ابن حجر علامة فارقة رغم صغر حجمه؟", o: ["لأنه أول كتاب أُلِّف في مصطلح الحديث تاريخياً.", "لأنه مكنوز بالفوائد مليء بالمباحث، وقد عكف عليه العلماء دراسة واستخلاصاً لكون مؤلفه خاتمة المحققين وأمير المؤمنين في الحديث.", "لأنه الكتاب الجامعي الوحيد المعتمد في العصر الحديث.", "لأنه ألغى جميع الكتب التي سبقته."], a: 1, e: "النص: 'ألف كتابه الموجز والنافع جدا... مكنوز بالفوائد ومليء بالمباحث المهمة وعكف عليه العلماء فيما بعد'." },
    { q: "عند دراسة الفروق المنهجية، لماذا استبعد (علماء أصول الفقه) الصفات الخِلقية والخُلقية للنبي ﷺ من تعريفهم للحديث؟", o: ["لأنهم يعتمدون على القرآن الكريم حصراً في بناء العقيدة.", "لأن علم أصول الفقه يهتم حصراً بما تُستنبط منه (الأحكام الشرعية)، والصفات الجبلية لا تُؤخذ منها أحكام.", "لأن الصفات الخِلقية لم تثبت بأسانيد متصلة.", "بسبب اقتصارهم على الأحاديث المتواترة فقط."], a: 1, e: "النص: 'لأن أصول الفقه اهتم بما يستنبط منه الأحكام... أما صفاته الجبلية أو ما أضيف للصحابة فهذا لا تؤخذ منه أحكام شرعية فلا يدخله الأصوليون'." },
    { q: "التعريف الاصطلاحي الموسع للحديث عند المحدثين يشمل ما نُسب إلى النبي ﷺ فقط من قول أو فعل أو تقرير أو صفة، ولا يشمل ما نُسب للصحابة أو التابعين لأنهم غير معصومين.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). التعريف الموسع للمحدثين يشمل (أو أُضيف إلى الصحابي أو التابعي)، لأن أقوالهم وأفعالهم تشرح وتوضح لكونهم عاينوا الوحي." },
    { q: "ما الدلالة الاستنباطية العميقة من إقرار النبي ﷺ لسيدنا معاذ بن جبل بالاجتهاد بعد القرآن والسنة؟", o: ["إثبات أن السنة تنسخ أحكام القرآن.", "أن القرآن والسنة لا يغطيان كافة تفاصيل الحياة مما يُلزم بالاجتهاد في ضوئهما.", "أن القياس العقلي يقدم على السنة المرفوعة.", "تأكيد أن السنة تستقل بالتشريع دون الحاجة للقرآن."], a: 1, e: "النص: 'أقر أن معاذاً قدم أولاً الاستنباط من كتاب الله ثم السنة ثم الاجتهاد في ضوء الكتاب والسنة'." },
    { q: "مصطلح (الخبر) و(الأثر) هما مرادفان لكلمة (الحديث) عند المحدثين بالعموم، إلا أن بعض المتأخرين يخص (الأثر) بما جاء عن غير النبي ﷺ للهروب من الجزم بنسبته للنبي.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'هي مرادفة لكلمة الأثر والخبر... ومن المعاصرين من لا يكون متأكداً من نسبة الخبر للنبي فيهرب من الإشكال بقوله جاء في الأثر'." },
    { q: "كيف فرّق الإمام البيهقي في كتابه (معرفة السنن والآثار) بين المصطلحين؟", o: ["السنن للأحاديث الضعيفة، والآثار للأحاديث الصحيحة.", "السنن لما هو مرفوع للنبي ﷺ، والآثار لما هو منسوب للصحابة والتابعين.", "السنن للأقوال، والآثار للأفعال النبوية.", "كلاهما بمعنى واحد لا تفريق بينهما عنده."], a: 1, e: "النص: 'البيهقي يدور حول التفرقة بين السنن وهي المرفوعة للنبي، وبين الآثار وهي المنسوبة للصحابة والتابعين'." },
    { q: "مصطلح (المُسْنِد) يُطلق على العالم المتخصص في الجرح والتعديل حصراً والذي يستطيع تمييز العلل الخفية في الأحاديث.", o: ["صح", "خطأ"], a: 1, e: "خطأ. المُسنِد هو (الذي يرفع الحديث إلى قائله بإسناده) أو (الذي عنده إسناد متصل)، ويسمى راوياً ولو لم يكن عالماً أو فقيهاً." },
    { q: "وفقاً للتسلسل الهرمي للألقاب العلمية، أي التالي يمثل الترتيب الصحيح من الأقل للأعلى معرفةً؟", o: ["محدث -> حافظ -> راوي -> حاكم.", "راوي -> محدث -> حافظ -> أمير المؤمنين في الحديث.", "حافظ -> محدث -> راوي -> حاكم.", "راوي -> حاكم -> محدث -> حافظ."], a: 1, e: "النص: الراوي (ينقل السند ولو لم يكن عالماً)، المحدث (تحمل رواية واعتنى دراية)، الحافظ (ما يعرفه أكثر مما يجهله)، أمير المؤمنين (فاق أقرانه وصار مرجع أهل عصره)." },

    // --- المحور الثاني: الرواية، الدراية، والمتواتر (11 - 25) ---
    { q: "علم الحديث (دراية) يمثل المستوى التأسيسي الأول الذي يقوم على حفظ الأحاديث وضبط ألفاظها والتصدر لروايتها في الحلقات دون التدخل في تمحيصها.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). هذا تعريف (الرواية). أما (الدراية) فهو المستوى الأعلى الذي يتضمن تمحيص المروي ونقده لتمييز المقبول من المردود وفهمه." },
    { q: "بناءً على تفسير المحاضر، لماذا اختلف الإمامان ابن الصلاح وابن حجر في طريقة ترتيب أنواع علوم الحديث في مؤلفاتهما؟", o: ["لأن ابن حجر رفض منهج ابن الصلاح واعتبره بدعة.", "بسبب اختلاف زاوية النظر والمهارة التصنيفية؛ فابن الصلاح بدأ بتقسيم القبول والرد (صحيح/ضعيف)، وابن حجر بدأ بعدد الأسانيد (متواتر/آحاد).", "لأن ابن حجر لم يكن يحفظ كتاب ابن الصلاح.", "الإجابتان 1 و 3 معاً."], a: 1, e: "النص: 'كيف ترتب الأنواع؟ ربما تختلف زاوية النظر وكل واحدة تدرس حالة... وهذا من المهارة التصنيفية'." },
    { q: "الشرط الجوهري في تعريف الحديث المتواتر (تحيل العادة تواطؤهم على الكذب) يعتمد بالأساس على (العدالة الشرعية) المطلقة لكل راوٍ في كل طبقة.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). يعتمد على الاستحالة العقلية (طبيعة الرواية العقلية من حيث العقل يستحيل أن يتفقوا لكثرتهم وظروفهم) وليست العدالة هي المانع هنا بل الكثرة والتفرق." },
    { q: "ما هي الحقيقة الصادمة تاريخياً ومنهجياً التي ذكرها المحاضر حول مبحث (الحديث المتواتر)؟", o: ["أنه حديث ضعيف لا يُعمل به.", "أنه مصطلح أصيل أسسه الإمام البخاري في صحيحه.", "أنه مصطلح دخيل على علم الحديث، جلبه علماء الكلام لتقسيم الأخبار إلى قطعي وظني، ولم يستعمله المحدثون الأوائل.", "أنه مقتصر على الأحاديث القولية دون الفعلية."], a: 2, e: "النص: 'الكلمة وهذا النوع دخيل على علم الحديث دخل عليه من علماء الكلام... فلا تجد عند البخاري أو أحمد كلمة متواتر'." },
    { q: "التقسيم الكلامي للأخبار إلى (قطعي) و(ظني) أدى إلى رفض المعتزلة الاحتجاج بأي حديث لم يبلغ حد التواتر، وهذا يتناقض تماماً مع منهج أهل السنة القائم على الاحتجاج بالحديث الصحيح والعمل به.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'علماء أهل السنة يدرسون الحديث إذا كان صحيحاً يحتج به... أما تقسيم الحديث لقطعي وظني ليس من علومنا الأصيلة... العمل بغير المتواتر هو عمل الأمة'." },
    { q: "وفقاً للمحاضرة، كل حديث لا يستوفي شروط المتواتر القطعي يُصنف عند المتكلمين بأنه (آحاد)، حتى لو روي بخمسة أسانيد صحيحة كالذهب.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'فحتى لو كان الحديث له خمسة أسانيد صحيحة، ولكن ما كانت قطعية... يعتبرونه آحاداً، فالآحاد كل ما ليس قطعي فهو آحاد'." },
    { q: "ما هو الفارق الدقيق بين المتواتر اللفظي والمتواتر المعنوي؟", o: ["اللفظي للأقوال والمعنوي للأفعال فقط.", "اللفظي ما نُقل بلفظ معين ثابت تقريباً، والمعنوي ما تعددت ألفاظه ووقائعه ولكنها اتفقت على دلالة مشتركة (كالحجاب والمسح على الخفين).", "اللفظي منسوب للقرآن والمعنوي منسوب للسنة.", "لا فرق بينهما عملياً."], a: 1, e: "النص: 'اللفظي: نقل كلامياً بلفظ معين. المعنوي: ما تعددت الألفاظ والمعنى واحد أو وقائع مختلفة اتفقت على أمر مشترك كرفع اليدين'." },
    { q: "الحديث عن رسول الله ﷺ الذي يرويه البخاري في صحيحه من طريق أربعة شيوخ عن شعبة يُعد حديثاً (متواتراً) بالضرورة نظراً لصحة إسناده وقوة رواته.", o: ["صح", "خطأ"], a: 1, e: "خطأ. صحة الإسناد وقوته لا تجعله متواتراً، بل هو آحاد صحيح. التواتر يحتاج جمعاً عن جمع تحيل العادة تواطؤهم على الكذب." },
    { q: "لماذا اعتبر الإمام الشافعي أن (السنة حُفظت بمجموعها) في الأمة؟", o: ["لأن كل عالم من علماء المسلمين يحفظ كامل السنة في صدره.", "لأنه لا يمكن لعالم واحد إحاطة كل السنة، ولكن بجمع علماء العصر ومؤلفاتهم تكتمل السنة ولا يضيع منها شيء حماية لبيان القرآن.", "لأن السنة نُسخت كلياً.", "لأن الصحابة أجمعوا على وضعها في كتاب واحد كالمصحف."], a: 1, e: "النص: 'لا يستطيع رجل في أي عصر أن يجمع كل السنة ولكن مجموع علماء العصر بمجموع مؤلفاتهم هي أكيد حاصرة للسنة... لأن ضياعها ضياع لبيان القرآن'." },
    { q: "ردُّ الأحاديث الصحيحة بدعوى التعارض مع (العقل المعاصر) أو بحجة القسوة (كمذبحة الرجال) هو منهج نقدي متقدم يثبت مرونة الشريعة وفقاً لمقاصد الإسلام اللطيفة.", o: ["صح", "خطأ"], a: 1, e: "خطأ. المحاضر نصّ على أن هذا المنهج يصدر عن شخص (جاهل بعلم الحديث وجاهل بمقاصد الإسلام، إذ أن من مقاصد الإسلام القوة والحسم وليس فقط أن يكون لطيفاً بمعايير هذا الزمان)." },
    { q: "ماذا يقصد العلماء بقولهم (الإسناد والسند، التعبير بالمصدر عن الاسم، وبالاسم عن المصدر)؟", o: ["أن الكلمتين متضادتان تماماً.", "أنهما يستعملان بالتبادل، فالسند (الاسم للرجال) والإسناد (المصدر لفعل الرواية)، ويجوز إطلاق أحدهما على الآخر مجازاً كإطلاق الكتابة على المكتوب.", "أنهما يمثلان علمين مختلفين تماماً (الجرح والتعديل).", "جميع ما سبق."], a: 1, e: "النص: 'السند هو الاسم والإسناد عملية الرواية... يستعمل أحدهما بمعنى الآخر ولا مشاحة... من باب التعبير بالمصدر عن الاسم وبالعكس مثل الطعام والكتابة'." },
    { q: "المسانيد كـ (مسند أحمد) هي كتب رُتبت أحاديثها بدقة متناهية بحسب الأبواب الفقهية (طهارة، صلاة، صيام) لتسهيل استنباط الأحكام العملية.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). المسانيد رُتبت (بحسب الصحابة بغض النظر عن موضوعاتها)، بينما السنن والصحاح هي التي رتبت بحسب الأبواب الفقهية." },
    { q: "ما هو الفارق الهيكلي بين الجوامع (كالصحيحين) وبين السنن الأربعة؟", o: ["الجوامع تحوي أحاديث ضعيفة، والسنن تحوي أحاديث صحيحة فقط.", "الجوامع ترتب بالصحابة، والسنن بالأبواب.", "الجوامع تشمل أبواب الدين كلها (تفسير، مغازي، عقيدة، آداب)، بينما تقتصر السنن في الأصل على الأبواب الفقهية (العملية).", "لا فرق بينهما."], a: 2, e: "النص: 'الجوامع تجمع أبواب الدين كلها تقريباً... أما السنن فالأصل أنها تقتصر على الأبواب الفقهية المستنبطة للعمل'." },
    { q: "إقلال كبار الصحابة من الرواية ناتج عن قلة محفوظاتهم للحديث النبوي مقارنة بصغار الصحابة الذين تفرغوا للحفظ.", o: ["صح", "خطأ"], a: 1, e: "خطأ. الإقلال سببه شدة ورعهم، واحتياطهم، وانشغالهم ببناء الدولة، وليس قلة محفوظاتهم." },
    { q: "طلب عمر بن الخطاب شاهداً من أبي موسى الأشعري يُستنبط منه:", o: ["قاعدة (الاشتراط) المطلق لتعدد الرواة في قبول الأخبار.", "تخوين أبي موسى الأشعري.", "منهج (الاحتياط) والتثبت وعدم التساهل، دون أن يكون التعدد شرطاً لازماً دائماً بدليل قبوله حديث الطاعون من فرد واحد.", "رفض أخبار الآحاد بالكلية."], a: 2, e: "النص: 'وهذا من باب الاحتياط لا من باب الاشتراط وربما تطلب من يشهد... بدليل أنه قبل خبر الطاعون من عبد الرحمن بن عوف لوحده'." },

    // --- المحور الثالث: نقد المتون، والفتنة، وتدوين السنة (26 - 40) ---
    { q: "قيام السيدة عائشة بمراجعة النبي ﷺ في حديث (مَنْ حُوسِبَ عُذِّبَ) يثبت أن الصحابة كانوا ينقدون حتى كلام النبوة ويردونه بعقولهم.", o: ["صح", "خطأ"], a: 1, e: "خطأ. لم ترده بعقلها ولم تنقده للرد، بل راجعته (مراجعة المتعلمة والمستفسرة) لاستشكالها الظاهري مع الآية القرآنية لطلب الجمع والفهم." },
    { q: "كيف يُرد على الشبهة القائلة: (الصحابة مجرد حمالين للروايات لا يفقهون متونها، فكيف نثق بفهمهم)؟", o: ["بأن التابعين صححوا أخطاءهم.", "بأن النقد العلمي الدقيق للمروي كان منهجاً أصيلاً لديهم؛ فكانوا يعرضون المرويات على القرآن كاستدراك عائشة على عمر في حديث تعذيب الميت ببكاء أهله.", "بأن النبي ﷺ كتب لهم التفسير الكامل.", "بالإقرار بصحة الشبهة والاعتماد على العقل."], a: 1, e: "النص: 'هذه فرية كبيرة يخالفها الواقع... كان عندهم منهج في القبول ونقدهم للحديث موجوداً وليس مبنياً فقط على النقل الأعمى... واستدلت عائشة بالآية لترد فهم عمر'." },
    { q: "في حادثة استدراك عائشة رضي الله عنها على سيدنا عمر بشأن البكاء على الميت، خضعت عائشة لفهم عمر رضي الله عنه تقديراً لمنصبه كخليفة للمسلمين ودرءاً للفتنة.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). النص يؤكد: 'لم يمنعها كونها امرأة أو أن عمر خليفة أن ترفض أو أن تسكت عما تراه خطأ'، بل صححت فهمه وحملته على الكافر." },
    { q: "ما الدلالة المنهجية لامتناع ابن عباس رضي الله عنهما عن الاستماع لحديث (بُشير العدوي) رغم أنه يحدّث عن رسول الله ﷺ؟", o: ["الكراهية الشخصية بينهما.", "تأسيس منهج نقدي يرفض التلقي من غير المعروفين بالثقة بعد (الفتنة) وتسلل التساهل والكذب، رغم أن المحدِّث يقص في المسجد.", "لأن ابن عباس كان أصمَّ لا يسمع.", "لأن بشيراً كان يروي باللغة الفارسية."], a: 1, e: "النص: 'لما ركب الناس الصعب والذلول لم نأخذ من الناس إلا ما نعرف... وهذا يدل على أن المنهج النقدي ملامحه واضحة بعد الفتنة'." },
    { q: "الفتنة الكبرى التي فرقت الأمة إلى شيعة وخوارج ونواصب واستدعت ضرورة الإسناد، هي الفتنة التي حدثت بمقتل أمير المؤمنين عمر بن الخطاب رضي الله عنه.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). الفتنة الكبرى المقصودة التي ولّدت الفرق ووصلت ذروتها كانت بـ (مقتل سيدنا علي في آخر حياته)، وليس عمر." },
    { q: "قول ابن سيرين: (فَلَمَّا وَقَعَتِ الْفِتْنَةُ قَالُوا: سَمُّوا لَنَا رِجَالَكُمْ)، يمثل الانطلاقة الأولى لتأسيس أي من العلوم التالية؟", o: ["علم غريب الحديث.", "بدايات التفتيش عن الأسانيد وعلم الجرح والتعديل لمعرفة الثقة من المجروح.", "علم أصول الفقه.", "علم ناسخ القرآن ومنسوخه."], a: 1, e: "النص: 'هذا اقتضى أن تنشأ بدايات علم الجرح والتعديل فلما يذكر لنا اسم راوي نسأل هل هذا ثقة أم لا'." },
    { q: "الكذب على رسول الله ﷺ كان متفشياً وظاهرة عامة على رؤوس الناس قبل سنة أربعين للهجرة وفي عهد الخلافة الراشدة.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص قطعي: 'قبل سنة أربعين لم يقع الكذب أبداً... وبعد الأربعين وقع الكذب ولكن بقلة وليس أنه صار متفشياً'." },
    { q: "ما هو التوصيف الدقيق لعملية (الكتابة) في عهد الصحابة (القرن الأول الهجري) مقارنة بالقرون اللاحقة؟", o: ["كانت معدومة تماماً بسبب النهي النبوي.", "كانت أساسية وعامة وموزعة على الأمصار ككتب منشورة.", "كانت (فردية شخصية)، كل صحابي يكتب لنفسه ليحفظ ويعلم أولاده، ولم تكن عامة متداولة ككتب مؤلفة.", "كانت محصورة في الدواوين السياسية فقط."], a: 2, e: "النص: 'مجموعة من الأحاديث التي كتبها لنفسه... أما الكتابة العامة بأن تجمع الأحاديث ليقرأها الناس لم يقع قبل هذه الفترة'." },
    { q: "قرار الخليفة عمر بن عبد العزيز بجمع السنن (كتابة وتدويناً رسمياً) نبع من خشيته من ضياع دروس العلم وذهاب العلماء بانتهاء عصر الصحابة.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'فخشي الخليفة أن تضيع أحاديث النبي... فكتب لأبي بكر بن حزم: انظر ما كان من حديث رسول الله فاكتبه فإني خفت دروس العلم وذهاب العلماء'." },
    { q: "من القواعد الحاكمة لعلم الجرح والتعديل قول ابن سيرين: (إِنَّ هَذَا الْعِلْمَ دِينٌ فَانْظُرُوا عَمَّنْ تَأْخُذُونَ دِينَكُمْ)، والمقصود بها:", o: ["أخذ العلم من كل شخص يدعي التدين.", "أن الحق هو الحاكم على الرجال، ويجب إخضاع رواتها للميزان النقدي القاسي لحفظ الدين ولو لزم وصفهم بالكذب.", "عدم دراسة الحديث إلا في المساجد.", "رفض روايات التابعين جميعاً."], a: 1, e: "النص: 'الحق هو الفيصل على الرجال... لذلك بدأوا يتكلمون في بعض الرجال... ولم يمنعهم أن يصفوا الرجل بما هو عليه لتبرئة ذمتهم'." },
    { q: "الإمام مسلم أشار إلى علل الأحاديث وتكلم في بعض الرواة من خلال كتابه (التاريخ الكبير).", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). كتاب مسلم هو (التمييز)، أما (التاريخ الكبير) فهو للإمام البخاري." },
    { q: "ما هي المبررات (الموضوعية) التي ساهمت في قلة رواية الصحابة الأوائل رغم طول صحبتهم؟", o: ["انشغالهم ببناء الدولة (خليفة، قاضٍ، والٍ).", "أنهم كانوا يتحدثون بين أناس يعلمون الأحاديث (توافر العلم) فلا حاجة للتحديث بها.", "موت بعضهم مبكراً في الخلافة الراشدة.", "جميع ما سبق."], a: 3, e: "النص ذكرها كلها كمبررات لعدم تفرغهم: انشغالهم بالدولة، موتهم مبكراً، وأن الصحابة كانوا متوافرين." },
    { q: "الإمام مالك عندما يقول (سمعت) أو (حدثني) في إسناده، فإنه يعبر عن (أداة الرواية) التي تصف بدقة كيفية تلقي الحديث وضبط الاتصال بينه وبين شيخه.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'صيغ التحمل والأداء... فهي تصف لنا كيف وصل إليه هذا الحديث مثل قول مالك سمعت'." },
    { q: "ما هو الشرط الذي أنشأ (علم العلل) في علوم الحديث؟", o: ["الاتصال.", "عدم العلة (وهي العيب الخفي القادح في الحديث الذي ظاهره السلامة).", "العدالة.", "الضبط."], a: 1, e: "النص: 'عدم العلة: وهذا أمر خفي... وكل واحدة نشأت عنها علوم، فعلوم التعارض والاختلاف وعلم العلل'." },
    { q: "عدالة الصحابة رضي الله عنهم تعني بالضرورة (العصمة المطلقة) من الوقوع في كبائر الذنوب أو زلات البشر طوال حياتهم.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). النص: 'عدالة الصحابة ليس المقصود بها الحفظ من المعاصي ولا العصمة عنها... ولكن القضية أنهم عدول من حيث الرواية فلم يقع الكذب من جانبهم'." },

    // --- المحور الرابع: شروط الحديث والأجوبة المنهجية (41 - 60) ---
    { q: "كيف أجاب المحاضر عن مسألة (سوء الظن المنهجي) عند المحدثين؟", o: ["اعتبره خطيئة شرعية تخالف حسن الظن بالمسلم.", "شبهه بالطبيب الذي يبني تحليلاته على الاحتياط وافتراض الأسوأ (سوء الظن الطبي) للتحقق من سلامة المريض، لحماية الدين.", "قَصَره على الرواة من أهل الذمة فقط.", "اعتبره خاصاً بعصر الصحابة فقط."], a: 1, e: "النص: 'علم الجرح قائم على سوء الظن... كما أن الأطباء مطلوب منهم أن يبنوا تحليلاتهم على سوء الظن للاحتياط... حتى يضع كل الاحتمالات الواردة'." },
    { q: "لو أخطأ راوٍ فنسي اللفظ النبوي الدقيق (هل قال: إنما الأعمال بالنيات أم العمل بالنية)، فإنه يحرم عليه شرعاً أن يروي الحديث بالمعنى حتى لا يكذب على النبي ﷺ.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). الرواية بالمعنى جائزة بضوابطها، وتغليب المصلحة النافعة للدعوة يقدم على القعود عنها لنسيان اللفظ، مع التنبيه للشك." },
    { q: "ما هي القاعدة التي اعتمدها الإمام الشافعي لنفي ادعاء (ضياع بعض السنن بموت كبار الصحابة مبكراً)؟", o: ["أن السنة غير ملزمة أصلاً.", "أن كل صحابي كان يكتب كل ما يسمعه.", "أن حفظ السنة مضمون بمجموع الأمة وعلمائها في كل عصر، تماماً كحفظ لغة العرب، لأن ضياعها ضياع لبيان القرآن المحفوظ.", "الاعتماد على الرؤى المنامية لتثبيت السنن المفقودة."], a: 2, e: "النص: 'إن لغة العرب حفظت بمجموعها وكما حفظت بمجموعها حفظ أحاديث النبي بمجموعه... لأن ضياعها ضياع لبيان القرآن'." },
    { q: "فهم عبارة (مَنْ نُوقِشَ الْحِسَابَ عُذِّبَ) يعني أن مجرد عرض دفتر الأعمال والتصفح السريع فيه يوم القيامة يُعد هلاكاً وتعذيباً محتوماً للمؤمن.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). العرض هو التصفح السريع والصفح والمغفرة، أما (المناقشة) والتدقيق في الحساب وتفصيله فهو الهلاك والتعذيب." },
    { q: "لماذا لم تظهر كتب مؤلفة بأسلوب (الخطب النبوية المجمعة) في العصر الأول كالمسانيد؟", o: ["لأن الخطب لم تكن جزءاً من السنة.", "لأن الصحابة والتابعين في العصر الأول لم يكونوا (هواة تأليف وتصنيف موضوعي معاصر)، بل بثوا الخطب النبوية ضمناً داخل أبواب الفقه والمسانيد.", "لأن النبي ﷺ نهى عن تدوين الخطب.", "بسبب ضياع خطب المنبر كلياً."], a: 1, e: "النص: 'خطب النبي مبثوثة في كتب السنة... ولكن ربما ما جمعت ما كانوا في العصر الأول هواة تأليف فهذا يريد تأليف الخطب وهذا للفقه... فابحث عن قال النبي على المنبر'." },
    { q: "عصر التدوين الذهبي الذي انتشر فيه تمييز الأحاديث (صحيح، ضعيف، حسن) وتدوين السنن والصحاح تركز في القرن الرابع الهجري.", o: ["صح", "خطأ"], a: 1, e: "خطأ. تركز في القرن الثالث الهجري (بين سنة 200 إلى سنة 300 للهجرة) كما ورد في النص." },
    { q: "كيف وظّف المحاضر حديث (لا تدخلوا بلداً فيه طاعون) لتقرير أصل أصولي عند الصحابة؟", o: ["لإثبات خبر الآحاد واعتماده؛ فعمر قَبِلَ خبر عبد الرحمن بن عوف لوحده وبنى عليه قراراً مصيرياً للدولة.", "لإبطال خبر الآحاد لعدم وجود شاهد آخر.", "لإثبات أن السنة تُقدم على القرآن.", "لدعم فكرة التوكل المطلق دون اتخاذ الأسباب."], a: 0, e: "النص: 'فقبل عمر هذا الحديث وعمل به... الأمثلة كثيرة على قبول خبر الآحاد في ذاته'." },
    { q: "قول مجاهد (فجعل ابن عباس لا يأذن لحديثه) في قصة بُشير العدوي، يعني أن ابن عباس أصدر أمراً بمنع بشير من دخول المسجد النبوي عقاباً له.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). فسرها المحاضر بـ: 'لا يُعطيه أذنه، لا يسمع له، يعني هو متجاهل لهذا الرجل'." },
    { q: "وفقاً للنص، ماذا قصد عمر بن عبد العزيز بقوله لأبي بكر بن حزم (وَلْتَجْلِسُوا حَتَّى يُعَلَّمَ مَنْ لَا يَعْلَمُ)؟", o: ["أن يجلس القضاة للفصل في الخصومات المالية.", "أن يجالسوا الناس في حلقات العلم لنشر أحاديث النبي ﷺ وإفشائها بين العامة.", "أن يتوقفوا عن الفتوحات العسكرية.", "أن يعتزلوا الفتنة في بيوتهم."], a: 1, e: "النص: 'وكان يقصد بذلك أن يجالسوا الناس في حلقات العلم، فإن العلم لا يهلك حتى يكون سراً'." },
    { q: "كتاب (جامع العلوم والحكم) هو موسوعة كبرى تقع في ثلاثين مجلداً تجمع كافة أحاديث الأحكام المروية عن المذاهب الأربعة.", o: ["صح", "خطأ"], a: 1, e: "خطأ. هو كتاب عظيم نافع (فيه خمسين حديثاً مع شرحها) وليس موسوعة كبرى من ثلاثين مجلداً لجميع الأحكام." },
    { q: "ما هي دلالة (التشجير الحديثي) أو شجرة الأسانيد لحديث واحد كما في مثال البخاري المروي عن أربعة شيوخ؟", o: ["يدل على اختلاط الحفظ وكثرة الوهم.", "يدل على توفر شروط الاتصال والضبط والعدالة، ويبرهن على الدقة العالية لانتشار الحديث وتلقي العلماء له في أمصار مختلفة.", "يدل على أن الحديث متواتر بالضرورة.", "يدل على ضعف متن الحديث."], a: 1, e: "النص: 'شجرة الأسانيد تدلنا على أنها توفرت فيها صفات معينة أهمها الاتصال والعدالة والضبط... ويدل على البراعة العظيمة'." },
    { q: "الإمام النووي اختصر كتاب ابن الصلاح في كتاب (التقريب والتيسير)، ثم اختصره مرة أخرى في كتاب (إرشاد طلاب الحقائق).", o: ["صح", "خطأ"], a: 1, e: "خطأ. (الترتيب معكوس). اختصره أولاً في (الإرشاد)، ثم اختصر الإرشاد في (التقريب والتيسير)." },
    { q: "لماذا اعتبر المحاضر انتقال الصحابة من الاعتماد الشفهي إلى الكتابة أمراً منطقياً ولا يُشكل طعناً في السنة؟", o: ["لأن الكتابة محرمة، ولكن للضرورة أحكام.", "لأنه يشبه التطور التكنولوجي التدريجي اليوم من الورقي للإلكتروني؛ فقد كثرت الكتابة تدريجياً لتوفر أدواتها وضعف الملكة الحفظية بعد اختلاط الأعراب بالمدن.", "لأن الوحي أمرهم بذلك فجأة في سنة 100 هـ.", "بسبب ضياع جميع القراء من الصحابة."], a: 1, e: "النص: 'أشبه هذا بعصرنا كيف انتقلت المعاملات... هل كانت دفعة واحدة؟ لا... كذلك الصحابة، كثرت الكتابة لتوفر أدواتها وضعف الملكة الحفظية'." },
    { q: "مصطلح (غير مقطوع به) أو (غير قطعي) عند المعتزلة ينسحب على الحديث الصحيح المروي بخمسة أسانيد نظيفة ما لم يبلغ حد التواتر عندهم.", o: ["صح", "خطأ"], a: 0, e: "صح. لأن كل ما ليس متواتراً عندهم فهو (آحاد) ظني أو غير قطعي، مهما بلغت صحته تعددت طرقه قليلاً." },
    { q: "كيف يتم توجيه عبارة (لا يروي إلا عن ثقة) منهجياً من خلال كلام التابعين كطاووس وسعد بن إبراهيم؟", o: ["أنها غيبة محرمة.", "أنها ضرورة شرعية لتبرئة الذمة أمام الله ولحفظ الدين، بتحديد الصادق وتسمية الكذوب (كالحارث الأعور).", "أنها دعوة لتقليد الرجال دون نقد.", "أنها تخص الأحاديث الضعيفة فقط."], a: 1, e: "النص: 'لم يمنعهم أن يصفوا الرجل بما هو عليه... لتبرئة ذمتهم أمام الله، وقالوا: إن كان صاحبك ملياً فخذ عنه'." },

    // --- أسئلة استنباطية وتفصيلية لضمان عمق الاختبار وإتمام 60 سؤالاً (46 - 60) ---
    { q: "ما الميزة المنهجية لمشروع الدكتور مصطفى السباعي في كتابه (السنة ومكانتها في التشريع الإسلامي) بناءً على توصية المحاضر؟", o: ["جمع أسانيد الصحاح والمسانيد.", "تفنيد وتاريخ تدوين الحديث النبوي والرد على الشبهات المثارة حول السنة ومكانتها العظيمة.", "شرح الأحاديث القدسية.", "تصنيف الصحابة قبلياً."], a: 1, e: "النص أشار إليه كمرجع هام في (تاريخ تدوين الحديث النبوي والرد على الشبهات)." },
    { q: "ظهور الفرق كالشيعة والخوارج أدى إلى نشوء (القَطِيعة الإسنادية)، حيث رفض العلماء أخذ الحديث نهائياً من أي شخص ليس من قبيلة قريش.", o: ["صح", "خطأ"], a: 1, e: "خطأ. الرفض كان مبنياً على (الثقة والعدالة والابتداع)، فكانوا يقولون (يُنظر إلى أهل البدع فلا يؤخذ، وإلى أهل السنة فيؤخذ) وليس مبنياً على القبيلة." },
    { q: "عندما يقول المحاضر: (الصحابة ليسوا كلهم علماء أو أصحاب كثرة رواية)، فإنه يمهد للرد على:", o: ["شبهة قلة المرويات النبوية في القرآن.", "شبهة أن الصحابة حمالين روايات بلا فقه، ليثبت أن طبقة الفقهاء منهم (كعائشة ومعاذ) كان لها منهج نقدي صارم للمتون.", "شبهة عصمة الصحابة المطلقة من الخطأ.", "بدعة الخوارج."], a: 1, e: "النص: 'الصحابة المشهورون بالرواية كانت أحاديثهم معروفة مشهورة وكان عندهم منهج في القبول ونقد المتون'." },
    { q: "رغم كثرة الأحاديث وتنوعها، فإن إحصاءات الإمام العلائي في كتابه (كشف النقاب) تُثبت أن كبار الخلفاء الراشدين رَوَوا مئات الأحاديث ولم تكن مروياتهم معدومة.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'سيدنا عمر روى أحاديث كثيرة وأبو بكر روى أحاديث وعثمان... في ذهني أنها كلهم ربما رووا بالمئات... في كتاب كشف النقاب'." },
    { q: "ما المراد بـ (الملكة الحفظية) التي بدأت تضعف في نهاية القرن الأول؟", o: ["القدرة على حفظ القرآن الكريم فقط.", "القدرة الفطرية الهائلة عند العرب على الحفظ السريع المتقن، والتي ضعفت بسبب الانتقال للحياة المدنية واختلاطهم بالأعاجم، مما حتّم الاعتماد على الكتابة.", "القدرة على حفظ الأنساب في المعارك.", "ضعف البصر بسبب القراءة."], a: 1, e: "النص: 'بدأت تضعف الملكة الحفظية بين الناس عموماً لكثرة ما اختلط بالعرب أعراب أخرى وبسبب انتقال الحياة إلى حياة مدنية'." },
    { q: "التواتر اللفظي في السنة النبوية هو الأكثر انتشاراً والأغلب مقارنة بالتواتر المعنوي.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). النص يؤكد: 'والمتواتر المعنوي: وهذا الأكثر في السنة: أن تتواتر أحاديث كثيرة جداً على معنى معين كالحجاب'." },
    { q: "ما العلاقة بين مقاصد الشريعة ورفض بعض الأحاديث الصحيحة من قبل بعض المعاصرين المتساهلين؟", o: ["أن المعاصرين يطبقون المقاصد بدقة أفضل من المحدثين.", "أنهم يجهلون مقاصد الإسلام الشاملة التي تتضمن (القوة والحسم)، ويقيسون الدين على معايير اللطف الحديثة فقط، فيردون الأحاديث الثابتة بعقولهم القاصرة.", "أن المحدثين تجاهلوا العقل تماماً.", "لا توجد علاقة."], a: 1, e: "النص: 'جاهل بعلم الحديث وجاهل بمقاصد الإسلام إذ أن من مقاصد الإسلام القوة والحسم وليس من مقاصده فقط أن يكون لطيفاً بمعايير الزمان'." },
    { q: "عصمة الأنبياء في النظرة العقدية تعني استحالة وقوعهم في ما بين (الفاضل والمفضول) حتى لو لم يكن معصية صريحة.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). العصمة تعني عدم ارتكاب ذنب أو معصية، أما ما يقع من الأنبياء أحياناً فهو اختيار أمر (بين الفاضل والمفضول) وهو ليس بمعصية." },
    { q: "كيف يُفسَّر استمرار خلافة الحسن بن علي رضي الله عنه لستة أشهر في سياق (الفتنة) وتأثيرها على الرواية؟", o: ["أنه ألغى الفتنة تماماً.", "أن فترته قصيرة وملحقة ولم تحدث تغييراً جذرياً، فالتغير הגذري وتشكل الفرق وقع فعلياً بمقتل علي رضي الله عنه.", "أنه أول من أمر بكتابة الحديث.", "أنه منع رواية الصحابة تماماً."], a: 1, e: "النص: 'لم يتغير شيء جذري، فالتغير الجذري كان بمقتل سيدنا علي حيث الفرق وجدت'." },
    { q: "النهي المنسوب لعمر بن الخطاب رضي الله عنه عن التحديث، يُحمل على (الخوف من انشغال الناس بالحديث عن القرآن وتدارسه)، وليس تشريعاً بتحريم السنة.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'لم ينه عمر بهذا المعنى... بل خشي أن يتفرغ الناس للاشتغال فقط برواية الأحاديث فيقعدوا عن حفظ القرآن وتدارسه'." },
    { q: "ما هو الشرط الذي يدرس أن الراوي لم يخالف بحديثه من هو أوثق منه؟", o: ["عدم الشذوذ.", "الاتصال.", "العدالة.", "الضبط."], a: 0, e: "النص: 'عدم الشذوذ: لم يخالف هذا الحديث حديثاً أقوى منه أو أصح منه'." },
    { q: "يُعتبر كتاب (الباعث الحثيث) اختصاراً قام به الإمام ابن كثير لكتاب التقريب للنووي.", o: ["صح", "خطأ"], a: 1, e: "خطأ. هو اختصار (لمقدمة ابن الصلاح) مباشرة، واسم كتابه الأصلي (اختصار علوم الحديث) وطبع باسم (الباعث الحثيث)." },
    { q: "علم (الجرح والتعديل وتاريخ الرواة والطبقات) تولد مباشرة من رحم أي من شروط الحديث؟", o: ["العدالة والضبط.", "الاتصال.", "عدم العلة.", "عدم الشذوذ."], a: 0, e: "النص: 'تأسس علم الحديث على شروط... وكل واحدة نشأت عنها علوم: فالجرح والتعديل والطبقات وتاريخ الرواة مرتبط بالعدالة والضبط ومعرفة الرجال'." },
    { q: "كتاب (الإيضاح في علوم الحديث والاصطلاح) للشيخين الخن واللحام يمثل نموذجاً للكتب الجامعية المعاصرة التي تقدم المعلومة بخلفياتها وأمثلتها المبسوطة بعيداً عن الاختصار المخل.", o: ["صح", "خطأ"], a: 0, e: "صح. النص وصفه بأنه: 'ليست موجزة جداً وليست مبسوطة جداً... تعطيه خلفياتها... الأمثلة فيه جيدة مبسوطة'." },
    { q: "أي العبارات التالية تعبر بدقة عن مقولة (خير القرون قرني) في سياق علم الرواية؟", o: ["أن كل من عاش في القرن الأول والثاني معصوم من الخطأ.", "أن الخيرية والعدالة هي (الغالبة والأصل) في عصر الصحابة والتابعين، رغم وجود قلة نادرة من مجروحي العدالة (كالحارث الأعور).", "أن رواية الحديث انتهت بانتهاء القرن الثالث.", "أن التابعين أفضل من الصحابة."], a: 1, e: "النص: 'بعض الضعاف الذين كانوا ضعيفي الرواية... ولكنهم قلة كذلك لأن الخيرية قائمة في عصر التابعين لقوله (خير القرون قرني)'." }
];

let currentQuestion = 0;
let userAnswers = new Array(quizData.length).fill(null);

const qText = document.getElementById('q-text');
const optionsList = document.getElementById('options-list');
const btnNext = document.getElementById('btn-next');
const btnPrev = document.getElementById('btn-prev');
const progressText = document.getElementById('progress-text');
const feedbackBox = document.getElementById('feedback-box');
const feedbackText = document.getElementById('feedback-text');

function loadQuestion(index) {
    const qData = quizData[index];
    qText.textContent = `${index + 1}. ${qData.q}`;
    progressText.textContent = `السؤال ${index + 1} من ${quizData.length}`;
    
    optionsList.innerHTML = '';
    feedbackBox.style.display = 'none';

    qData.o.forEach((opt, i) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'option';
        radio.value = i;
        
        const span = document.createElement('span');
        span.textContent = opt;

        li.appendChild(radio);
        li.appendChild(span);

        if(userAnswers[index] !== null) {
            li.classList.add('disabled');
            radio.disabled = true;
            if(i === qData.a) {
                li.classList.add('correct');
            } else if(i === userAnswers[index]) {
                li.classList.add('wrong');
            }
        }

        li.addEventListener('click', () => {
            if(userAnswers[index] === null) {
                radio.checked = true;
                handleAnswer(index, i, li);
            }
        });

        optionsList.appendChild(li);
    });

    if(userAnswers[index] !== null) {
        showFeedback(qData.e);
    }

    btnPrev.disabled = index === 0;
    btnNext.textContent = index === quizData.length - 1 ? 'إنهاء واستعراض النتيجة' : 'التالي';
}

function handleAnswer(qIndex, selectedOption, liElement) {
    userAnswers[qIndex] = selectedOption;
    const qData = quizData[qIndex];
    
    const allOptions = optionsList.querySelectorAll('.option-item');
    allOptions.forEach((item, idx) => {
        item.classList.add('disabled');
        item.querySelector('input').disabled = true;
        
        if (idx === qData.a) {
            item.classList.add('correct');
        } else if (idx === selectedOption && selectedOption !== qData.a) {
            item.classList.add('wrong');
        }
    });

    showFeedback(qData.e);
}

function showFeedback(text) {
    feedbackText.textContent = text;
    feedbackBox.style.display = 'block';
}

btnNext.addEventListener('click', () => {
    if (currentQuestion < quizData.length - 1) {
        currentQuestion++;
        loadQuestion(currentQuestion);
    } else {
        let score = userAnswers.filter((ans, i) => ans === quizData[i].a).length;
        document.getElementById('quiz-body').innerHTML = `
            <div style="text-align:center; padding: 50px 20px;">
                <h2 style="color:var(--accent); font-size: 2.2em; margin-bottom: 20px;">اكتمل الاختبار المتقدم بنجاح!</h2>
                <div style="background: #fff; border-radius: 12px; padding: 30px; font-size: 1.6em; border: 3px solid var(--secondary); display: inline-block;">
                    حصيلتك المعرفية: <br> 
                    <strong style="color: var(--primary); font-size: 2.6em;">${score}</strong> من أصل 60
                </div>
                <p style="color: #555; margin-top: 25px; font-size: 1.25em; font-weight: bold;">تم بنجاح تجاوز المموهات الدقيقة وخدع النهايات المنهجية!</p>
            </div>
        `;
        document.querySelector('.nav-buttons').style.display = 'none';
    }
});

btnPrev.addEventListener('click', () => {
    if (currentQuestion > 0) {
        currentQuestion--;
        loadQuestion(currentQuestion);
    }
});

// بدء التشغيل
loadQuestion(0);
</script>
