<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار المتقدم: المحاضرة الثامنة - صفات الرواية</title>
    <style>
        :root {
            --primary: #004d40;
            --secondary: #00695c;
            --accent: #d84315;
            --correct-bg: #e8f5e9;
            --correct-border: #a5d6a7;
            --wrong-bg: #ffebee;
            --wrong-border: #ffcdd2;
            --text: #263238;
            --bg: #eceff1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background: #fff;
            max-width: 950px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12);
            padding: 40px;
            box-sizing: border-box;
            border-top: 6px solid var(--accent);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #cfd8dc;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .header h2 { color: var(--primary); margin: 0; font-size: 1.95em;}
        .progress { color: var(--accent); font-weight: bold; margin-top: 10px; font-size: 1.2em;}
        .question-text {
            font-size: 1.45em;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .options-list { list-style: none; padding: 0; margin: 0; }
        .option-item {
            background: #fafafa;
            border: 2px solid #cfd8dc;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.15em;
            display: flex;
            align-items: center;
        }
        .option-item:hover:not(.disabled) { background: #e0f2f1; border-color: #80cbc4; }
        .option-item input { margin-left: 15px; transform: scale(1.4); cursor: pointer; }
        .option-item.disabled { cursor: not-allowed; opacity: 0.95; }
        .option-item.correct { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #1b5e20; font-weight: bold; }
        .option-item.wrong { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: #b71c1c; text-decoration: line-through; }
        
        .feedback-box {
            display: none;
            background: #f5fcfd;
            border-right: 5px solid var(--accent);
            padding: 20px;
            margin-top: 30px;
            border-radius: 5px;
            font-size: 1.15em;
            line-height: 1.7;
        }
        .feedback-box span { font-weight: bold; color: var(--accent); display: block; margin-bottom: 8px;}
        
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 35px;
            border-top: 1px solid #cfd8dc;
            padding-top: 25px;
        }
        .btn {
            background: var(--secondary);
            color: #fff;
            border: none;
            padding: 12px 35px;
            border-radius: 6px;
            font-size: 1.15em;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background: var(--primary); }
        .btn:disabled { background: #b0bec5; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>الاختبار الاستنباطي المتقدم: المحاضرة الثامنة</h2>
        <div class="progress" id="progress-text">السؤال 1 من 60</div>
    </div>
    
    <div id="quiz-body">
        <div class="question-text" id="q-text"></div>
        <ul class="options-list" id="options-list"></ul>
        <div class="feedback-box" id="feedback-box">
            <span>التأصيل والتفسير (مستنبط من النص الحصري):</span>
            <p id="feedback-text"></p>
        </div>
    </div>
    
    <div class="nav-buttons">
        <button class="btn" id="btn-prev" disabled>السابق</button>
        <button class="btn" id="btn-next">التالي</button>
    </div>
</div>

<script>
const quizData = [
    { q: "ما هي الدلالة المنهجية لاعتبار مصطلحات (المتصل، المرفوع، المسند...) أوصافاً لحالة الرواية وشكلها؟", o: ["أنها خاصة بالحديث الصحيح فقط.", "أنها أوصاف شكلية لا علاقة لها بالمتن.", "أنها أوصاف مشتركة قد يتصف بها الحديث الصحيح أو الحسن أو الضعيف.", "أنها تخص الأحاديث الموضوعة."], a: 2, e: "النص: 'أوصاف مشتركة بين الصحيح والحسن والضعيف... فالاتصال وحده لا يعطينا حكم الحديث ككل'." },
    { q: "يشترط في الحديث (المتصل) أن يكون التلقي حصراً بالسماع اللفظي المباشر من فم الشيخ.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). النص: 'إما سماعاً أو قراءة عليه أو إجازة منه مباشرة أو مناولة أو كتابة'." },
    { q: "الحديث المتصل لا يشترط فيه أن ينتهي إلى النبي ﷺ، فقد ينتهي إلى صحابي أو تابعي، طالما أن سلسلة النقل غير منقطعة.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'والحديث المتصل قد ينتهي إلى النبي ﷺ، وقد ينتهي إلى صحابي أو تابعي؛ فهنا ينظر فقط إلى زاوية الاتصال'." },
    { q: "الحديث المرفوع هو ما أضيف للنبي ﷺ من قول أو فعل أو تقرير، ولا يشمل الصفات الخِلقية لأنها جبلية جسدية.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). يشملها قطعاً. النص: 'أو أوصافاً خلقية: جسدية؛ أو أوصافاً خلقية: في الأخلاق والشمائل... كل هذه تدخل في الحديث المرفوع'." },
    { q: "حديث عائشة: (كَانَ يَكُونُ فِي مِهْنَةِ أَهْلِهِ)، يُعد حديثاً:", o: ["موقوفاً.", "مرفوعاً فعلياً.", "مقطوعاً.", "مرفوعاً قولياً."], a: 1, e: "النص: 'هذا حديث مرفوع، لأنها تصف لنا فعل النبي ﷺ... فهذا حديث مرفوع فعلي'." },
    { q: "ما الاستنباط الأصولي الدقيق من (سكوت) النبي ﷺ عن فعلٍ حدث أمامه كأكل خالد للضَّب؟", o: ["أن السكوت علامة على الكراهة.", "أن السكوت حجة شرعية تفيد الإباحة؛ لأن النبي مأمور بالبيان ولا يسكت عن محرم.", "أن السكوت يفيد الوجوب.", "خاص بتلك الحادثة ولا يعمم."], a: 1, e: "النص: 'سكوت النبي ﷺ حجة شرعية تفيد الإباحة... فلا يمكن للرسول أن يرى أمرا منهيا عنه ثم يسكت؛ لأنه مأمور بالبيان'." },
    { q: "في قصة صلاة العصر في بني قريظة، كيف حلل ابن القيم موقف الفريقين؟", o: ["كلاهما مخطئ.", "الذين صلوا في الطريق هم (أهل الظاهر)، والمؤخرون هم (أصحاب المعاني).", "المصلون في الطريق هم (أصحاب المعاني والقياس)، والمؤخرون هم (أهل الظاهر).", "كلاهما من أهل الظاهر."], a: 2, e: "النص: 'أحدهم فهم المقصد فصلى العصر... (سلف أصحاب المعاني والقياس)، والفريق الثاني وقف عند الظاهر... (سلف أهل الظاهر)'." },
    { q: "الحديث المرفوع يشترط فيه أن يكون متصل الإسناد ليُسمى مرفوعاً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). النص: 'وهذا الحديث المرفوع قد يكون متصلا وقد يكون منقطعا أو مرسلا'." },
    { q: "رأي الإمام الخطيب البغدادي في (المرفوع) أنه يشترط أن يُضيفه (الصحابي) للنبي، فيخرج بذلك المرسل.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'جعلوا المرفوع ما أضافه الصحابي... فخرج بذلك المرسل... هذا رأي خاص به'." },
    { q: "إذا جمعنا بين صفتي (الاتصال) و(الرفع للنبي ﷺ) في إسناد واحد، فإننا نحصل على مصطلح:", o: ["الموقوف.", "المسند.", "المقطوع.", "المرسل."], a: 1, e: "النص: 'الحديث المسند... هو ما اتصل سنده مرفوعاً'." },
    { q: "ما المأخذ المنهجي على رأي الخطيب (المسند = المتصل) ورأي ابن عبد البر (المسند = المرفوع)؟", o: ["أنهما يضعفان الحديث.", "على رأيهما يصبح المسند مرادفاً مكرراً للمرفوع أو المتصل وليس نوعاً جديداً مركباً.", "رأيهما يوافق الإمام أحمد.", "رفضا الاحتجاج بالمسند."], a: 1, e: "النص: 'لأنه على كلامهما يصبح المسند مرادفاً إما للمرفوع وإما للمتصل وليس نوعاً جديداً'." },
    { q: "ما هي العلاقة المنطقية بين مصطلحي (المسند) و(المتصل)؟", o: ["عموم وخصوص وجهي.", "تباين مطلق.", "ترادف.", "عموم وخصوص مطلق."], a: 3, e: "النص: 'عموم وخصوص مطلق لأن كل مسند متصل وليس كل متصل مسند'." },
    { q: "ما هي العلاقة المنطقية بين مصطلحي (المسند) و(المرفوع)؟", o: ["عموم وخصوص مطلق.", "عموم وخصوص وجهي.", "تضاد.", "تساوٍ."], a: 0, e: "النص: 'عموم وخصوص مطلق، لأن كل مسندٍ مرفوع وليس كل مرفوعٍ مسندًا'." },
    { q: "ما هي العلاقة المنطقية بين مصطلحي (المتصل) و(المرفوع)؟", o: ["عموم وخصوص مطلق.", "عموم وخصوص وجهي.", "ترادف.", "تضاد."], a: 1, e: "النص: 'عموم وخصوص وجهي، فما كان متصلاً مرفوعاً هو المسند'." },
    { q: "أصحاب المسانيد كالإمام أحمد، يشترطون (الصحة المطلقة) وخلو السند من الإرسال الخفي في كل حديث.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'أحياناً يكون فيه إرسال خفي أو تدليس ربما يخرجونه... ولا يشترطون الصحة دائماً'." },
    { q: "الحديث الموقوف هو ما أضيف إلى (الصحابي)، ويعتبر حجة شرعية ملزمة بذاته كحديث النبي ﷺ تماماً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'يعني فعل صحابي واحد أو قوله بحد ذاته ليس حجة شرعية، إلا إذا حصل الإجماع'." },
    { q: "ما الفرق في البنية بين كتب (المصنفات) كعبد الرزاق، و(السنن) كأبي داود؟", o: ["السنن مرتبة فقهياً والمصنفات أبجدياً.", "المصنفات تهتم بنقل أقوال الصحابة والتابعين بأسانيدها، بينما السنن تقتصر كأصل على المرفوع.", "لا يوجد فرق.", "السنن تذكر المتن بدون إسناد."], a: 1, e: "النص: 'المصنفات اهتمت بنقل أقوال الصحابة... أما السنن فهي لا تنقل بأسانيدها المتصلة أحاديث موقوفة كأصل'." },
    { q: "لمعرفة فقه الليث والأوزاعي وقتادة بالأسانيد، ما هي الكتب الأنسب؟", o: ["صحيح البخاري.", "سنن النسائي.", "المصنفات.", "المستدرك."], a: 2, e: "النص: 'إذا كنت تريد أن تعرف فقه الليث والأوزاعي... اجمع ما نقل عنهم في المصنفات'." },
    { q: "الصفات الخِلقية الجسدية للصحابة والتابعين لا تدخل ضمن تعريف الحديث الموقوف والمقطوع لأنها غير مقصودة للتشريع والاقتداء.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'أما صفات الصحابة والتابعين الجسمية لا تدخل أساسا... لأنها ليست مقصودة لذاتها'." },
    { q: "القرن الذي عاش فيه التابعون بدأ بعد وفاة آخر صحابي تماماً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'عصر التابعين بدأ من زمن وفاة النبي ﷺ، فكل من لقي الصحابة في عهد أبي بكر وعمر... هؤلاء تابعون'." },
    { q: "ما هو التعريف الراجح الدقيق للحديث (المرسل) عند المحدثين؟", o: ["سقوط راويين متواليين.", "ما رواه التابعي الصغير فقط.", "ما رفعه التابعي (مطلقاً) إلى النبي ﷺ من غير ذكر الواسطة.", "ما أسقط منه الصحابي."], a: 2, e: "النص: 'والراجح أن المرسل ما يرويه التابعي بعمومه؛ سواء كان صغيراً أو كبيراً'." },
    { q: "إذا قال الإمام حماد (وهو ليس من التابعين): (قال رسول الله ﷺ)، فإنه يسمى مرسلاً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'إذا رواه حماد عن النبي لا يسمى مرسلاً؛ لأن حماد ليس تابعي'." },
    { q: "ما العلة الحقيقية التي جعلت المحدثين يضعفون الحديث المرسل؟", o: ["تأكدهم من ضعف الصحابي.", "لأن التابعين ليسوا عدولاً.", "لاحتمال أن تكون الواسطة الساقطة تابعيّاً آخر ضعيفاً (التابعي عن تابعي).", "الإرسال بدعة متأخرة."], a: 2, e: "النص: 'وربما أحد التابعين ضعيف... طالما هناك احتمال أن يكون راوٍ ضعيف لم يذكر فلا يصححون الحديث'." },
    { q: "المذهب القائل بالاحتجاج بالمرسل والعمل به يُنسب لأي من الأئمة؟", o: ["الشافعي فقط.", "البخاري.", "أبو حنيفة ومالك وأحمد.", "المعتزلة."], a: 2, e: "النص: 'مذهب يرى أن المرسل حجة... نسب فقهيا إلى الإمام أبي حنيفة ومالك وأحمد... طالما لم يوجد حديث متصل'." },
    { q: "الإمام الشافعي يقبل الحديث المرسل مطلقاً إذا رُوي من وجه آخر متصل فقط.", o: ["صح", "خطأ"], a: 1, e: "خطأ. له بدائل وشروط أخرى كأن يعتضد بمرسل آخر من شيوخ مختلفين، أو قول صحابي، أو فتوى." },
    { q: "إذا اعتضد المرسل بمرسل آخر من طريق شيوخ مختلفين، فما تقييمه النهائي عند الشافعي؟", o: ["يصبح صحيحاً لذاته.", "يصبح حجة يُعمل به إذا خلا الباب من دليل أقوى منه.", "يُرد الحديثان معاً.", "يُعد منسوخاً."], a: 1, e: "النص: 'وإنما هو حجة بهذه الشروط إذا خلا الباب من دليل آخر أقوى منه، ولا تجعله في مصاف الحديث الصحيح'." },
    { q: "مراسيل (سعيد بن المسيب) لها حصانة مطلقة تجعلها كلها صحيحة دون استثناء عند جميع العلماء.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'لا خصوصية لسعيد ولكن أغلب مراسيله قوية... الشافعي يعتبر مرسل سعيد كمرسل غيره إذا اعتضد'." },
    { q: "كتاب (بيان المرسل) لأبي بكر البرديجي هو من أهم الكتب المطبوعة المتداولة اليوم.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص صرح بأنه: 'وهو كتاب مفقود'." },
    { q: "أي من الكتب التالية اختص بدراسة أنواع الانقطاع، وطبقات المرسلين؟", o: ["جامع التحصيل للعلائي.", "المراسيل لابن أبي حاتم.", "حلية الأولياء.", "مصنف عبد الرزاق."], a: 0, e: "النص: 'كتاب (جامع التحصيل في أحكام المراسيل) للإمام العلائي... تكلم عن أنواع الانقطاع مع الأمثلة'." },
    { q: "التقسيم الاصطلاحي للحديث يُمكن اختزاله في قسمة ثنائية: المقبول والمردود.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'وإن شئت أن تقول هي قسمة ثنائية: المقبول... والمردود'." },
    { q: "إذا قال الراوي: (قال رسول الله) وكان المتن وصفاً لحلمه ورفقه، فهذا يسمى:", o: ["مرفوعاً فعلياً.", "مرفوعاً خُلقياً.", "موقوفاً.", "مقطوعاً."], a: 1, e: "النص: 'أو أوصافاً خلقية: في الأخلاق والشمائل كحلمه ﷺ ورفقه'." },
    { q: "أفعال الصحابة والتابعين تعتبر جزءاً من التشريع لأنها مفسرة لحكم شرعي أو أدب متأثر بهدي النبي.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'لأن أقوال الصحابة وأفعالهم... متأثرة بهدي النبي ﷺ، وكثيرا ما تكون مفسرة لحكم شرعي'." },
    { q: "مصطلح (الأثر) يختص حصراً بما نقل عن الصحابة ولا يُطلق على حديث النبي أبداً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'وقد تشمل كلمة الأثر الحديث أيضاً وليس فقط ما نُسب إلى الصحابة'." },
    { q: "التابعي هو كل مسلم رأى النبي ﷺ ولكنه لم يجلس معه طويلاً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. التابعي هو: 'كل من لقي صحابياً واجتمع به... ولم يرى النبي ﷺ'." },
    { q: "القياس الاستنباطي: لو اكتشفنا حديثاً موقوفاً على صحابي فيه راوٍ كذاب في سنده، فإننا:", o: ["نقبله.", "نتعرض له بالنقد ونرده، كالمرفوع تماماً.", "نصححه تبركاً.", "نعتبره مقطوعاً."], a: 1, e: "النص: 'فإذا وجدنا الحديث فيه راوٍ كذاب... فهذا يتعرض لنقد الحديث، كما يتعرض المرفوع'." },
    { q: "القاعدة العقلية (من أسند فقد أحال ومن أرسل فقد تكفل) استدل بها المحدثون لرد الحديث المرسل.", o: ["صح", "خطأ"], a: 1, e: "خطأ. استدل بها الحنفية والمالكية (المذهب الثاني) (لقبول) المرسل والاحتجاج به." },
    { q: "علماء الأصول ربما يطلقون مصطلح (المرسل) على أي حديث (منقطع) وليس خاصاً بالتابعي.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'وعلماء الأصول وبعض علماء الحديث المتقدمين ربما يطلقون المرسل على المنقطع'." },
    { q: "من أمثلة شروط الشافعي للمرسل: أن يعتضد بقول صحابي، مما يُشعر بأن له أصلاً عن النبي.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'أن يعتضد بقول بعض الصحابة... يُشعر بأن هذا المرسل مروي عن النبي ﷺ'." },
    { q: "أتباع التابعين كالليث بن سعد والإمام الشافعي يمثلون طبقة منفصلة لم تستفد من علم الصحابة.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'بالعموم هؤلاء طبقة مهمة جمعوا علم التابعين وعلم الصحابة'." },
    { q: "كتاب (حلية الأولياء) لأبي نعيم من المصادر التي تهتم بالأحاديث الموقوفة.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'ونذكر أيضا (حلية الأولياء) لأبي نعيم... يهتم بالأحاديث الموقوفة'." },
    // إضافة 20 سؤال سريع لتغطية الجوانب الدقيقة (إجمالي 60)
    { q: "الحديث المقطوع هو ما أضيف إلى:", o: ["النبي.", "الصحابي.", "التابعي.", "الملك."], a: 2, e: "النص: 'الحديث المقطوع: هو ما أضيف للتابعي من قوله أو فعله أو تقريره'." },
    { q: "هل يشترط في المقطوع أن يكون متصلاً؟", o: ["نعم.", "لا، قد يكون متصلاً أو منقطعاً.", "يجب أن يكون مرسلاً.", "يجب أن يكون مرفوعاً."], a: 1, e: "النص: 'والحديث المقطوع قد يكون متصلاً أومنقطعاً'." },
    { q: "الحديث المقبول يشمل أنواعاً ثلاثة: الصحيح، الحسن، والموقوف.", o: ["صح", "خطأ"], a: 1, e: "خطأ. المقبول يشمل (الصحيح والحسن) فقط." },
    { q: "حكم الحديث المتصل بأنه صحيح دائماً بغض النظر عن رواته.", o: ["صح", "خطأ"], a: 1, e: "خطأ. الاتصال هو شرط واحد، وقد يكون المتصل ضعيفاً أو حسناً." },
    { q: "هل كل ما رواه التابعي عن النبي ﷺ يسمى مرسلاً عند المحدثين؟", o: ["نعم، سواء كان التابعي صغيراً أو كبيراً (على الراجح).", "لا، فقط التابعي الكبير.", "فقط إذا كان التابعي صحابياً.", "فقط إذا ذكر الواسطة."], a: 0, e: "النص: 'والراجح أن المرسل ما يرويه التابعي بعمومه؛ سواء كان صغيراً أو كبيراً'." },
    { q: "الحديث المنقطع انقطاعاً واضحاً يخرجه أصحاب المسانيد (كأحمد) كأصل في كتبهم.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'حديث منقطع انقطاعا واضحا لا يكون في هذه الكتب'." },
    { q: "كتاب (المراسيل) لأبي داود مرتب على الأبواب الفقهية.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'كتاب (المراسيل) للإمام أبو داود... ورتبه على الأبواب الفقهية'." },
    { q: "ابن عبد البر قيد قبول المرسل بأن يكون الراوي (لا يروي إلا عن الثقات).", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'وقيده ابن عبد البر بأن يكون لا يروي إلا عن الثقات'." },
    { q: "التابعي إذا قال 'قال رسول الله' وذكر واسطة تابعي آخر، يعتبر الحديث مرسلاً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. المرسل هو الإضافة 'من غير ذكر الواسطة'." },
    { q: "كبار التابعين هم من لقوا العشرة المبشرين بالجنة.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'فقالوا هم من لقوا العشرة المبشرين بالجنة... فهؤلاء صُنفوا بكبار التابعين'." },
    { q: "صيغة (المناولة) تعتبر من طرق التحمل في الحديث المتصل.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'إما سماعاً أو قراءة عليه أو إجازة منة مباشرة أو مناولة'." },
    { q: "الاحتجاج بالحديث الموقوف (كمذهب الصحابي) يُدرس تفصيلاً في علم الحديث المقطوع.", o: ["صح", "خطأ"], a: 1, e: "خطأ. يُدرس في علم (أصول الفقه). النص: 'فهذا يدرس في أصول الاحتجاج وهو في أصول الفقه'." },
    { q: "الحديث المقطوع يمكن أن يُضاف إلى أتباع التابعين كابن جريج والليث بن سعد.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'وقد يُضاف إلى من بعدهم ويُسمى مقطوعًا، ولكن هذا قليل'." },
    { q: "في حديث بني قريظة، النبي ﷺ صوّب فعل فريق ووبّخ الفريق الآخر.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النبي ﷺ لم يوبخ أياً منهما، وهذا يسمى (إقراراً)." },
    { q: "العموم والخصوص المطلق يعني أن أحدهما دائرة ضمن دائرة أوسع.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'العموم والخصوص المطلق: أن يكون أحدهما دائرة ضمن دائرة أوسع'." },
    { q: "المصنفات ترتب الأحاديث حسب أسماء الصحابة.", o: ["صح", "خطأ"], a: 1, e: "خطأ. المصنفات مرتبة (بحسب الأبواب الفقهية). النص: 'هي كتب ألفت بحسب الأبواب الفقهية'." },
    { q: "الموطأ للإمام مالك يهتم بنقل الأحاديث الموقوفة وأقوال الصحابة والتابعين.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'أيضا (الموطأ) للإمام مالك أيضاً يهتم بنقل الأحاديث الموقوفة'." },
    { q: "الإرسال الخفي هو انقطاع ظاهر يسهل اكتشافه.", o: ["صح", "خطأ"], a: 1, e: "خطأ. الإرسال الخفي هو (انقطاع على خلاف الظاهر)." },
    { q: "الزهري من التابعين، وسفيان بن عيينة أخذ عنه.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'الزهري من التابعين وأخذ عنه سفيان بن عيينة'." },
    { q: "حديث يرويه التابعي أيوب السختياني عن النبي مباشرة يسمى منقطعاً عند جمهور المحدثين.", o: ["صح", "خطأ"], a: 1, e: "خطأ. يسمى (مرسلاً) لأن أيوب تابعي رفع الحديث دون واسطة." }
];

let currentQuestion = 0;
let userAnswers = new Array(quizData.length).fill(null);

const qText = document.getElementById('q-text');
const optionsList = document.getElementById('options-list');
const btnNext = document.getElementById('btn-next');
const btnPrev = document.getElementById('btn-prev');
const progressText = document.getElementById('progress-text');
const feedbackBox = document.getElementById('feedback-box');
const feedbackText = document.getElementById('feedback-text');

function loadQuestion(index) {
    const qData = quizData[index];
    qText.textContent = `${index + 1}. ${qData.q}`;
    progressText.textContent = `السؤال ${index + 1} من ${quizData.length}`;
    
    optionsList.innerHTML = '';
    feedbackBox.style.display = 'none';

    qData.o.forEach((opt, i) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'option';
        radio.value = i;
        
        const span = document.createElement('span');
        span.textContent = opt;

        li.appendChild(radio);
        li.appendChild(span);

        if(userAnswers[index] !== null) {
            li.classList.add('disabled');
            radio.disabled = true;
            if(i === qData.a) {
                li.classList.add('correct');
            } else if(i === userAnswers[index]) {
                li.classList.add('wrong');
            }
        }

        li.addEventListener('click', () => {
            if(userAnswers[index] === null) {
                radio.checked = true;
                handleAnswer(index, i, li);
            }
        });

        optionsList.appendChild(li);
    });

    if(userAnswers[index] !== null) {
        showFeedback(qData.e);
    }

    btnPrev.disabled = index === 0;
    btnNext.textContent = index === quizData.length - 1 ? 'إنهاء واستعراض النتيجة' : 'التالي';
}

function handleAnswer(qIndex, selectedOption, liElement) {
    userAnswers[qIndex] = selectedOption;
    const qData = quizData[qIndex];
    
    const allOptions = optionsList.querySelectorAll('.option-item');
    allOptions.forEach((item, idx) => {
        item.classList.add('disabled');
        item.querySelector('input').disabled = true;
        
        if (idx === qData.a) {
            item.classList.add('correct');
        } else if (idx === selectedOption && selectedOption !== qData.a) {
            item.classList.add('wrong');
        }
    });

    showFeedback(qData.e);
}

function showFeedback(text) {
    feedbackText.textContent = text;
    feedbackBox.style.display = 'block';
}

btnNext.addEventListener('click', () => {
    if (currentQuestion < quizData.length - 1) {
        currentQuestion++;
        loadQuestion(currentQuestion);
    } else {
        let score = userAnswers.filter((ans, i) => ans === quizData[i].a).length;
        document.getElementById('quiz-body').innerHTML = `
            <div style="text-align:center; padding: 50px 20px;">
                <h2 style="color:var(--primary); font-size: 2.3em; margin-bottom: 20px;">تم إنجاز الاختبار العقلاني (المحاضرة الثامنة)!</h2>
                <div style="background: #fff; border-radius: 12px; padding: 30px; font-size: 1.6em; border: 3px dashed var(--accent); display: inline-block;">
                    حصيلتك المعرفية: <br> 
                    <strong style="color: var(--secondary); font-size: 2.8em;">${score}</strong> من أصل 60
                </div>
                <p style="color: #455a64; margin-top: 25px; font-size: 1.25em; font-weight: bold;">أثبتّ إتقانك للعلاقات المنطقية وعلل الانقطاع بدقة متناهية!</p>
            </div>
        `;
        document.querySelector('.nav-buttons').style.display = 'none';
    }
});

btnPrev.addEventListener('click', () => {
    if (currentQuestion > 0) {
        currentQuestion--;
        loadQuestion(currentQuestion);
    }
});

loadQuestion(0);
</script>
