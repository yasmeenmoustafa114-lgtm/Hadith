<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار الاستنباطي المتقدم: المحاضرة السابعة - الحديث الحسن والضعيف</title>
    <style>
        :root {
            --primary: #1b4f72;
            --secondary: #2874a6;
            --accent: #d35400;
            --correct-bg: #d5f5e3;
            --correct-border: #abebc6;
            --wrong-bg: #fdebd0;
            --wrong-border: #fad7a1;
            --text: #2c3e50;
            --bg: #ebedf0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background: #fff;
            max-width: 950px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            box-sizing: border-box;
            border-top: 6px solid var(--accent);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #e5e8e8;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .header h2 { color: var(--primary); margin: 0; font-size: 1.9em;}
        .progress { color: var(--accent); font-weight: bold; margin-top: 10px; font-size: 1.15em;}
        .question-text {
            font-size: 1.45em;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .options-list { list-style: none; padding: 0; margin: 0; }
        .option-item {
            background: #fdfefe;
            border: 2px solid #e5e8e8;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.15em;
            display: flex;
            align-items: center;
        }
        .option-item:hover:not(.disabled) { background: #ebf5fb; border-color: #a9cce3; }
        .option-item input { margin-left: 15px; transform: scale(1.4); cursor: pointer; }
        .option-item.disabled { cursor: not-allowed; opacity: 0.95; }
        .option-item.correct { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #145a32; font-weight: bold; }
        .option-item.wrong { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: #7e5109; text-decoration: line-through; }
        
        .feedback-box {
            display: none;
            background: #fbfcfc;
            border-right: 5px solid var(--accent);
            padding: 20px;
            margin-top: 30px;
            border-radius: 5px;
            font-size: 1.1em;
            line-height: 1.7;
        }
        .feedback-box span { font-weight: bold; color: var(--accent); display: block; margin-bottom: 8px;}
        
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 35px;
            border-top: 1px solid #e5e8e8;
            padding-top: 25px;
        }
        .btn {
            background: var(--secondary);
            color: #fff;
            border: none;
            padding: 12px 35px;
            border-radius: 6px;
            font-size: 1.15em;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background: var(--primary); }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>الاختبار الاستنباطي المتقدم: المحاضرة السابعة</h2>
        <div class="progress" id="progress-text">السؤال 1 من 60</div>
    </div>
    
    <div id="quiz-body">
        <div class="question-text" id="q-text"></div>
        <ul class="options-list" id="options-list"></ul>
        <div class="feedback-box" id="feedback-box">
            <span>التأصيل والتفسير (من النص الحصري):</span>
            <p id="feedback-text"></p>
        </div>
    </div>
    
    <div class="nav-buttons">
        <button class="btn" id="btn-prev" disabled>السابق</button>
        <button class="btn" id="btn-next">التالي</button>
    </div>
</div>

<script>
const quizData = [
    // --- المحور الأول: الحديث الحسن لذاته وشروطه ---
    { q: "ما هو الفارق الجوهري والوحيد بين شروط الحديث (الصحيح لذاته) والحديث (الحسن لذاته)؟", o: ["وجود انقطاع يسير في الحسن.", "العدالة، فراوي الحسن قد يكون فاسقاً تائباً.", "الضبط، حيث يُشترط أن يكون راوي الحسن ضابطاً ولكن بنسبة أقل (خفّ ضبطه) مقارنة براوي الصحيح.", "الحسن لا يشترط فيه عدم الشذوذ."], a: 2, e: "النص: 'الحديث الحسن له نفس شروط الحديث الصحيح، ما خلا الضبط؛ فإنه يكون نسبته أقل بنسبة معينة من الصحيح'." },
    { q: "بناءً على تعريف الحديث الحسن، يُشترط في راويه أن تتوافر فيه العدالة التامة (الإسلام، العقل، البلوغ، عدم ارتكاب الكبائر)، شأنه في ذلك شأن راوي الصحيح تماماً.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'العدالة: هل هي مشترطة في الحديث الحسن؟ نعم... فالعدالة شرط في كليهما'." },
    { q: "كيف يقيس علماء الحديث نسبة (الضبط) لدى الراوي لتمييزه بين رتبتي الصحيح والحسن؟", o: ["عبر امتحانات شفهية في المساجد.", "بمقياس علمي دقيق يعتمد على مقارنة (نسبة ما روى) بـ (نسبة ما أخطأ فيه)، فمن أخطأ في ربع مروياته فهو من درجة الحسن.", "بحسب طول لحيته ومروءته الظاهرة.", "بناءً على تزكية الحكام له."], a: 1, e: "النص: 'المقياس علمي دقيق... إذا روى 20 حديثاً وأخطأ في 6 أو 7 (ربع رواياته) نقول هذا من رتبة الحسن، أما من أخطأ في 1 من 20 فهو صحيح'." },
    { q: "الحديث الحسن لا يصلح للاحتجاج به في الأحكام العملية الفقهية لقصور ضبط راويه، ويقتصر استخدامه على فضائل الأعمال.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). النص يؤكد: 'الحديث الحسن حجة يجب العمل به كالصحيح من حيث الأحكام العملية في الفقه... لأنه مصنف في الحديث المقبول'." },
    { q: "أي الألفاظ التالية يستخدمها أئمة الجرح والتعديل لوصف الراوي الذي يُحكم لحديثه بأنه (حسن لذاته)؟", o: ["ثقة ثبت.", "صدوق، أو لا بأس به.", "حجة.", "متروك."], a: 1, e: "النص: 'راوي الصحيح يقولون عنه: ثقة ثبت، ثقة، حجة. أما راوي الحسن يقولون عنه: صدوق، لا بأس به'." },
    
    // --- المحور الثاني: الحديث الحسن لغيره والتقوية ---
    { q: "ما هو الشرط الأساسي لارتقاء الحديث الضعيف إلى مرتبة (الحسن لغيره)؟", o: ["أن يعمل به فقهاء المدينة.", "أن يكون ضعفه (خفيفاً) كالانقطاع أو سوء الحفظ، ثم يُروى من طريق آخر مثله أو أقوى منه فيعضده.", "أن يرويه راوٍ متهم بالكذب ويتوب.", "أن يكون في متنه ترغيب وترهيب فقط."], a: 1, e: "النص: 'ما كان فيه ضعف خفيف، ثم روي من طريق أخرى مثله أو أقوى، ارتقى إلى الحسن لغيره'." },
    { q: "كل حديث ضعيف مهما بلغت درجة ضعفه، فإنه يرتقي ويصبح مقبولاً إذا تعددت طرقه وُروي من ثلاثة أو أربعة أسانيد.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). النص: 'ليس كل ضعيف يتقوى... هناك ضعف شديد لا يتقوى ولا ينجبر مهما جاءت طرق أخرى'." },
    { q: "أي من الرواة التالين يُعتبر ضعفهم (يسيراً قابلاً للتقوية والجبر) إذا تعددت الطرق؟", o: ["راوٍ فاحش الغلط (أخطأ في 9 من أصل 10 أحاديث).", "الراوي (المستور) الذي تُعرف عدالته الظاهرة وتُجهل الباطنة.", "الراوي المتهم بالكذب.", "الراوي الفاسق الذي يشرب الخمر."], a: 1, e: "النص: 'المستور هو مجهول العدالة الباطنة... ففيه ضعف، وإذا جاءنا من طريق آخر يتقوى'." },
    { q: "لو جاءنا حديث مرسل من طريق سعيد بن المسيب، وجاء نفس المتن من طريق مرسل آخر للزهري، فبماذا يُحكم على هذا الحديث؟", o: ["يبقى ضعيفاً لانقطاعه من الجهتين.", "يرتقي إلى رتبة (الحسن لغيره) لأن المرسل ضعف يسير يتقوى بتعدد الطرق المستقلة.", "يصبح صحيحاً لذاته.", "يُحكم عليه بالوضع."], a: 1, e: "النص: 'كونه جاء بإسنادين وكل منهما مرسل... فيتقوى هذا المرسل بالمرسل الآخر، فيشعر بأن له أصلاً فيرتقي إلى رتبة الحسن'." },
    { q: "الراوي (المختلط) الذي أصابه ما يشبه الزهايمر في كبره، تُرد جميع أحاديثه مطلقاً ولا تتقوى بأي طريق آخر لخطورة حالته.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). النص فرّق: 'أما الزهايمر الكامل لا يُقبل... لكن الاختلاط الذي فيه شك (أخطأ في بعض وأصاب في بعض)، إذا جاء من طريق آخر يترجح ضبطه ويتقوى'." },
    { q: "لماذا اعتبر العلماء أن (الكذب في حديث الناس) مانع قطعي من تقوية الحديث حتى لو لم يثبت كذب الراوي على النبي ﷺ؟", o: ["لأنه يفسد العلاقات الاجتماعية.", "لأن من لا يتورع عن الكذب في حديث الناس، يُخشى ألا يتورع عن الكذب في حديث النبي ﷺ، فضعفه شديد لا ينجبر.", "لأنه شرط في القرآن.", "بسبب فتوى الإمام مالك."], a: 1, e: "النص: 'الكذب في حديث الناس لا يقوي، لأن من لا يتورع عن الكذب في حديث الناس يخشى ألا يتورع عن الكذب في النبي'." },
    { q: "عملية (تقوية الحديث الضعيف) بتعدد الطرق هي عملية رياضية حتمية؛ فكلما جمع الباحث إسنادين ضعيفين أنتجا حديثاً حسناً 1+1=2.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص صرح: 'القضية ليست معادلة رياضية، بل قضية علمية، المحدث يدرك سبب الضعف... ومن يتسرع في التقوية بمنهج رياضي فمنهجه ليس بسديد'." },

    // --- المحور الثالث: المنهجية الثنائية والثلاثية والحديث الضعيف ---
    { q: "كيف تفسر التباين بين الإمامين ابن حبان (الذي حكم على حديث بالصحة) وابن حجر (الذي حكم عليه بالحسن)؟", o: ["ابن حجر اكتشف علة خفية لم يعرفها ابن حبان.", "لا يوجد تعارض؛ فابن حبان يعتمد (القسمة الثنائية: مقبول/مردود) فالحسن عنده يُسمى صحيحاً (مقبولاً)، بينما ابن حجر يعتمد القسمة الثلاثية.", "ابن حبان كان متساهلاً جداً.", "ابن حجر يرفض أحاديث الآحاد."], a: 1, e: "النص: 'لا هذا ليس تعارض، الإمام ابن حبان عنده الحديث قسمان (صحيح وضعيف)... فما يترقى للحسن يدخله في الصحيح (المقبول)'." },
    { q: "عرّف العلماء الحديث الضعيف بأنه (الحديث الذي لم يستكمل صفات القبول الخمسة)، وبناءً عليه إذا اختل شرط واحد ولم يوجد ما يقويه، سقط الحديث للضعف.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'هو الحديث الذي لم يستكمل صفات القبول... فكل حديث نقصت فيه صفة من الصفات... ينزل إلى رتبة الحديث الضعيف'." },
    { q: "إلى كم نوع أوصل الإمام ابن الصلاح مصطلحات الحديث الضعيف بناءً على تعدد أسباب الضعف؟", o: ["49 مصطلحاً.", "42 مصطلحاً.", "129 مصطلحاً.", "3 مصطلحات فقط."], a: 1, e: "النص: 'ابن الصلاح ذكر 42 مصطلحاً يصف بها الأحاديث الضعيفة، وابن حبان وصل بها إلى 49... والتجويز العقلي يصل لـ 129'." },
    { q: "مراتب الحديث الضعيف متساوية كلها في الرداءة، فخفيف الضعف كالمُرسل يُعامل تماماً معاملة الحديث المكذوب لأن كلاهما مردود.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). النص: 'الضعيف ليس رتبة واحدة، بل بينهما تفاوت كبير، نبدأ من خفيف الضعف كالمرسل الذي كان بعض العلماء يقبله... إلى الحديث المكذوب'." },

    // --- المحور الرابع: العمل بالحديث الضعيف وشروط ابن حجر ---
    { q: "ما هو الرأي الفقهي (الثاني) الذي يُنسب للإمامين أحمد وأبي داود فيما يخص العمل بالحديث الضعيف؟", o: ["رفضه مطلقاً.", "العمل به مطلقاً في الأحكام والآداب (طالما لم يشتد ضعفه ولا يوجد في الباب سواه)، لأن ضعيف الحديث خير من رأي الرجال.", "العمل به في العقائد فقط.", "اشتراط أن يرويه الصحابة مباشرة."], a: 1, e: "النص: 'يعمل به مطلقاً طالما لم يشتد ضعفه ولا يوجد في الباب سواه... أثر عنهم: ضعيف الحديث عندي خير من رأي الرجال'." },
    { q: "المذهب الذي استقر عليه المتأخرون (الرأي الثالث) يجيز العمل بالحديث الضعيف في (الفضائل والمناقب والترغيب) ولكن بثلاثة شروط صارمة.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'اشتهر عند المتأخرين... يعمل به في الفضائل والمناقب... ولا يبنى عليها حكم فقهي، بشروط ثلاثة'." },
    { q: "أي من التالي **ليس** من شروط الحافظ ابن حجر للعمل بالحديث الضعيف في الفضائل؟", o: ["أن يكون ضعفه غير شديد (لا يتفرد به كذاب أو فاحش الغلط).", "أن يندرج تحت أصل عام مشروع (لا يخترع عبادة جديدة).", "ألّا يعتقد عند العمل به ثبوته، بل يعمل به احتياطاً.", "أن يكون الراوي قد قارب المائة عام من عمره."], a: 3, e: "النص حدد الشروط الثلاثة بوضوح: الضعف غير شديد، أصل مشروع، العمل به احتياطاً دون اعتقاد الثبوت." },
    { q: "إذا ورد حديث (ضعيف) يخترع صلاة جديدة بهيئة غريبة لم ترد في أي حديث صحيح، فإنه يجوز العمل به من باب (فضائل الأعمال).", o: ["صح", "خطأ"], a: 1, e: "خطأ. لأنه أخلّ بالشرط الثاني: (أن يندرج تحت أصل مشروع ولا يخترع عبادة جديدة أو هيئة لم تثبت)." },
    { q: "كيف عالج المحاضر ظاهرة العوام الذين يقومون ليلة العيد بناءً على حديث ضعيف ويتركون صلاة الفجر جماعة؟", o: ["أثنى على اجتهادهم في النوافل.", "اعتبره (خللاً في الأولويات وفي العلم)؛ لأنهم تركوا الفريضة المتيقنة من أجل نافلة وردت بحديث ضعيف لا يجزم بنسبته.", "أكد أن صلاة العيد تنسخ صلاة الفجر.", "طالبهم بترك الصلاة كلياً."], a: 1, e: "النص: 'هذا من خلل الأولويات ومن خلل العلم... فلا يترك الشيء الثابت المتفق عليه لأجل شيء ورد بحديث ضعيف'." },

    // --- المحور الخامس: تطبيقات الفقهاء والرد على الألباني ---
    { q: "الفقيه المجتهد يبني أحكامه الشرعية بناءً على استحضار الآيات، والأحاديث (حتى الضعيفة منها للاستئناس)، والقياس، وأقوال الصحابة، في باقة واسعة من الأدوات.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'الفقيه يجمع كل ما ورد فيها، صحيحاً، حسناً، ضعيفاً... ويرجع لعمل الصحابة... والقياس، كل هذه توضع بين يدي العالم المجتهد'." },
    { q: "لماذا أورد الإمام الشافعي في كتابه (الأم) بعض الأحاديث الضعيفة رغم تأصيله لرد الضعيف؟", o: ["لأنه تراجع عن منهجه في آخر حياته.", "ليستدل بها كـ (تتميم للمسألة وتأكيد للاجتهاد الفقهي)، حيث يعضدها بعمل الصحابة والقياس الجلي، فتصبح من جملة المؤيدات.", "لأنه لم يكن يعرف علم الإسناد.", "لإرضاء العوام."], a: 1, e: "النص: 'يذكر الحديث الضعيف تتميماً للمسألة، تأكيداً للاجتهاد... يقول: وإن لم يثبته أهل الحديث ولكن قال بمقتضاه أبو بكر... ويؤيده القياس'." },
    { q: "صنيع الإمام البخاري في تعليق الأحاديث الضعيفة في (تراجم الأبواب) يدل على أنه كان يرى رمي الأحاديث الضعيفة جملة واحدة وعدم النظر فيها أبداً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة النهاية). يدل على (عكس ذلك تماماً)، فهو لم يستغنِ عن الضعيف، واستخدمه لتقوية الاستنباط الفقهي في التبويبات." },
    { q: "ما هو المأخذ المنهجي العميق (حسب النص) على عمل الشيخ الألباني حين قسم السنن إلى (صحيح) و(ضعيف وموضوع)؟", o: ["أنه لم يكن يملك شهادة أكاديمية.", "أنه جعل (الضعيف والموضوع) في رتبة واحدة وتجاهلها، مما أوهم الباحثين بتركها كلياً، وهذا يخالف الفقه المنهجي لأصحاب السنن كأبي داود الذين أوردوها قاصدين للاستدلال بها.", "أنه زاد في أحاديث السنن.", "أنه ترجمها للغات أخرى خطأً."], a: 1, e: "النص: 'فجعل الضعيف والموضوع رتبة واحدة وهذا في الفطر العلمي غير مقبول... هل كان أبو داود جاهلاً بضعفها؟ بل هو إمام مجتهد... رميها جملة واحدة يخالف عمل المحدثين'." },
    { q: "الإمام أبو داود كان يجهل ضعف الأحاديث التي وضعها في سننه، ولذلك لم يقم بفرزها وتنقيتها للمسلمين.", o: ["صح", "خطأ"], a: 1, e: "خطأ. المحاضر استنكر هذا بشدة: 'إذا قلنا أنه كان جاهلاً فنحن لا نعرف أبي داود... بل كان قادراً (على الفرز) ولكنه وضعها للاستدلال الفقهي'." },
    { q: "كيف تعامل الحفاظ الكبار كابن عساكر والخطيب البغدادي مع جمع الأحاديث الضعيفة في مصنفاتهم؟", o: ["أخفوها وحرقوها.", "جمعوا في الباب كل ما يعرفونه من صحيح وحسن وضعيف وموضوع، لتوثيق كل ما قيل، تاركين مهمة الفرز والتفتيش للعلماء من بعدهم.", "شرحوها على أنها متواترة.", "جعلوها في كتاب خاص سموه (الأكاذيب)."], a: 1, e: "النص: 'لما جمعوا أحاديث في باب معين، جمعوا كل ما يعرفونه من صحيح وضعيف وموضوع، وعليك أنت أن تفرز... لا تنقل شيئاً حتى تفتش'." },

    // --- توليد بقية الأسئلة للاستيفاء (60 سؤالاً) بالقياس والاستنباط والمشتتات المركبة ---
    { q: "الاستنباط الفقهي (الاجتهاد المطلق) عملية سهلة تتم بمجرد قراءة ظاهر آية أو حديث واحد صحيح، وهذا ما نص عليه المحاضر بوضوح.", o: ["صح", "خطأ"], a: 1, e: "خطأ. النص: 'الاجتهاد لا يكون بناءً على رواية حديث واحد، ولا بناء على ظاهر آية... الاجتهاد عمل عميق دقيق وحالة نادرة'." },
    { q: "إذا روى (المدلس) حديثاً بالعنعنة (قال فلان)، فإنه يُعد منقطعاً حكماً، فكيف يترقى حديثه؟", o: ["بأداء قسم أمام القاضي بأنه سمعه.", "بمجيء رواية أخرى بسند آخر فيها ضعف يسير (كمستور أو مرسل) تشهد لمتنه، فيترقى لـ (الحسن لغيره).", "لا يترقى أبداً كالكذاب.", "إذا رواه في مكة فقط."], a: 1, e: "النص: 'رواية المدلس... نشك في السماع فنقول منقطع حكماً... ثم تأتي رواية أخرى بسند آخر فيها ضعف ربما مستور... فتتقوى رواية المدلس'." },
    { q: "مقولة (الضعيف لا يُعمل به مطلقاً) هي الرأي المعتمد الوحيد عند أهل السنة والجماعة ولا يوجد رأي غيره.", o: ["صح", "خطأ"], a: 1, e: "خطأ. هي الرأي الأول فقط (نسبته محل نقاش)، وهناك الرأي الثاني (يُعمل به إن لم يوجد غيره)، والثالث (يُعمل به في الفضائل بشروط)." },
    { q: "في ضوء فهم (العلة الخفية)، هل خلو الحديث من الشذوذ والعلة شرط في الحديث الحسن كما هو في الصحيح؟", o: ["لا، هو شرط في الصحيح فقط.", "نعم، يشترط في الحسن أن يكون غير معلل ولا شاذ.", "يُشترط عدم الشذوذ دون عدم العلة.", "يُشترط في المتن دون السند."], a: 1, e: "التعريف: 'متصل السند غير معلل ولا شاذ'، والنص: 'عدم شذوذ أيضاً شرط في الحسن... والشرط الأخير عدم العلة'." },
    { q: "المرتبة المذكورة لحديث (الحسن لغيره) تعني أنه أقوى من (الصحيح لذاته) لتعدد طرقه وكثرة رواته.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (الحسن لغيره) أصله ضعيف ارتقى، فهو أدنى مرتبة من (الصحيح لذاته) الذي رواته أئمة ضابطون." },
    { q: "عندما أخرج الإمام البخاري كتابه (الأدب المفرد)، ما الذي يميز منهجه فيه عن (الجامع الصحيح)؟", o: ["أنه كُتب باللغة الفارسية.", "أنه أورد فيه الصحيح والحسن والضعيف (في الفضائل والآداب) لأنها قابلة للعمل، بينما اشترط الصحة الصارمة في المسند.", "أنه خصصه لأحاديث المواريث فقط.", "أنه حذف جميع الأسانيد منه."], a: 1, e: "النص: 'ألف كتاباً في الأدب المفرد... وضع فيه صحيح وحسن وضعيف لأنها قابلة للعمل، لكن في الصحيح المسند اقتصر على الأحاديث الصحيحة'." },
    { q: "القياس الاستنباطي: لو تعارض (حديث صحيح قطعي) مع حديث (حسن لذاته)، فإن المحدثين يقدمون الحديث الحسن تبركاً برواته.", o: ["صح", "خطأ"], a: 1, e: "خطأ. يُقدم الأوثق والأقوى، ومخالفة الأضعف للأقوى تسمى (شذوذاً) تُرد بها الرواية." },
    { q: "ما المعنى الفقهي لـ (القياس الجلي) الذي قد يُعضّد الحديث الضعيف؟", o: ["وزن الكتب بالميزان.", "أنه فرع النص ومن مؤداه، يعتبر مصدراً من مصادر التشريع، يتقوى به الحديث الضعيف ليُصبح من جملة الاستدلالات المقبولة.", "أنه حديث متواتر.", "رؤية النبي في المنام."], a: 1, e: "النص: 'يؤيده قياس جلي والقياس مصدر من مصادر التشريع... فهو فرع النص... فهذا الاستئناس يكون ضمن الأدوات الاجتهادية'." },
    { q: "قول الفقيه: (وهذا الحديث وإن لم يثبته أهل الحديث ولكن قال بمقتضاه أبو بكر وعمر)، يُعد مثالاً على الاستغناء التام عن السُنة.", o: ["صح", "خطأ"], a: 1, e: "خطأ. هذا تطبيق عملي لدعم الحديث الضعيف بعمل الصحابة وقوة القياس لاعتماده كدليل ترجيحي (صنيع الشافعي)." },
    { q: "من هو الإمام الذي يُنسب إليه قول: (ضعيف الحديث عندي خير من رأي الرجال)؟", o: ["الإمام الطبري.", "الإمام أحمد بن حنبل، وأبو داود، وأبو حنيفة، ومالك.", "الإمام الغزالي.", "الإمام ابن تيمية."], a: 1, e: "النص: 'وهذا نسب إلى الإمام أحمد ونسب لبعض الأئمة... والإمام أبي داود والإمام أبي حنيفة والإمام مالك'." },
    
    // إكمال العدد إلى 60 بسؤال وجواب مباشر لضمان كثافة الاختبار (37 إلى 60)
    { q: "شرط (ألا يعتقد عند العمل به ثبوته) للحديث الضعيف يعني أن يعمل به المسلم احتياطاً دون الجزم بأن النبي ﷺ قاله فعلاً.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'ألا يعتقد عند العمل به ثبوته وإنما يعمل به احتياطاً فلا يجزم أن النبي قاله'." },
    { q: "إذا روى راوٍ ضابط لكنه يصر على صغائر الذنوب حديثاً متصلاً، فما حكم حديثه؟", o: ["صحيح لذاته.", "مردود (ضعيف) لاختلال شرط العدالة التي تمنع الإصرار على الصغائر.", "حسن لغيره.", "متواتر."], a: 1, e: "النص في العدالة: 'لا يرتكب الكبائر، لا يصر على الصغائر... وإلا لا يقبل خبر الفاسق'." },
    { q: "مصطلح (الحديث المقبول) هو مظلة تشمل الحديث الصحيح والحديث الحسن معاً، فكلاهما ترجّح جانب ثبوته.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'الحديث المقبول هو ما كان صحيحاً أو حسناً... هو ما ترجح جانب ثبوته'." },
    { q: "في حال تفرد الراوي (فاحش الغلط) بحديث لا يرويه غيره، فهل يجوز العمل به في الفضائل (الرأي الثالث)؟", o: ["نعم مطلقاً.", "لا، لأنه أخل بالشرط الأول وهو أن لا يكون الضعف شديداً (كفاحش الغلط).", "نعم، إذا كان الحديث قصيراً.", "نعم، إذا عمل به العوام."], a: 1, e: "النص: 'الشرط الأول أن يكون ضعفه غير شديد فلا ينفرد به كذاب أو فاحش الغلط... فهذه لا يعمل بها ولا ينظر إليها'." },
    { q: "الاعتماد على التقسيم الثنائي (مقبول ومردود) كان شائعاً عند عدد كبير من المحدثين المتقدمين قبل استقرار القسمة الثلاثية.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'كثيراً من المتقدمين ما كانوا يفرقون بين الصحيح والحسن يعتبرون الحديث قسمان: مقبول ومردود'." },
    { q: "عندما يقول العلماء (لا مُشاحة في الاصطلاح)، فإنهم يعنون بذلك:", o: ["تحريم استخدام المصطلحات.", "أنه لا نزاع في التسمية (حسناً كان أو صحيحاً عند المتقدمين) طالما اتفقنا على الجوهر وهو أنه (مقبول) يُعمل به.", "أن كل المصطلحات خاطئة.", "إلزام الجميع بمصطلح واحد بقوة القانون."], a: 1, e: "النص: 'كما يقول العلماء لا مشاحة في الاصطلاح طالما فهمنا المقصد وفهمنا أنه مقبول أو مردود فلا يوجد مشكلة'." },
    { q: "الحديث الذي يرويه شخص (لا بأس به) عن مثله بسند متصل، يُحكم له بأنه صحيح لذاته نظراً لصدق رواته.", o: ["صح", "خطأ"], a: 1, e: "خطأ. يُحكم له بأنه (حسن لذاته) لأن عبارة (لا بأس به) من ألفاظ مراتب رواة الحسن." },
    { q: "إذا جمع الباحث أربعة أسانيد لحديث واحد، وكل إسناد فيه (راوٍ كذاب)، فما هي النتيجة العلمية؟", o: ["يرتقي إلى الصحيح.", "يبقى حديثاً شديد الضعف (مكذوباً) لا ينجبر ولا يتقوى، لأن الكذب ضعف لا يعضده شيء.", "يصبح حسناً لغيره.", "يُعمل به في الفضائل فقط."], a: 1, e: "النص: 'أما الذي لا ينجبر: رواية الفاسق، رواية الكذاب... لا يتقوى'." },
    { q: "الفقه المنهجي للإمام أبي داود في سننه كان يقتضي حذف أي حديث ضعيف حتى لا يختلط بالصحيح.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). النص أكد أنه (لم يحذفها بل كان قادراً) لأن غايته كانت إيراد الأحاديث التي يُستدل بها فقهياً ولو كان فيها ضعف يسير." },
    { q: "ما هو تصنيف الحديث الذي (ترجح عدم ثبوته) أو (لم يترجح جانب ثبوته)؟", o: ["الحديث الحسن.", "الحديث الضعيف.", "الحديث المتواتر.", "الحديث القدسي."], a: 1, e: "النص: 'وأما ما لم يترجح جانب ثبوته أو ترجح عدم ثبوته فهو الحديث الضعيف'." },
    { q: "الاجتهاد المطلق يتطلب من الفقيه استحضار مقاصد الشريعة والقواعد الكلية إلى جانب النصوص الجزئية.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'ويرجع إلى الاستدلال العقلي على النصوص، على الأصول العامة، على المقاصد الشرعية... واسع النظر'." },
    { q: "كيف اعتبر المحاضر عمل الباحث الذي يرد الأحاديث الضعيفة بناءً على تصنيفات (السلسلة الضعيفة) دون نظر فقهي؟", o: ["عملاً عظيماً.", "تسرعاً وإهمالاً للفقه المنهجي لأصحاب السنن الذين لم يعاملوا الضعيف كالموضوع، ورمياً لجهد الفقهاء المجتهدين.", "عملاً يوافق منهج الشافعي.", "ابتكاراً حديثياً خالصاً."], a: 1, e: "النص: 'فجعل الضعيف والموضوع رتبة واحدة وهذا في الفطر العلمي غير مقبول... أن نعامل كل الضعيف معاملة واحدة ونردها جملة فهذا يخالف عمل المحدثين'." },
    { q: "الراوي المتهم بالكذب (الذي لم يثبت كذبه يقيناً ولكن غالب الظن أنه يكذب لغرابة ما يأتي به) تتقوى روايته إذا تعددت الطرق.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). النص: 'العلماء يشكون به شكاً قوياً أنه هو الكذاب، فهذا أيضاً متهم بالكذب لا يتقوى'." },
    { q: "ما هو المثال الذي ضربه المحاضر للتناقض في فهم (الأولويات) لدى العوام بسبب الأحاديث الضعيفة؟", o: ["القتال في الأشهر الحرم.", "صيام النافلة وقيام ليلة العيد المعتمد على حديث ضعيف، مقابل ترك صلاة الفجر المفروضة في جماعة.", "التصدق بكل المال.", "السفر بلا زاد."], a: 1, e: "النص: 'يتمسك بحديث ضعيف ورد في قيام ليلة العيد... ثم يترك صلاة الفجر جماعة ويترك صلاة العيد ينام عنها وهذا خلل كبير'." },
    { q: "الضعيف الذي فيه (انقطاع) في السند يعتبر من النوع الشديد الذي لا يتقوى ولا ينجبر أبداً.", o: ["صح", "خطأ"], a: 1, e: "خطأ. الانقطاع يُعد من (الضعف اليسير) الذي يتقوى إذا جاء من طريق آخر كما مُثل بالمرسل." },
    { q: "إذا قال باحث: (حديث ضعيف لكن له شواهد فهو حسن لغيره)، فما هو النقد المنهجي عليه إن أطلقها بلا قيد؟", o: ["لا يوجد نقد.", "أنه حوّلها إلى (معادلة رياضية)، متجاهلاً أن المحدث يجب أن يدرس (نوع الضعف) أولاً؛ فليس كل ضعيف يتقوى.", "أن الشواهد يجب أن تكون من القرآن.", "أنه لم يترجم الحديث."], a: 1, e: "النص: 'والحقيقة هذا خطأ في المنهج العلمي... القضية ليست معادلة رياضية... المحدث يدرك سبب الضعف فإن صنف أنه غير قابل للتقوية لا يتقوى'." },
    { q: "الإمام النسائي كان عاجزاً فنياً عن فرز الأحاديث الصحيحة من الضعيفة في سننه.", o: ["صح", "خطأ"], a: 1, e: "خطأ. المحاضر تساءل استنكارياً: 'والإمام النسائي... ألم يكن قادراً أن يفرز؟ لا بل كان قادراً' ولكن وضعها عمداً لمنهج فقهي." },
    { q: "كيف يُعرّف الراوي (المختلط) وفقاً للمحاضرة؟", o: ["من يخلط الماء باللبن.", "من كبر في العمر أو أصابته حادثة فخفّ ضبطه، فصار يُدخل الأحاديث في بعضها ويُخطيء ويُصيب، وروايته قابلة للتقوية بشواهد.", "من تعمد الكذب مرتين.", "من يعيش في البادية."], a: 1, e: "النص: 'كبر في العمر فضبطه خف فصار يدخل الأحاديث... ولكن هذا الاختلاط لا يعني أن كل أحاديثه خطأ... فإذا جاء من طريق آخر ترجح ضبطه'." },
    { q: "كتاب (الأم) للإمام الشافعي يخلو تماماً من الاستشهاد بأي حديث ضعيف لصرامة منهجه.", o: ["صح", "خطأ"], a: 1, e: "خطأ. (خدعة). استشهد بها للإسناد والتأييد (تتميم المسألة). النص: 'تجد أنه في كثير من الأحيان يذكر الحديث الضعيف تتميماً للمسألة'." },
    { q: "ما هي الغاية من جمع الحفاظ المتقدمين لكل الأحاديث (الصحيح والموضوع) في مجلداتهم كـ(تاريخ دمشق) لابن عساكر؟", o: ["إفساد الدين.", "توفير المادة الخام وحفظها لتكون تحت يد الباحثين المتأخرين ليقوموا بمسؤولية الفرز والتمحيص والنقد.", "لأنهم كانوا يصدقون كل ما يسمعون.", "للتكسب المالي."], a: 1, e: "النص: 'جمعوا كل ما يعرفونه... وعليك أنت أن تفرز... لا تنقل شيئاً حتى تفتش وتنظر ماذا قال العلماء'." },
    { q: "رواية التابعي مباشرة عن النبي ﷺ (المرسلة) تُعتبر انقطاعاً يُسقط الحديث للضعف، لكنها تتقوى إذا وردت مرسلة من طريق تابعي آخر.", o: ["صح", "خطأ"], a: 0, e: "صح. النص: 'فإذا جاء مرسل... وجاء مرسل آخر بنفس المعنى... يتقوى هذا المرسل بالمرسل الآخر'." },
    { q: "بناءً على الشروط، هل يجوز العمل بحديث تفرد به كذاب في (فضائل صيام يوم الاثنين)؟", o: ["نعم، لأن الصيام أصل مشروع.", "لا، لأن اختلال الشرط الأول (تفرد به كذاب وهو ضعف شديد) يُسقط الحديث تماماً ولا يُنظر إليه حتى في الفضائل.", "نعم، للترغيب.", "نعم، إذا صامه العالم."], a: 1, e: "النص: 'الشرط الأول ضعفه غير شديد فلا ينفرد به كذاب... فهذه لا يعمل بها ولا ينظر إليها'." },

    { q: "الخلاصة المنهجية التي أرادها المحاضر من المحاضرة السابعة هي:", o: ["رفض كل ما هو غير متواتر.", "إنزال كل حديث منزلته العلمية الدقيقة؛ فالصحيح أصل، والحسن حجة، والضعيف اليسير يُستأنس به بشروط ولا يُرمى رمية واحدة.", "الاعتماد على العقل فقط.", "الطعن في جهود المتأخرين."], a: 1, e: "كل المحاضرة تدور حول: 'فالحديث الضعيف ومعاملته معاملة واحدة ورميه رمية واحدة هذا ليس منهج أحد من العلماء'." }
];

let currentQuestion = 0;
let userAnswers = new Array(quizData.length).fill(null);

const qText = document.getElementById('q-text');
const optionsList = document.getElementById('options-list');
const btnNext = document.getElementById('btn-next');
const btnPrev = document.getElementById('btn-prev');
const progressText = document.getElementById('progress-text');
const feedbackBox = document.getElementById('feedback-box');
const feedbackText = document.getElementById('feedback-text');

function loadQuestion(index) {
    const qData = quizData[index];
    qText.textContent = `${index + 1}. ${qData.q}`;
    progressText.textContent = `السؤال ${index + 1} من ${quizData.length}`;
    
    optionsList.innerHTML = '';
    feedbackBox.style.display = 'none';

    qData.o.forEach((opt, i) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'option';
        radio.value = i;
        
        const span = document.createElement('span');
        span.textContent = opt;

        li.appendChild(radio);
        li.appendChild(span);

        if(userAnswers[index] !== null) {
            li.classList.add('disabled');
            radio.disabled = true;
            if(i === qData.a) {
                li.classList.add('correct');
            } else if(i === userAnswers[index]) {
                li.classList.add('wrong');
            }
        }

        li.addEventListener('click', () => {
            if(userAnswers[index] === null) {
                radio.checked = true;
                handleAnswer(index, i, li);
            }
        });

        optionsList.appendChild(li);
    });

    if(userAnswers[index] !== null) {
        showFeedback(qData.e);
    }

    btnPrev.disabled = index === 0;
    btnNext.textContent = index === quizData.length - 1 ? 'إنهاء واستعراض النتيجة الفائقة' : 'التالي';
}

function handleAnswer(qIndex, selectedOption, liElement) {
    userAnswers[qIndex] = selectedOption;
    const qData = quizData[qIndex];
    
    const allOptions = optionsList.querySelectorAll('.option-item');
    allOptions.forEach((item, idx) => {
        item.classList.add('disabled');
        item.querySelector('input').disabled = true;
        
        if (idx === qData.a) {
            item.classList.add('correct');
        } else if (idx === selectedOption && selectedOption !== qData.a) {
            item.classList.add('wrong');
        }
    });

    showFeedback(qData.e);
}

function showFeedback(text) {
    feedbackText.textContent = text;
    feedbackBox.style.display = 'block';
}

btnNext.addEventListener('click', () => {
    if (currentQuestion < quizData.length - 1) {
        currentQuestion++;
        loadQuestion(currentQuestion);
    } else {
        let score = userAnswers.filter((ans, i) => ans === quizData[i].a).length;
        document.getElementById('quiz-body').innerHTML = `
            <div style="text-align:center; padding: 50px 20px;">
                <h2 style="color:var(--primary); font-size: 2.2em; margin-bottom: 20px;">تم إنجاز الاختبار (المحاضرة السابعة)!</h2>
                <div style="background: #fff; border-radius: 12px; padding: 30px; font-size: 1.6em; border: 3px dashed var(--accent); display: inline-block;">
                    حصيلتك المعرفية: <br> 
                    <strong style="color: var(--secondary); font-size: 2.6em;">${score}</strong> من أصل 60
                </div>
                <p style="color: #555; margin-top: 25px; font-size: 1.25em; font-weight: bold;">أثبتّ إتقانك لقواعد "التقوية"، وشروط الفضائل، والمنهجية الفقهية للرد والقبول!</p>
            </div>
        `;
        document.querySelector('.nav-buttons').style.display = 'none';
    }
});

btnPrev.addEventListener('click', () => {
    if (currentQuestion > 0) {
        currentQuestion--;
        loadQuestion(currentQuestion);
    }
});

// التشغيل الفوري
loadQuestion(0);
</script>
