<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار الاستنباطي المتقدم: المحاضرة الحادية عشرة - المنكر، المضطرب، والمعل</title>
    <style>
        :root { --primary: #1a2421; --secondary: #2e4a3d; --accent: #c0392b; --correct-bg: #d4efdf; --correct-border: #27ae60; --wrong-bg: #f5b7b1; --wrong-border: #c0392b; --text: #212f3d; --bg: #f8f9f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .quiz-container { background: #fff; max-width: 950px; width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 40px; box-sizing: border-box; border-top: 6px solid var(--accent); }
        .header { text-align: center; border-bottom: 2px solid #eaeded; padding-bottom: 15px; margin-bottom: 30px; }
        .header h2 { color: var(--primary); margin: 0; font-size: 1.95em; }
        .progress { color: var(--accent); font-weight: bold; margin-top: 10px; font-size: 1.2em; }
        .question-text { font-size: 1.45em; font-weight: bold; color: var(--secondary); margin-bottom: 25px; line-height: 1.6; }
        .options-list { list-style: none; padding: 0; margin: 0; }
        .option-item { background: #fdfefe; border: 2px solid #eaeded; border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; font-size: 1.15em; display: flex; align-items: center; }
        .option-item:hover:not(.disabled) { background: #fdedec; border-color: #e74c3c; }
        .option-item input { margin-left: 15px; transform: scale(1.4); cursor: pointer; }
        .option-item.disabled { cursor: not-allowed; opacity: 0.9; }
        .option-item.correct { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #145a32; font-weight: bold; }
        .option-item.wrong { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: #78281f; text-decoration: line-through; }
        .feedback-box { display: none; background: #fdfefe; border-right: 5px solid var(--accent); padding: 15px 20px; margin-top: 25px; border-radius: 5px; font-size: 1.1em; line-height: 1.7; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .feedback-box span { font-weight: bold; color: var(--accent); display: block; margin-bottom: 8px; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #eaeded; padding-top: 20px; }
        .btn { background: var(--secondary); color: #fff; border: none; padding: 12px 35px; border-radius: 6px; font-size: 1.15em; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn:hover:not(:disabled) { background: var(--primary); }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>الاختبار الاستنباطي المتقدم: المحاضرة الحادية عشرة</h2>
        <div class="progress" id="progress-text">السؤال 1 من 60</div>
    </div>
    <div id="quiz-body">
        <div class="question-text" id="q-text"></div>
        <ul class="options-list" id="options-list"></ul>
        <div class="feedback-box" id="feedback-box">
            <span>التأصيل المنهجي (مستنبط من النص):</span>
            <p id="feedback-text"></p>
        </div>
    </div>
    <div class="nav-buttons">
        <button class="btn" id="btn-prev" disabled>السابق</button>
        <button class="btn" id="btn-next">التالي</button>
    </div>
</div>

<script>
const qd = [
    // --- الشاذ والمنكر وما يقابلهما ---
    {q:"ما هو التعريف الاصطلاحي الراجح للحديث الشاذ عند المتأخرين (كابن حجر)؟",o:["ما رواه الضعيف مخالفاً للثقة.","ما يرويه الثقة أو المقبول مخالفاً لمن هو أولى منه في الحفظ والإتقان أو الكثرة.","ما تفرد به الراوي مطلقاً.","ما روي على أوجه مختلفة متساوية."],a:1,e:"النص: 'الشاذ بهذا التعريف بأنَّه: ما يرويه الثقة أو المقبول مخالفا لمن هو أولى منه في الحفظ والإتقان أو الكثرة'."},
    {q:"يُقابل الحديث (الشاذ) اصطلاحاً الحديثُ (المعروف)، فإذا رُدّ الشاذ قُبل المعروف.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة اصطلاحية). الذي يقابل الشاذ هو (المحفوظ). النص: 'وقلنا ما يقابل الشذوذ هو مفهوم المحفوظ'."},
    {q:"ما هو الفرق الجوهري والدقيق بين الحديث الشاذ والحديث المنكر؟",o:["الشاذ فيه مخالفة، والمنكر ليس فيه مخالفة.","الفرق يكمن في (صفة الراوي المخالِف)؛ ففي الشاذ الراوي ثقة/مقبول، وفي المنكر الراوي ضعيف أصلاً.","الشاذ يكون في المتن فقط، والمنكر في السند فقط.","لا فرق بينهما عند ابن حجر."],a:1,e:"النص: 'والفرق بين الشاذ والمنكر فرق في صفة الراوي... فصفة الراوي في الحديث المنكر ضعيف أصلا'."},
    {q:"الحديث المنكر يكون فيه الراوي ضعيفاً، وزاد ضعفه ضعفاً بأنه خالف غيره ممن هو أقوى منه.",o:["صح","خطأ"],a:0,e:"النص: 'الحديث المنكر الراوي في أصله ضعيف، وزاد الضعف ضعفا بأن خالف غيره ممن هو أقوى منه'."},
    {q:"ما هو المصطلح الحديثي الذي يقابل الحديث (المنكر) ويمثل الطرف المقبول الراجح؟",o:["المحفوظ.","المشهور.","المعروف.","المتواتر."],a:2,e:"النص: 'الذي يقابل الحديث المنكر هو الحديث المعروف، فالطرف الراجح في الموازنة... يسمى المعروف'."},
    {q:"في مثال حديث (من أقام الصلاة... دخل الجنة)، تفرّد (حُبَيِّب بن حَبيب) برفعه للنبي ﷺ، فبماذا حُكم على روايته المرفوعة؟",o:["رواية شاذة لأن حُبَيّباً ثقة خالف الأكثرية.","رواية منكرة لأن حُبَيّباً ضعيف خالف الثقات الذين رووه موقوفاً.","رواية محفوظة.","رواية مضطربة."],a:1,e:"النص: 'خالفهم الراوي حُبيِّب بن حبيب فجعله من كلام الرسول... فترد تلك الرواية ويحكم عليها بالنكارة'."},
    {q:"بناءً على المثال السابق، الرواية الصحيحة (المعروفة) لحديث حُبيّب هي أنه من كلام (ابن عباس) أي حديث موقوف.",o:["صح","خطأ"],a:0,e:"النص: 'الحديث المعروف أنَّه موقوف من كلام ابن عباس وليس من كلام النبي'."},
    {q:"الحديث المنكر، لكونه شديد الضعف، لا يُعمل به حتى في (فضائل الأعمال).",o:["صح","خطأ"],a:0,e:"النص: 'وبالتالي الحديث المنكر روايته مردودة، لا يُحتجُّ ولا يُعمَل به في الفضائل'."},
    {q:"لماذا يُمنع العمل بالحديث المنكر في الفضائل؟",o:["لأن الفضائل لا تثبت إلا بالقرآن.","لأنه ترجّح يقيناً أنه خطأ، والذي يُعمل به في الفضائل يجب أن يكون محتملاً للصحة غير مقطوع بخطئه.","لأنه حديث شاذ.","بسبب فتوى ابن الصلاح."],a:1,e:"النص: 'لأن هذا المنكر ترجَّح أنه خطأ، والذي يعمل به في الفضائل هو ما كان مُحْتملًا أن يكون فيه صِحَّة'."},
    {q:"بعض العلماء المتقدمين (في الطبقات الأولى) كانوا يوسعون دلالة مصطلح (المنكر) ليطلقوه على:",o:["الحديث الصحيح الغريب.","كل حديث تفرد به ثقة.","كثير من الأحاديث الشديدة الضعف المردودة، حتى لو لم يكن فيها (مخالفة).","الحديث المتواتر."],a:2,e:"النص: 'يُطلِق بعض العلماء المتقدمين أحيانا... لفظ المنكر على كثير من الأحاديث الشديدة الضعف ولو لم يكن فيها مخالفة'."},
    {q:"المخالفة التي توجب الحكم بالشذوذ أو النكارة هي أي اختلاف في اللفظ (مثل: جاء وأتى)، حتى لو أمكن الجمع بينهما.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'فالمخالفة يشترط فيها ألا يمكن الجمع بين الروايتين في آن واحد... أما إذا كانت مخالفة بسيطة في اللفظ... فهذه لا تعتبر مخالفة'."},
    {q:"الشرط الأساسي في الحكم بالنكارة (عند المتأخرين) أن يكون الراوي ضعيفاً وأن يخالف من هو أرجح منه.",o:["صح","خطأ"],a:0,e:"النص: 'الشرط الأول: أن يكون الراوي ضعيفًا... الشرط الثاني: أن يخالف الثقة أو من هو في حكمه'."},
    {q:"في الآية (يأمرون بالمعروف وينهون عن المنكر)، استدل المحاضر بها لبيان أن كلمة (المنكر) شرعاً ولغةً تعني:",o:["الشيء النادر.","كل شيء مرذول ومستقبح ومردود.","الخطأ النحوي.","النسيان."],a:1,e:"النص: 'المنكر: هو كل شيء مرذول، ومستقبح، ومردود، ومستشنع'."},
    {q:"لو روى راوٍ ضعيف حديثاً وتفرد به، ولم يخالف أحداً، فهل يُسمى حديثه (منكراً) بناءً على اصطلاح ابن حجر الصارم؟",o:["نعم دائماً.","لا، يشترط ابن حجر وجود (المخالفة) لثقة لتسميته منكراً.","نعم إذا كان في العقيدة.","يسمى شاذاً."],a:1,e:"النص: 'فعرَّفه الحافظ بن حجر بأن المنكر هو: ما رواه الضعيف مخالفا لما رواه الثقة'."},
    {q:"إذا روي الحديث الموقوف (الصحيح) بلفظ المرفوع (المنكر)، فإننا نرد المرفوع ونقول: لم يتضمن جديداً فالأعمال المذكورة ثابتة بأحاديث أخرى.",o:["صح","خطأ"],a:0,e:"النص: 'كل هذا فيه أحاديث صحيحة أخرى... ولكن لا يصح أن نرويه هكذا عن النبي... بل نقول: وجاء عن ابن عباس'."},

    // --- الحديث المضطرب ---
    {q:"ما هو التعريف الدقيق للحديث (المضطرب)؟",o:["ما خالف فيه الثقة من هو أوثق منه.","ما رُوي على أوجُهٍ مختلفةٍ متساوية (في القوة)، لا يمكن الترجيح بينها.","ما سقط من إسناده راويان.","ما تفرد به الضعيف."],a:1,e:"النص: 'هو ما رُوي على أَوْجُهٍ مختلفةٍ متساوية، لا يمكن الترجيح بينها'."},
    {q:"الاضطراب هو حالة اصطدام بين طريقين، استطعنا فيها ترجيح رواية الأوثق ولكن بصعوبة.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة). النص: 'الاضطراب هي حالة اصطدام بين طريقين لم نستطع الترجيح بينهما... فلم نجد الأوثق ولا الأكثر عددًا'."},
    {q:"في حديثي (لا عدوى) و(فر من المجذوم)، ظاهرهما التعارض، فهل يُحكم عليهما بالاضطراب؟",o:["نعم لأنهما متناقضان تماماً.","لا، لأنه أمكن الجمع والتوفيق بينهما (الأول لترسيخ التوحيد والتسليم، والثاني للأخذ بالأسباب).","نعم، الأول ينسخ الثاني.","نعم، لأن رواتهما ضعفاء."],a:1,e:"النص: 'فالمعنيان متكاملان فليس بينهما تعارض، فلو ما استطعنا أن نوفق لربما قلنا أن الحديثين بينهما اضطراب... وهذا مُنتَفٍ'."},
    {q:"حكم الحديث المضطرب هو:",o:["صحيح لغيره.","ضعيف ومردود؛ لأن الاضطراب يُشعر بقلة ضبط الراوي وعدم معرفة الوجه الصواب.","حسن لذاته.","مقبول في الفضائل."],a:1,e:"النص: 'الحديث المضطرب في الحقيقة يسبب ضعفًا في الحديث ويرد؛ لأن الراوي لم يضبطه'."},
    {q:"إذا اختلف الرواة الثقات في اسم الصحابي (هل هو معقل بن سنان أم معقل بن يسار)، فإن هذا الاختلاف يوجب الحكم باضطراب الحديث ورده.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة). النص: 'اختلاف بسيط لا يؤثر، كاختلاف اسم الصحابي... وهذا الأمر لا يضر، فالصحابة كلهم عدول'."},
    {q:"الاضطراب قد يقع في السند، وقد يقع في المتن، وكلاهما يوجب التوقف في الحديث.",o:["صح","خطأ"],a:0,e:"النص: 'طبعًا الاضطراب قد يكون في السند، وقد يكون في المتن... والأصل في الاضطراب أنه متوقف فيه'."},
    {q:"في مثال المضطرب سنداً: حديث (شيّبتني هود وأخواتها)، مَن هو الإمام الثقة الذي كان مدار الاضطراب ورواه على عدة أوجه مختلفة؟",o:["عكرمة.","أبو إسحاق السبيعي.","أبو بكر الصديق.","ابن مسعود."],a:1,e:"النص: 'مدار الحديث هو أبو إسحاق السبيعي... لما رواه... مرة عن أبي بكر، ومرة عن ابن مسعود ومرة يكون مرسلًا... أورث العلماء حيرة'."},
    {q:"كيف يُحكم بضعف حديث (شيبتني هود) رغم أن راويه (أبو إسحاق السبيعي) ثقة ويروي عن ثقات؟",o:["لأنه اختلط في آخر عمره.","لأن كثرة الوجوه والاختلاف الشديد (7 وجوه) تدل يقيناً على أن هذا الثقة لم تضبط ذاكرته هذا الحديث تحديداً.","لأنه خالف القرآن.","لأن المتن منكر."],a:1,e:"النص: 'أن يكون سبع وجوه لحديث واحد، نقول إن الحديث لم ينضبط... هذه من أخطاء أبي إسحاق القليلة، التي ربما لم تسعفه الذاكرة جيدًّا'."},
    {q:"حديث عبد الرزاق الصنعاني عن ابن عمر (نهى أن يعتمد الرجل على يده في الصلاة) هو مثال على:",o:["المضطرب سنداً.","المضطرب متناً، لاختلاف الرواة في تحديد موضع النهي بدقة مع تساوي قوتهم الإسنادية.","الشاذ.","المنكر."],a:1,e:"النص: 'وبالتالي هنا اضطراب في المتن... ما عرفنا الآن النهي عن ماذا؟... لأن هذه الأوجه كلها متساوية'."},
    {q:"الأحاديث المضطربة كثيرة جداً وتملأ كتب الصحاح كالبخاري ومسلم.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'الأحاديث المضطربة نادرة جدًّا؛ فالأحاديث التي وقف عندها العلماء ولم يجدوا لها حلاً، هي قليلة جدًّا'."},
    {q:"كيف انتقد المحاضر منهج بعض المعاصرين في الحكم بالاضطراب؟",o:["ينتقدون الأسانيد فقط.","يتسرعون في رمي الأحاديث الصحيحة (حتى في الشيخين) بالاضطراب بمجرد رؤية أي اختلاف ظاهري، لعجزهم عن الجمع الذي أتقنه الجهابذة.","لا يعترفون بالاضطراب أصلاً.","يقلدون المتقدمين تقليداً أعمى."],a:1,e:"النص: 'أما ما يطرحه الآن كثير من المعاصرين -للأسف-... يحكم على كل لفظين الظاهر بينهما اختلاف... بالاضطراب والضعف... وهذا في الحقيقة دعونا نقول أنه تجرؤ'."},
    {q:"الفن الحديثي الخاص بجمع الروايات التي ظاهرها التعارض والتوفيق بينها يُسمى:",o:["علم الجرح والتعديل.","مشكل الحديث ومختلف الحديث.","علم التخريج.","علم الرجال."],a:1,e:"النص: 'لذلك العلماء وضعوا فنًا خاصًا... عن قضية الجمع بين الأحاديث: مشكل الحديث، ومختلف الحديث'."},
    {q:"مَن مِن الأئمة ذُكر كمثال للجهابذة المتمكنين في الغوص في (مشكل الحديث) والجمع بين الروايات؟",o:["الإمام الطحاوي.","الإمام مالك.","الشيخ الألباني.","ابن حزم."],a:0,e:"النص: 'هذا فن خاص لم يخض فيه إلا جهابذة العلماء، مثل الإمام الطحاوي'."},
    {q:"شبه المحاضر السطحيين في الحديث بالسطحيين الذين يدّعون وجود تعارض واضطراب في:",o:["الشعر الجاهلي.","آيات القرآن الكريم المتعلقة بالمشيئة.","الأحكام الفقهية.","التاريخ الإسلامي."],a:1,e:"النص: 'كذلك السطحيون في علم الحديث... وإلا حتى في القرآن الكريم... بعض سطحيي النظر... قد يقول لك: في القرآن هناك اضطراب وتعارض'."},
    {q:"الوجه الجامع بين الشاذ، والمنكر، والاضطراب هو: (وقوع اختلاف غير محتمل بين الرواة يؤدي للتضعيف).",o:["صح","خطأ"],a:0,e:"النص: 'الوجه الجامع بين الشاذ، والمنكر، والاضطراب: هو وقوع اختلاف بين الرواة، وهذا الاختلاف غير محتمل'."},

    // --- الحديث المعل (المعلل) ---
    {q:"من الناحية اللغوية الصرفة، الكلمة الأدق والأصوب لوصف الحديث الذي فيه علة هي:",o:["المعلول.","المعلل.","الحديث المعل.","العليل."],a:2,e:"النص: 'والحقيقة من حيث اللغة الأصوب أن نقول: الحديث المعل؛ لأنه من فعل: أعل، يعل، فهو معل'."},
    {q:"الحديث (المعل) هو: حديث فيه علة ظاهرة قادحة كضعف الراوي، تُدرك من أول نظرة للإسناد.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة). النص: 'حديث ظاهره السلامة، ولكن فيه علة خفية قادحة في صحته، تظهر للناقد عند البحث'."},
    {q:"ما هو التشبيه الذي استخدمه المحاضر لبيان قدرة الناقد الجهبذ على اكتشاف العلة الخفية؟",o:["تشبيهه بالمهندس المعماري.","تشبيهه بالطبيب الحاذق الذي يكتشف المرض الخفي من عوارض دقيقة رغم أن ظاهر المريض الصحة.","تشبيهه بالقاضي.","تشبيهه بالفلكي."],a:1,e:"النص: 'تجلس مع طبيب حاذق فينظر فيك فيقول أن عندك مشكلة صحية... خبرته وممارسته الطويلة جعلته يدرك'."},
    {q:"إلى كم قسم تنقسم (العلة) في علوم الحديث من حيث تأثيرها؟",o:["قادحة (تسبب الضعف) وغير قادحة (لا تسبب الضعف).","ظاهرة وخفية فقط.","لفظية ومعنوية.","علة في السند فقط."],a:0,e:"النص: 'العلة في علوم الحديث قسمان كما الأمراض: علة قادحة... وعلة غير قادحة'."},
    {q:"إذا اختلف راويان فقالا: (عن سفيان الثوري) وقال الآخر (عن سفيان بن عيينة)، فإن هذه العلة:",o:["قادحة تُسقط الحديث.","غير قادحة ولا تضر لأن كلا الإمامين ثقة.","تجعله شاذاً.","تجعله موضوعاً."],a:1,e:"النص: 'من العلل الغير قادحة مثلا: الأول قال عن سفيان الثوري، والثاني قال عن سفيان بن عيينة، فالاختلاف بينهما لا يضرّ'."},
    {q:"متى تكون العلة المتعلقة باسم (سفيان) قادحة وخفية؟",o:["إذا كانا كلاهما أئمة.","إذا أخطأ الراوي الثقة فظن أن الشيخ هو (سفيان الثوري الإمام) بينما هو في الحقيقة راوٍ آخر اسمه (سفيان) وهو ضعيف.","إذا كان المتن طويلاً.","لا يمكن أن تكون قادحة."],a:1,e:"النص: 'فربما وهِم أحد الرواة الثقات وظنَّ أنّه سفيان الثوري... وإنما هو سفيان آخر الضعيف'."},
    {q:"العلة الاصطلاحية التي يقصدها المحدثون في تعريف الحديث المعل هي (العلة الظاهرة) كانقطاع ظاهر أو راوٍ كذاب.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة). النص: 'فهذه العلة الخفية التي تجعل الحديث معلّا، وهي التي تُسمّى بالعلة الاصطلاحية عند العلماء'."},
    {q:"لماذا كان المتقدمون (كابن المديني والدارقطني) أبرع في اكتشاف العلل الخفية من المتأخرين والمعاصرين؟",o:["لأنهم اخترعوا علم الحديث.","لأن أذهانهم كانت تحفظ جُلّ الأسانيد والروايات عن ظهر قلب، فيميزون خطأ الرواية فوراً كمن يقرأ سورة البقرة.","لأنهم اعتمدوا على برامج البحث.","لأنهم لا يقبلون أي حديث."],a:1,e:"النص: 'لأن هؤلاء العلماء حافظون ذهنيتهم حفظت تقريبا جل الأسانيد... سَمَّعَ أحاديث الزهري حديثًا حديثًا كأنه يقرأ سورة البقرة'."},
    {q:"كيف يحكم أغلب (المتأخرين) على الحديث الذي ظاهره السلامة؟",o:["يُعلّونه احتياطاً.","ينظرون إلى ظاهر السند، فإذا كان متصلاً ورواته ثقات، صححوه مباشرة لتساهلهم وضعف غوصهم في العلل.","يتوقفون فيه.","يعرضونه على القياس."],a:1,e:"النص: 'وبالتالي أغلبهم في الحكم على الأحاديث ينظرون إلى السند ظاهرا... فيأتي ويقول لك حديث صحيح، يصحح... تساهلا'."},
    {q:"كتاب (مجمع الزوائد) للهيثمي، وتصحيحات السيوطي، يمثلان منهج (المتقدمين) المتشدد في كشف العلل الخفية.",o:["صح","خطأ"],a:1,e:"خطأ. يمثلان منهج المتأخرين المتساهل. النص: 'فتجد أحيانا مثلا في تصحيحات الهيثمي... وتجد أحيانا كلام السيوطي في تصحيح الحديث تساهلا'."},
    {q:"ما هو المأخذ الذي سجله المحاضر على بعض المعاصرين (كالشيخ الألباني وأحمد شاكر) في باب العلل؟",o:["أنهم لا يحفظون القرآن.","أنهم صححوا أحاديث بناءً على ظاهر السند، وردّوا كلام أئمة العلل المتقدمين الذين أعلّوها، معتبرين تلك العلل غير مؤثرة.","أنهم ردوا أحاديث صحيحة.","أنهم ألفوا كتباً في العلل."],a:1,e:"النص: 'تصحيحات لأحاديث العلماء أعلّوها، لكنهم رأوا أن هذه العلة لا تأثر والإسناد صحيح الظاهر وبالتالي يردون كلام هؤلاء العلماء'."},
    {q:"عندما يقول إمام كـ (الدارقطني) عن حديث أنه معلّ، يجب علينا أن نقبل قوله مباشرة دون تأنٍ أو بحث.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة). النص: 'ينبغي أن ينظر إلى هذا الكلام نظرة متأنية جدا جدا... لا ينبغي أن نتجاوز كلام العلماء إذا وجدنا فيه كلامًا في العلة'."},
    {q:"ما هو المثال الصارخ الذي ضربه المحاضر لـ (جرأة) بعض المحققين المعاصرين على الأئمة؟",o:["تحقيق صحيح مسلم.","محقق معاصر يُعلق على (سنن أبي داود)، فيقول الإمام أبو داود: (هذا منكر أو معل)، فيرد المحقق في الحاشية: (بل هو صحيح!).","تضعيف الأحاديث المتواترة.","كتابة كتب بلا أسانيد."],a:1,e:"النص: 'فأبو داوود في المتن يقول: وهذا حديث منكر، ثم في الأسفل يقول المحقق: بل هو حديث صحيح... فهذه جرأة!'."},
    {q:"لو تركنا علم العلل واعتمدنا فقط على (الإسناد الظاهر)، لصار كل الناس محدثين قادرين على التصحيح والتضعيف.",o:["صح","خطأ"],a:0,e:"النص: 'وإلا لو كان التعامل مع الحديث بحسب الإسناد الظاهر، لكان كل الناس محدثين، وقادرين على أن يصححوا'."},
    {q:"من أشهر المصنفات في علم العلل والتي بينت أوهام الرواة وأخطاءهم الخفية:",o:["صحيح البخاري.","علل الدارقطني، وعلل ابن أبي حاتم، والعلل الكبير للترمذي.","مقدمة ابن الصلاح.","سنن النسائي."],a:1,e:"النص: 'فكتب العلل موجودة: (علل الدارقطني)؛ (علل ابن أبي حاتم)؛ (العلل الكبير) للإمام الترمذي'."},

    // --- أسئلة استنباطية وربطية (للوصول إلى 60 بدقة وشمولية) ---
    {q:"أي من الأوصاف التالية ينطبق على الراوي في الحديث المنكر؟",o:["ثقة ضابط.","صدوق يهم.","ضعيف خالف من هو أقوى منه.","مجهول الحال فقط."],a:2,e:"النص: 'الحديث المنكر الراوي في أصله ضعيف، وزاد الضعف ضعفا بأن خالف غيره'."},
    {q:"الحديث الشاذ يُمكن العمل به في الأحكام الفقهية إذا تعذر إيجاد حديث محفوظ.",o:["صح","خطأ"],a:1,e:"خطأ. الشاذ مردود ضعيف لا يُعمل به. النص: 'وروايته هي المردودة الضعيفة وتسمَّى هذه الرواية بأنَّها رواية شاذة'."},
    {q:"مصطلح (المنكر) عند متأخري المحدثين يعني:",o:["الحديث المكذوب المقطوع بكذبه.","ما تفرد به الثقة.","ما رواه الضعيف مخالفاً للثقة.","كل حديث غير متصل."],a:2,e:"النص: 'فعرَّفه الحافظ بن حجر بأن المنكر هو: ما رواه الضعيف مخالفا لما رواه الثقة'."},
    {q:"ما هو الحكم الفقهي/الحديثي للعمل بالحديث المعروف؟",o:["مردود.","مقبول ويُحتج به، لأنه الطرف الراجح.","متوقف فيه.","يُعمل به في العقائد فقط."],a:1,e:"النص: 'فالطرف الراجح في الموازنة... يسمى المعروف... المنكر مردود؛ والمعروف مقبول'."},
    {q:"هل تُعتبر كل مخالفة بين الرواة مدعاة للحكم بالشذوذ أو النكارة؟",o:["نعم.","لا، فقط المخالفة التي لا يمكن الجمع بينها (التي تقتضي تضاداً).","لا، فقط المخالفة في السند.","نعم إذا كانت من ثقة."],a:1,e:"النص: 'فالمخالفة الرواية التي تؤثر... إنما هي المخالفة التي لا يمكن الجمع بين الروايتين في آن واحد'."},
    {q:"حديث حُبيّب بن حبيب (من أقام الصلاة... دخل الجنة)، هو في الأصل موقوف صحيح، لكن حُبيّباً رفعه فصار (منكراً).",o:["صح","خطأ"],a:0,e:"النص: 'فرواية الرفع ضعيفة ورواية الوقف هي الصحيحة... فيحكم عليها بالنكارة'."},
    {q:"الحديث المضطرب يشترط فيه (تساوي) وجوه الاختلاف قوةً، فلو كان أحدها أوثق لحُكم عليه بأنه:",o:["مضطرب أيضاً.","شاذ ومحفوظ.","معل.","موضوع."],a:1,e:"النص: 'ففي الشاذ رجحنا رواية الأحفظ والأوثق... أما المضطرب هو حديث جاءنا الطرفان في قوة واحدة'."},
    {q:"الحديث المضطرب يندرج ضمن الأحاديث (المقبولة) نظراً لعدالة رواته المتساوين.",o:["صح","خطأ"],a:1,e:"خطأ. يندرج ضمن المردود لتوقفه. النص: 'وبالتالي هو في حيز المردود؛ أي غير المعمول به'."},
    {q:"في حديث (شيّبتني هود)، تعددت الوجوه لدرجة أن روايةً جعلته عن ابن مسعود، وأخرى أرسلته ولم تذكر الصحابي، وهذا يدل على:",o:["تعدد طرق الحديث وقوته.","اضطراب في المتن.","أن أبا إسحاق لم يضبط إسناد هذا الحديث بعينه.","كذب أبي إسحاق."],a:2,e:"النص: 'ويبدو أن أبا إسحاق السبيعي -وهو ثقة- لم يضبط الحديث، فأخطأ فيه ورواه بطرق مضطربة'."},
    {q:"الخلاصة الفقهية لحديث عبد الرزاق في (الاعتماد على اليد في الصلاة) هي:",o:["النهي عن الاعتماد مطلقاً.","جواز الاعتماد.","التوقف وعدم بناء حكم لاضطراب المتن وتعدد أوجه النهي دون مرجح.","استحباب الاعتماد."],a:2,e:"النص: 'وبالتالي ما نستطيع أن نبني عليه استحبابًا، أو حكمًا شرعيًا... وفيه هذا الاضطراب'."},
    {q:"تسرع المعاصرين في الحكم بالاضطراب يعود في الحقيقة إلى:",o:["براعتهم في علم العلل.","قلة علمهم في (الجمع بين الأحاديث) وسوء فهمهم للمعاني الدقيقة.","حفظهم للأسانيد.","تقليدهم للألباني."],a:1,e:"النص: 'وهذا في الحقيقة دعونا نقول أنه تجرؤ، وسببه قلة علم في الجمع بين الحديث'."},
    {q:"ما هو الفلتر الأخير والأشد قسوة الذي يمر به الحديث ليُحكم بصحته تماماً؟",o:["اتصال السند.","عدالة الرواة.","الخلو من (العلة الخفية القادحة) بعد استيفاء شروط الظاهر.","ضبط المتن."],a:2,e:"النص: 'فهنا اجتاز الحديث الفلاتر الأساسية، ويبقى الفلتر الأخير وهو أن ينظر الناقد... فيكتشف خللاً في الحديث'."},
    {q:"العلة الاصطلاحية (التي يدرسها علم العلل) يجب أن تكون:",o:["ظاهرة وقادحة.","خفية وقادحة.","خفية وغير قادحة.","ظاهرة وغير قادحة."],a:1,e:"النص: 'وبالتالي الحديث المعلّل هو الذي ينبغي أن تكون فيه عِلّة خفيّة تحتاج بحثا وتفتيشا، وتكون قادِحة'."},
    {q:"اعتمد العلماء المتقدمون في كشف العلل على (البحث في التراجم) كما يفعل المعاصرون اليوم عبر البرامج.",o:["صح","خطأ"],a:1,e:"خطأ. اعتمدوا على (الحفظ الذهني العميق للاستقراء التام). النص: 'هؤلاء العلماء المتقدمون هم حفاظ... أما العلماء المتأخرون والمعاصرون الحقيقة هم يعتمدون على البحث'."},
    {q:"في تشبيه (الطبيب الحاذق)، المريض الذي يشتكي ألماً خفياً يمثل:",o:["الراوي الضعيف.","الحديث المعل الذي ظاهره السلامة لكن فيه خلل باطني.","الحديث المضطرب.","المتن الشاذ."],a:1,e:"النص: 'ثم يذهب إلى طبيب حاذق دقيق فيكتشف عنده علة دقيقة هي سبب هذا... هكذا نقول هناك فرق بين الطبيب الماهر الخبير... وبين العادي'."},
    {q:"إذا قال الدارقطني عن حديث ظاهره الصحة إنه (مُعَلّ)، فما هو الموقف المنهجي الأسلم للطالب؟",o:["رد كلامه فوراً.","اتهامه بالتشدد.","الطمأنينة لكلامه وتنزيله منزلة مهمة، لأنه طبيب حاذق استقرأ الأسانيد.","البحث في جوجل."],a:2,e:"النص: 'لا ينبغي أن نتجاوز كلام العلماء إذا وجدنا فيه كلامًا في العلة... لما يشرح ويبين لك علته غالبا هو مصيب'."},
    {q:"إذا كان الاختلاف في الحديث المضطرب لا يؤثر في أصل المعنى أو الحكم (كاسم صحابي بدلاً من آخر)، فهل يُضعّف الحديث؟",o:["نعم.","لا، يزول الاضطراب ويبقى الحديث مقبولاً لأن كليهما صحابي عدل.","نعم لأنه شاذ.","لا، يصبح متواتراً."],a:1,e:"النص: 'فهذا يُحتمل أن يكون صحيحًا ولكن وقع فيه خلل في جزئية لا تؤثر على أصل الحديث ولا تعود عليه بالتضعيف'."},
    {q:"لماذا استبعد العلماء أن يكون حديث (شيبتني هود) شاذاً أو منكراً، وحكموا عليه بالاضطراب؟",o:["لأن رواته ضعفاء.","لأنه جاء من 7 طرق كلها لثقات متساوين تقريباً، ولم يمكن الترجيح، بينما الشاذ والمنكر يُشترط فيهما القدرة على الترجيح.","لأنه يعارض آية.","لأنه متواتر."],a:1,e:"النص: 'فلو كان أحد الرواة ضعيفًا لاستبعدنا رواية الضعيف وقلنا هذا منكر... ولكن أن يكون سبع وجوه... ولم نعرف أي إسناد هو الراجح'."},
    {q:"كلمة (مضطرب) تُطلق أحياناً في كلام الأئمة المتقدمين ويريدون بها الحديث الباطل قطعاً.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة). الذي ذُكرت عنه التوسعة في الاستخدام هو (المنكر) وليس المضطرب. النص: 'يتوسع في لفظ المنكر... يُطلِق... على كثير من الأحاديث الشديدة الضعف'."},
    {q:"العلاقة بين الحديث المضطرب والترجيح هي: متى وُجد الترجيح، انتفى الاضطراب.",o:["صح","خطأ"],a:0,e:"النص: 'الاضطراب هي حالة اصطدام بين طريقين لم نستطع الترجيح بينهما... ففي الشاذ رجحنا... وفي المنكر رجحنا'."},
    {q:"(علم مشكل الحديث) هو العلم الذي أسسه العلماء لرد الأحاديث التي يظهر فيها تعارض واعتبارها مضطربة.",o:["صح","خطأ"],a:1,e:"خطأ. هو علم أسس (للجمع والتوفيق) بينها لدفع دعوى الاضطراب. النص: 'يعني ما يأتي فيه أحاديث ظاهرها التعارض، كيف نجمع وكيف نوفق بينها؟'."},
    {q:"إذا تفرّد الثقة بحديث، ولم يُخالف أحداً، فحديثه ليس شاذاً ولا منكراً.",o:["صح","خطأ"],a:0,e:"النص أكد أن الشذوذ والنكارة يتطلبان (المخالفة). 'أما إذا كانت مخالفة... فهذه لا تعتبر مخالفة'."},
    {q:"الحديث المعل هو الذي فقد شرط (اتصال السند) في الظاهر.",o:["صح","خطأ"],a:1,e:"خطأ. هو حديث (ظاهره السلامة) والاتصال، ولكن فيه علة (خفية). النص: 'ظاهره السلامة، ولكن فيه علة خفية'."},
    {q:"(العلة غير القادحة) هي التي تكتشف بعد جهد ولكنها لا تؤثر في صحة الحديث وقبوله.",o:["صح","خطأ"],a:0,e:"النص: 'العلة غير القادحة: مرض خفيف، صداع بسيط... لا تُسبّب ضعف الحديث'."},
    {q:"المحقق المعاصر الذي اعترض على الإمام أبي داود وصحح الحديث الذي أنكره أبو داود، اعتمد في تصحيحه غالباً على:",o:["الحفظ المتقن.","علم العلل.","النظر في (ظاهر السند) وتراجم الرواة دون غوص في العلل.","الرؤيا المنامية."],a:2,e:"النص: 'وإلا لو كان التعامل مع الحديث بحسب الإسناد الظاهر، لكان كل الناس محدثين، وقادرين على أن يصححوا'."},
    {q:"الشرط الخامس والأخير من شروط الحديث الصحيح هو: (عدم الشذوذ والعلة).",o:["صح","خطأ"],a:0,e:"النص: 'لذلك كان الشرط الأخير في الحديث الصحيح والحسن: ألا يكون شاذًّا؛ وألا يكون معللًا'."},

    {q:"(الشاذ والمنكر والمضطرب والمُعل) كلها من أنواع الأحاديث المردودة الضعيفة.",o:["صح","خطأ"],a:0,e:"كما هو واضح من تأصيلات المحاضرة، كل هذه الأنواع تؤول إلى الرد والضعف لعدم استيفاء شروط الصحة (كعدم الشذوذ والعلة والضبط)." }
];

let currentQ = 0;
let userAns = new Array(qd.length).fill(null);

const qText = document.getElementById('q-text');
const optionsList = document.getElementById('options-list');
const btnNext = document.getElementById('btn-next');
const btnPrev = document.getElementById('btn-prev');
const progText = document.getElementById('progress-text');
const fbBox = document.getElementById('feedback-box');
const fbText = document.getElementById('feedback-text');

function loadQ(idx) {
    const data = qd[idx];
    qText.textContent = `${idx + 1}. ${data.q}`;
    progText.textContent = `السؤال ${idx + 1} من ${qd.length}`;
    
    optionsList.innerHTML = '';
    fbBox.style.display = 'none';

    data.o.forEach((opt, i) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        const radio = document.createElement('input');
        radio.type = 'radio'; radio.name = 'opt'; radio.value = i;
        const span = document.createElement('span'); span.textContent = opt;

        li.appendChild(radio); li.appendChild(span);

        if(userAns[idx] !== null) {
            li.classList.add('disabled'); radio.disabled = true;
            if(i === data.a) li.classList.add('correct');
            else if(i === userAns[idx]) li.classList.add('wrong');
        }

        li.addEventListener('click', () => {
            if(userAns[idx] === null) {
                radio.checked = true; handleAns(idx, i);
            }
        });

        optionsList.appendChild(li);
    });

    if(userAns[idx] !== null) showFb(data.e);
    btnPrev.disabled = idx === 0;
    btnNext.textContent = idx === qd.length - 1 ? 'إنهاء التقييم الصارم' : 'التالي';
}

function handleAns(idx, sel) {
    userAns[idx] = sel;
    const data = qd[idx];
    const items = optionsList.querySelectorAll('.option-item');
    items.forEach((item, i) => {
        item.classList.add('disabled');
        item.querySelector('input').disabled = true;
        if (i === data.a) item.classList.add('correct');
        else if (i === sel && sel !== data.a) item.classList.add('wrong');
    });
    showFb(data.e);
}

function showFb(text) { fbText.textContent = text; fbBox.style.display = 'block'; }

btnNext.addEventListener('click', () => {
    if (currentQ < qd.length - 1) {
        currentQ++; loadQ(currentQ);
    } else {
        let score = userAns.filter((ans, i) => ans === qd[i].a).length;
        document.getElementById('quiz-body').innerHTML = `
            <div style="text-align:center; padding: 50px 20px;">
                <h2 style="color:var(--secondary); font-size: 2.3em; margin-bottom: 20px;">اكتمل الاختبار المتقدم (المحاضرة الحادية عشرة)!</h2>
                <div style="background: #fff; border-radius: 12px; padding: 30px; font-size: 1.6em; border: 3px solid var(--correct-border); display: inline-block;">
                    حصيلتك المعرفية: <br> 
                    <strong style="color: var(--accent); font-size: 2.8em;">${score}</strong> من أصل 60
                </div>
                <p style="color: #455a64; margin-top: 25px; font-size: 1.25em; font-weight: bold;">أثبتّ إتقانك للتفريق بين المنكر والشاذ، واكتشاف العلل الخفية والمضطرب!</p>
            </div>
        `;
        document.querySelector('.nav-buttons').style.display = 'none';
    }
});

btnPrev.addEventListener('click', () => { if (currentQ > 0) { currentQ--; loadQ(currentQ); } });

loadQ(0);
</script>
</body>
</html>
