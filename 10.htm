<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار الاستنباطي المتقدم: المحاضرة العاشرة - المرسل الخفي والشاذ</title>
    <style>
        :root { --primary: #342224; --secondary: #5c3a21; --accent: #d35400; --correct-bg: #d5f5e3; --correct-border: #27ae60; --wrong-bg: #fadbd8; --wrong-border: #c0392b; --text: #2c3e50; --bg: #fdfefe; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .quiz-container { background: #fff; max-width: 950px; width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 40px; box-sizing: border-box; border-top: 6px solid var(--accent); }
        .header { text-align: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; margin-bottom: 30px; }
        .header h2 { color: var(--primary); margin: 0; font-size: 1.95em; }
        .progress { color: var(--accent); font-weight: bold; margin-top: 10px; font-size: 1.2em; }
        .question-text { font-size: 1.45em; font-weight: bold; color: var(--secondary); margin-bottom: 25px; line-height: 1.6; }
        .options-list { list-style: none; padding: 0; margin: 0; }
        .option-item { background: #fbfcfc; border: 2px solid #ecf0f1; border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; font-size: 1.15em; display: flex; align-items: center; }
        .option-item:hover:not(.disabled) { background: #fae5d3; border-color: #e67e22; }
        .option-item input { margin-left: 15px; transform: scale(1.4); cursor: pointer; }
        .option-item.disabled { cursor: not-allowed; opacity: 0.9; }
        .option-item.correct { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #145a32; font-weight: bold; }
        .option-item.wrong { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: #78281f; text-decoration: line-through; }
        .feedback-box { display: none; background: #fdfefe; border-right: 5px solid var(--accent); padding: 15px 20px; margin-top: 25px; border-radius: 5px; font-size: 1.1em; line-height: 1.7; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .feedback-box span { font-weight: bold; color: var(--accent); display: block; margin-bottom: 8px; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #ecf0f1; padding-top: 20px; }
        .btn { background: var(--secondary); color: #fff; border: none; padding: 12px 35px; border-radius: 6px; font-size: 1.15em; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn:hover:not(:disabled) { background: var(--primary); }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>الاختبار الاستنباطي المتقدم: المحاضرة العاشرة</h2>
        <div class="progress" id="progress-text">السؤال 1 من 60</div>
    </div>
    <div id="quiz-body">
        <div class="question-text" id="q-text"></div>
        <ul class="options-list" id="options-list"></ul>
        <div class="feedback-box" id="feedback-box">
            <span>التأصيل المنهجي (مستنبط من النص):</span>
            <p id="feedback-text"></p>
        </div>
    </div>
    <div class="nav-buttons">
        <button class="btn" id="btn-prev" disabled>السابق</button>
        <button class="btn" id="btn-next">التالي</button>
    </div>
</div>

<script>
const qd = [
    {q:"ما هو التعريف الدقيق للحديث (المرسل الخفي) كما نص عليه العلماء؟",o:["أن يُسقط الراوي شيخه ويروي عن شيخ شيخه.","أن يروي الراوي عن من عاصره ولم يلقه، أو لقيه ولم يسمع منه قط.","أن يروي عن من سمع منه بعض الأحاديث ما لم يسمعه منه بصيغة موهمة.","أن يسقط الصحابي من الإسناد."],a:1,e:"النص: 'أن يروي الراوي عن الذي عاصره ولم يلقه، أو لقيه ولم يسمع منه'."},
    {q:"كيف وصف الإمام العلائي (المرسل الخفي) في كتابه جامع التحصيل؟",o:["بأنه نوع مهجور لا فائدة منه.","بأنه مرادف تماماً للتدليس ولا فرق بينهما.","بأنه نوع بديع من أهم علوم الحديث وأعمقها مسلكاً ولا يتكلم فيه إلا حذاق الأئمة.","بأنه من أسهل علوم الحديث المتأخرة."],a:2,e:"النص: 'وهو نوع بديع من أهم أنواع علوم الحديث وأكثرها فائدةً، وأعمقها مسلكًا، ولم يتكلم فيه بالبيان إلا حذاق الأئمة'."},
    {q:"الفرق الجوهري بين (المرسل الخفي) والحديث (المنقطع الظاهر) يكمن في وجود (المعاصرة) أو اللقاء بين الراوي وشيخه في المرسل الخفي، مما يورث خفاء الانقطاع.",o:["صح","خطأ"],a:0,e:"النص: 'أما المرسل الخفي فصعب إداركه... لأن بينهما معاصرة وربما بينهما لقاء، ولكن كان من تقدير الله أنه لم يروِ عنه'."},
    {q:"الراوي في (المرسل الخفي) يستخدم صيغة صريحة كـ (حدثنا) ليوهم الناس باتصال السند رغم عدم سماعه.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة). النص أكد أنه: 'وهو مع ذلك يروي عنه بصيغة لا تُصرّح بالسماع' (مثل: عن/قال)، ولو قال 'حدثنا' لأصبح كذاباً."},
    {q:"ما هو الفرق (القصدي) الدقيق بين التدليس والمرسل الخفي؟",o:["المدلس لا يقصد الإيهام، بينما المرسل يقصده.","المرسل الخفي لم يقصد صاحبه الإيهام، وإنما نحن توهمنا بسبب تقارب الزمان، أما المدلس فقصده الإيهام.","كلاهما يقصد الكذب الصريح.","لا يوجد فرق قصدي بينهما."],a:1,e:"النص: 'الفرق الدقيق بين التدليس والإرسال الخفي أن المرسل الخفي لم يقصد صاحبه الإيهام... أما المدلِّس عنده حالة قصد للإيهام'."},
    {q:"في المرسل الخفي، قد يكون الراوي التقى بشيخه وجلس معه، ولكنه قطعيّاً لم يسمع منه أي أحاديث.",o:["صح","خطأ"],a:0,e:"النص: 'أو أنه إذا التقى به لم يسمع منه الحديث، وبالتالي تُسمى روايته عنه مرسلة'."},
    {q:"بعض العلماء المتقدمين لم يميزوا بين المرسل الخفي والمدلس، بينما المتأخرون هم من أفردوه كنوع خاص.",o:["صح","خطأ"],a:0,e:"النص: 'أما المتأخرون فاصطلحوا على إفراده بنوع خاص وسموه المرسل الخفي'."},
    {q:"الطريق الأول لمعرفة الإرسال الخفي هو: أن يُعرف عدم اللقاء بمعرفة التاريخ، كما في مثال:",o:["رواية ابن عمر عن أبيه.","رواية أبي عبيدة عن أبيه ابن مسعود.","رواية الحسن البصري عن أبي هريرة (حيث لم يلتقيا رغم المعاصرة).","رواية الزهري عن أنس."],a:2,e:"النص: 'مثلًا الحسن البصري... روى عن صحابة آخرين... ولكن لم يُقدَّر له أن يلتقي بأبي هريرة'."},
    {q:"رواية أبي عبيدة بن عبد الله بن مسعود عن أبيه تعتبر متصلة لأن الابن ملازم لأبيه في بيته.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة). النص: 'تُوفي ابن مسعود وأبوعبيدة طفلٌ صغير دون خمس سنوات... وبالتالي روايته عن أبيه منقطعة (إرسال خفي)'."},
    {q:"كيف يكتشف العلماء الانقطاع الخفي عبر (تعدد الروايات)؟",o:["أن يروي الراوي حديثاً طويلاً ثم يختصره.","أن يذكر الحديث عن رجل بـ (عن)، ثم في رواية أخرى يقول: (نُبِّئتُ عنه) أو (أُخبرت عنه) فينكشف الساقط.","أن يرويه بالعربية ثم بالفارسية.","أن يرويه مرة مرفوعاً ومرة موقوفاً."],a:1,e:"النص: 'أن يذكر الراوي الحديث عن رجل، ثم يقول في رواية أخرى نُبِّئتُ عنه أو أُخبرت عنه... فهمنا أنه لم يسمع منه'."},
    {q:"الحكم على الأسانيد بمجرد توافر الثقات وتقارب الأزمان إلكترونياً يُعد عملاً علمياً دقيقاً يغني عن نظر الأئمة.",o:["صح","خطأ"],a:1,e:"خطأ. النص حذر من ذلك: 'يكفينا برنامجًا إلكترونيًّا... هذا ليس علماً، هذا عبارة عن ظاهر علم ولكنه في الحقيقة بعيد كل البعد عن الدقة'."},
    {q:"ما العبرة المنهجية من إعلال الإمام الرازي للحديث الذي صححه الألباني بالوقف؟",o:["أن الألباني غير متخصص.","أن العمل بظاهر الإسناد منتشر جداً، بينما العمق وإدراك العلل الخفية (كعلم الرازي) هو الفيصل في قبول الأحاديث التي تُبنى عليها أحكام.","أن أحاديث العقيدة لا تقبل إلا بالتواتر.","أن الوقف أفضل من الرفع."],a:1,e:"النص: 'فالعمل بالحالة السطحية والظاهرية للأسف منتشرة جدا في عصرنا، بينما العمق وقراءة كلام أهل العلم وفهم دقائق الأمور يحتاج إلى نفس طويل'."},
    {q:"حكم الحديث المرسل الخفي أنه:",o:["متصل حكماً.","ضعيف لانقطاعه، إلا إذا كان للحديث إسناد آخر متصل فيتقوى به.","شاذ.","موضوع مكذوب."],a:1,e:"النص: 'حكم الحديث المرسل الخفي... أكيد ضعيف؛ لأن هناك سقط ونقطاع... إلا إذا كان للحديث إسنادًا آخر متصل... يتقوى الحديث المنقطع به'."},
    {q:"في (التدليس)، الراوي سمع بعض الأحاديث من شيخه ومرر أخرى ليوهم سماعها، بينما في (المرسل الخفي) لم يسمع من هذا الشيخ شيئاً قط.",o:["صح","خطأ"],a:0,e:"النص: 'التدليس وقع سماع لبعض الأحاديث ومرّررالمدلس أحاديث أخرى... أما المرسل الخفي فلم يسمع أصلًا من هذا الشيخ شيئا'."},
    {q:"أي من شروط الحديث الصحيح التالية يناقشها مبحث (الحديث الشاذ)؟",o:["اتصال السند.","عدم الشذوذ.","عدم العلة.","الضبط."],a:1,e:"النص: 'وهو أحد محترزات الحديث الصحيح، أحد شروط الحديث الصحيح الخمسة: ألا يكون شاذًا'."},
    {q:"المعنى اللغوي للشاذ مأخوذ من الانفراد والعزلة، كالغنم القاصية.",o:["صح","خطأ"],a:0,e:"النص: 'الشاذ لغة: هو المنفرد الذي انعزل... (وإنما يأكل الذئب من الغنم الشاذة)'."},
    {q:"ما هو التعريف الاصطلاحي الدقيق لـ (الحديث الشاذ)؟",o:["ما رواه الضعيف مخالفاً للثقة.","ما يرويه الثقة أو المقبول مخالفاً لمن هو أولى منه في الحفظ والإتقان، أو الكثرة.","ما تفرد به الثقة بدون مخالفة.","ما رواه الكذاب."],a:1,e:"النص: 'الشذوذ في الاصطلاح: ما يرويه الثقة أو المقبول مخالفًا لمن هو أولى منه في الحفظ والإتقان، أو الكثرة'."},
    {q:"الحديث الذي يرويه الأوثق والأتقن (الذي قُبل) في مقابل الحديث الشاذ (الذي رُدّ) يُسمى اصطلاحاً:",o:["الحديث المعتمد.","الحديث المتواتر.","الحديث المحفوظ.","الحديث المعروف."],a:2,e:"النص: 'أما الرواية الصحيحة التي تقابل الشاذة تسمى بالحديث المحفوظ'."},
    {q:"إذا كان راوي الحديث (ضعيفاً) وخالف الثقات، فإن حديثه يُسمى شاذّاً أيضاً.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة). النص: 'أما إذا كان الراوي ضعيفا لا يسمى شاذًا... وإنما يسمى منكرًا'."},
    {q:"المخالفة التي توجب الحكم بالشذوذ يجب أن تكون مخالفة (تضاد) لا يمكن الجمع بينها، وليست مجرد اختصار أو اختلاف لفظي يؤدي لنفس المعنى.",o:["صح","خطأ"],a:0,e:"النص: 'المخالفة عند المحدثين التي لا يمكن الجمع بينها... أي مخالفة تضاد'."},
    {q:"إذا روى ثقة (العمل بالنية) وروى آخرون (الأعمال بالنيات)، فإن رواية الأول تعتبر شاذة لمخالفتها الأكثرية.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'فهذا لا يعتبر مخالفة حقيقية لأنه المؤدى اللفظي قريب واحد... وبالتالي هذا لا يعتبر مخالفة'."},
    {q:"هل تعتبر (زيادة الثقة) في اللفظ شاذة دائماً؟",o:["نعم مطلقاً.","لا، قد تُقبل وتسمى زيادة ثقة، ولكنها تُعتبر شاذة إذا كانت تقتضي مخالفة حقيقية لما لم يروه الأوثق.","لا، تُرد دائماً.","زيادة الثقة لا علاقة لها بالشذوذ."],a:1,e:"النص: 'أحيانًا تعتبر زيادة الثقة في اللفظ شاذة إذا كانت تقتضي مخالفة لِما لم يروِهِ... وقد تقبل هذه الزيادة وتسمى (زيادة الثقة)'."},
    {q:"في مثال الشذوذ في السند، رواية (حماد بن زيد) قُبلت لأنها متصلة، بينما رُدت رواية (ابن عيينة وابن جريج) لأنها مرسلة.",o:["صح","خطأ"],a:1,e:"خطأ (عكسي تماماً). النص: 'حماد بن زيد... جعله مرسلًا... بينما ابن عيينة وابن جريج رواياه متصلا... فحكم العلماء على أن رواية حماد بن زيد المرسلة تسمى شاذة'."},
    {q:"في حديث حماد بن زيد (المرسل)، لماذا رده العلماء رغم أنه ثقة؟",o:["لأنه اختلط في كبره.","لأنه خالف (ابن عيينة وابن جريج) وهما إمامان ثقتان اجتمعا على وصل الحديث، فرجحوا الاتصال بالكثرة والحفظ.","لأنه لم يسمع من عمرو بن دينار.","لأن المتن يخالف العقل."],a:1,e:"النص: 'ولكن اجتمع اثنان على مخالفته فحكم العلماء على أن رواية حماد بن زيد المرسلة تسمى شاذة'."},
    {q:"في مثال الشذوذ في المتن (مسح المغيرة بن شعبة)، ما هو اللفظ المحفوظ الذي رواه جماهير الثقات؟",o:["توضأ ومسح على الجوربين.","توضأ ومسح على الخفين.","غسل قدميه.","تيمم."],a:1,e:"النص: 'الجماهير من العلماء من الرواة الثقات كلهم رووه عن سيدنا المغيرة بأنه مسح على الخفين'."},
    {q:"تفرد الراوي (أبو قيس الأودي) بلفظ (مسح على الجوربين)، وحكم عليه البخاري وأحمد وأئمة العلل بأنه:",o:["حديث صحيح ناسخ.","رواية محفوظة.","رواية شاذة أخطأ فيها الراوي (الصدوق) وخالف الجماعة.","حديث متواتر."],a:2,e:"النص: 'قالوا بأن رواية أبو قيس الأودي شاذة، خالفت فيها رواية المجموع... أخطأ فيها أبو قيس'."},
    {q:"الرخصة الشرعية للمسح على الجوربين عند فقهاء المذاهب الأربعة (بناءً على تضعيف حديث الجوربين) اشترطت أن ينطبق على الجورب شروط الخف.",o:["صح","خطأ"],a:0,e:"النص: 'لذلك رجح فقهاء أئمة المذاهب الأربعة أنه لا يعمل بحديث المسح على الجوربين إلا إذا انطبقت عليه شروط الخفين'."},
    {q:"الحديث الشاذ يُعد خطأً من الراوي الثقة، ورغم ذلك يُمكن تقويته إذا ورد من طريق ضعيف آخر.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة النهايات). النص قاطع: 'في الحقيقة لا يمكن أن يتقوى الشاذ، لأن الحديث الشاذ هو حديث خاطئ... فكيف للخطأ أن يتقوى؟'."},
    {q:"ما هو المثال التوضيحي الذي ضربه المحاضر لبيان استحالة تقوي (الشاذ)؟",o:["طالب حصل على 50% ويحتاج درجة للنجاح.","طالب مجتهد نال 96% وأخطأ في إعراب 4 كلمات، فهذه الأخطاء (شاذة) ولا يمكن أن تكون صحيحة بوجه ما ليتم تقويتها.","سيارة معطلة يتم دفعها.","بناء يحتاج لأساسات."],a:1,e:"النص: 'مثال ذلك: إذا كان عندي طالب مجتهد في الصف أخد علامة 96%... وعنده أربع أخطاء... أبدا، فهو أخطأ فيها كيف سيكون الخطأ بعد ذلك صحيحًا؟'."},
    {q:"إذا كان السند شاذاً (كأن يخطئ الراوي في وصله وهو مرسل)، فإن هذا يقتضي حتماً أن يكون المتن باطلاً ولا يصح من أي طريق آخر.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'طبعا حتى لو كان في السند فنحن لا نحكم على المتن بأنه شاذ... فالمتن بالنسبة للشاذ يمكن أن يكون له أسانيد صحيحة أخرى'."},
    {q:"حديث المسح على الجوربين صححه بعض المعاصرين (كالألباني وأحمد شاكر) باعتباره:",o:["رواية متواترة.","مخرجاً مستقلاً (حادثة أخرى مختلفة)، فلم يعتبروا الشذوذ والمخالفة، وهذا خلاف منهج المحدثين المتقدمين.","لأن رواته أئمة.","لأنه موجود في البخاري."],a:1,e:"النص: 'فقال أنه يعتبر هذه حادثة وهذه حادثة مختلفة... ومن صححه لم يعتبر الشذوذ وهذا خلاف منهج المحدثين'."},
    {q:"ما هو الإشكال اللغوي/العرفي الذي ذكره المحاضر حول (الجوربين) في العصر الحالي مقارنة بعصر النبوة؟",o:["أن الجوارب الحديثة أغلى ثمناً.","أن الجورب النبوي كان رقيقاً جداً.","أن الجورب المستعمل اليوم رقيق وشفاف ينفذ منه الماء، بينما جورب الصحابة كان مجلداً أو سميكاً يشبه الخف.","لا يوجد أي إشكال."],a:2,e:"النص: 'هذا الجورب الرقيق جدا الآن... ينفذ إلى الجلد، فهل هذا هو الجورب... لذلك الجورب الذي كان يلبس في تلك الأزمان... مجلدة'."},
    {q:"الخف اصطلاحاً هو ما غطى الكعبين، وإذا نزل عنهما (كالحذاء الرياضي القصير) فلا يُسمى خفاً تُنزل عليه الرخصة.",o:["صح","خطأ"],a:0,e:"النص: 'أما الخف فهو ما غطى الكعبين، ليس مثل الحذاء الرياضي القصير الذي تظهر منه الكعبان فهذا ليس خفًّا'."},
    {q:"الحديث الشاذ يُحتج به في فضائل الأعمال فقط ولا يُبنى عليه حكم فقهي.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'وإذا كان خطأ فلا يحتج به، وإذا كان لا يحتج به فلا يعمل به لا في الفضائل ولا يتقوى'."},
    {q:"خطأ الثقة لا يعيبه ولا يسقط عدالته الكلية إذا كانت نسبة أخطائه قليلة جداً (مثلاً 3%).",o:["صح","خطأ"],a:0,e:"النص: 'وبالتالي هذا لا يعيب الراوي إذا كان روى لنا مائة حديث وأخطأ في ثلاثة... فلا نضعف 97 حديثًا'."},
    {q:"بناءً على المحاضرة، ما هو الأفضل والأولى عند توفر الماء في الظروف العادية (كالعزيمة مقابل الرخصة)؟",o:["المسح على الخفين دائماً تطبيقاً للسنة.","المسح على الجوربين الرقيقين.","الغسل الكامل للقدمين كما في الآية القرآنية والأغلب من حال النبي ﷺ.","التيمم."],a:2,e:"النص: 'والعلماء اتفقوا أن الغسل أولى من المسح على الخفين، لأنه الأغلب من حال النبي'."},
    {q:"إذا تفرد الراوي بمتن ولم يخالف أحداً، فهل يُسمى حديثه شاذاً بناءً على تعريف الشذوذ المختار؟",o:["نعم.","لا، الشذوذ يشترط فيه (المخالفة) لمن هو أرجح.","نعم إذا كان ثقة.","نعم إذا كان المتن طويلاً."],a:1,e:"النص: 'مخالفًا لمن هو أولى منه... وبالتالي لابد من المخالفة'."},
    {q:"الراوي (الصدوق) يُعد من قسم (المقبول)، فإذا خالف من هو أوثق منه سُمي حديثه شاذاً وليس منكراً.",o:["صح","خطأ"],a:0,e:"النص: 'ما يرويه الثقة أو المقبول مخالفًا... وأبو قيس الأودي درجته في الحديث صدوق... قالوا بأن روايته شاذة'."},
    {q:"تعريف الحافظ ابن حجر للشاذ هو: (ما يخالف فيه الراوي من هو أرجح منه بالعموم)، قاصداً الراوي الثقة أو المقبول.",o:["صح","خطأ"],a:0,e:"النص: 'الحافظ بن حجر رحمه الله : جعل أن الشاذ هو: ما يخالف فيه الراوي من هو أرجح منه -بالعموم-'."},
    {q:"المُرسل الخفي لا يُدرك بظاهر الأمور، بل يحتاج إلى:",o:["برنامج حاسوبي.","قراءة سريعة للسند.","تتبع أقوال العلماء المتبحرين في العلل ومعرفة أحوال الرجال والتواريخ.","علم القراءات."],a:2,e:"النص: 'وإنما يُدرك بالاطلاع الدقيق على أحوال الرواة، وبتتبع أقوال العلماء المُتبحّرون في العلل'."},
    // Adding 20 more robust questions directly extracted from nuances to hit exact 60
    {q:"المعاصرة بين الراوي وشيخه هي العلة التي تجعل (المنقطع) أمراً ظاهراً يمكن للمبتدئ اكتشافه.",o:["صح","خطأ"],a:1,e:"خطأ. المعاصرة هي التي تجعله (خفياً) وليس ظاهراً. النص: 'أما المرسل الخفي فصعب إداركه... لأن بينهما معاصرة'."},
    {q:"رواية أحد أتباع التابعين عن الصحابة تعتبر مثالاً للمنقطع الظاهر.",o:["صح","خطأ"],a:0,e:"النص: 'فالانقطاع الظاهر يكون عندما يروي مثلًا أحد من أتباع التابعين... عن أحد الصحابة'."},
    {q:"في المرسل الخفي، قد يشترك الراوي والمروي عنه في نفس العصر وحتى في نفس البلد.",o:["صح","خطأ"],a:0,e:"النص: 'وهما كانا في عصر أو زمن واحد، بل ربما كانا في بلد واحد'."},
    {q:"الحكم بالشذوذ على حديث ظاهره الصحة (لاستيفاء رواته شروط العدالة) يمثل تناقضاً منهجياً عند المحدثين.",o:["صح","خطأ"],a:1,e:"خطأ. ليس تناقضاً بل دقة. النص: 'لكن من الممكن أن يقول شخص أن هذا ظاهره الصحة! نقول: نعم... ولكن مخالفته بينت أن الراوي وهم فيه'."},
    {q:"من أسباب الترجيح بين الروايات للحكم بالشذوذ:",o:["جمال الخط في المخطوطة.","أن يكون الراوي المخالَف أكثر إتقاناً أو حفظاً أو أكثر عدداً.","أن يكون الراوي المخالِف أصغر سناً.","جميع ما سبق."],a:1,e:"النص: 'إما لأن راوي تلك الرواية أكثر إتقانًا وحفظًا... وإما خالف العدد'."},
    {q:"رواية أبو قيس الأودي لمسح الجوربين صُنفت كشذوذ في المتن، لا في السند.",o:["صح","خطأ"],a:0,e:"النص أوردها تحت عنوان: '^ شذوذ في المتن'."},
    {q:"هل أُثر عن النبي ﷺ أنه كان يمسح على الخفين دائماً وهو جالس مرتاح في المدينة؟",o:["نعم.","لا، وردت كرخصة وهي خلاف العزيمة.","نعم، كان يفضلها على الغسل.","لم يمسح عليهما قط."],a:1,e:"النص: 'فالنبي صلّى الله عليه و سلّم ما أثر عنه أنه وهو جالس مرتاح في المدينة مسح على الخفين... بل ورد عنه أنها رخصة'."},
    {q:"الحديث الذي يرويه الثقة ويخالف فيه من هو دونه في القبول يسمى (الشاذ).",o:["صح","خطأ"],a:1,e:"خطأ. يسمى (المحفوظ). النص: 'المحفوظ هو: ما يرويه الثقة المقبول وخالف فيه من هو دونه'."},
    {q:"المرسل الخفي يُعامل معاملة الحديث المنقطع من حيث درجة القبول.",o:["صح","خطأ"],a:0,e:"النص: 'المرسل الخفي في الأصل هو نوع من المنقطع... حكم الحديث المرسل الخفي... أكيد ضعيف؛ لأن هناك سقط'."},
    {q:"من أجاز المسح على الجوربين الرقيقين قديماً استند فقط على حديث المغيرة بن شعبة.",o:["صح","خطأ"],a:1,e:"خطأ. استندوا لآثار الصحابة. النص: 'فمن أجاز المسح على الجوربين لم يستدل بهذا الحديث فقط، ولكن له آثار من بعض الصحابة'."},
    {q:"حديث (وإنما تأكل الذئب من الغنم القاصية/الشاذة) استُشهد به في المحاضرة لتوضيح المعنى الاصطلاحي للحديث المنكر.",o:["صح","خطأ"],a:1,e:"خطأ. لتوضيح المعنى اللغوي للحديث الشاذ."},
    {q:"الراوي (هزيل بن شرحبيل) هو التابعي الثقة الذي روى عنه (أبو قيس الأودي) حديث الجوربين.",o:["صح","خطأ"],a:0,e:"النص: 'يرويها عبد الرحمن بن ثروان أبو قيس الأودي، يرويها عن شيخه هزيل بن شرحبيل'."},
    {q:"في حديث حماد بن زيد المرسل، من هو التابعي الثقة الذي اختلفوا في الرفع والإرسال عنه؟",o:["عوسجة.","عمرو بن دينار.","ابن عباس.","الزهري."],a:1,e:"النص: 'لاحظوا أن عمرو بن دينار شيخ الإسنادين، ولكن حماد بن زيد... جعله مرسلًا... بينما ابن عيينة وابن جريج رواياه متصلا'."},
    {q:"الزيادة في اللفظ (زيادة الثقة) لا يمكن أن تُدرج في الشذوذ أبداً تحت أي ظرف.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'أحيانًا تعتبر زيادة الثقة في اللفظ شاذة إذا كانت تقتضي مخالفة لِما لم يروِهِ'."},
    {q:"المرسل الخفي يتقوى إذا وجد له إسناد آخر متصل.",o:["صح","خطأ"],a:0,e:"النص: 'إلا إذا كان للحديث إسنادًا آخر متصل، فهنا يُحكم على الإسناد الآخر بأنه صحيح أو يتقوى الحديث المنقطع به'."},
    {q:"إذا كان المتن شاذّاً، فهل يمكن أن يكون له أسانيد أخرى صحيحة؟",o:["نعم.","لا، إذا شذ المتن بطل.","نعم إذا كان المروي عنه صحابياً.","فقط في العقائد."],a:1,e:"النص: 'أما إذا كان المتن هو الشاذ فأكيد لن يكون صحيحًا بطريقة من الطرق'."},
    {q:"الرواية (المنكرة) هي ما يرويه الثقة مخالفاً لمن هو أوثق منه.",o:["صح","خطأ"],a:1,e:"خطأ. المنكر يرويه (الضعيف). النص: 'أما إذا كان الراوي ضعيفا لا يسمى شاذًا... وإنما يسمى منكرًا'."},
    {q:"الاحتياط في مسائل العبادات المختلف في أحاديثها (كمسح الجوربين) يقتضي:",o:["الأخذ بالأسهل دائماً.","البقاء في حيز الرخصة الضرورية أو الخروج من الخلاف بالعمل بالأصل (الغسل).","ترك الصلاة.","تكفير المخالف."],a:1,e:"النص: 'فإذا اضطر أن يمسح على الجوربين... فليبقى هذا في حيز الرخصة الضرورية... فالأورع والاحتياط أن يمشي الإنسان على ما هو خارج محل الخلاف'."},
    {q:"(جامع التحصيل في أنواع المراسيل) هو كتاب للإمام الرازي.",o:["صح","خطأ"],a:1,e:"خطأ. هو للإمام العلائي."},
    {q:"خلاصة المحاضرة أن (الشاذ) هو خطأ الثقة الذي انكشف بمخالفته للأوثق، وهو مردود لا يتقوى.",o:["صح","خطأ"],a:0,e:"النص: 'خلاصة: الشاذ باختصار هو أخطاء الثقات، لا يتقوى، بان هذا الخطأ من خلال مخالفته لما هو أوثق منه'."}
];

let currentQ = 0;
let userAns = new Array(qd.length).fill(null);

const qText = document.getElementById('q-text');
const optionsList = document.getElementById('options-list');
const btnNext = document.getElementById('btn-next');
const btnPrev = document.getElementById('btn-prev');
const progText = document.getElementById('progress-text');
const fbBox = document.getElementById('feedback-box');
const fbText = document.getElementById('feedback-text');

function loadQ(idx) {
    const data = qd[idx];
    qText.textContent = `${idx + 1}. ${data.q}`;
    progText.textContent = `السؤال ${idx + 1} من ${qd.length}`;
    
    optionsList.innerHTML = '';
    fbBox.style.display = 'none';

    data.o.forEach((opt, i) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        const radio = document.createElement('input');
        radio.type = 'radio'; radio.name = 'opt'; radio.value = i;
        const span = document.createElement('span'); span.textContent = opt;

        li.appendChild(radio); li.appendChild(span);

        if(userAns[idx] !== null) {
            li.classList.add('disabled'); radio.disabled = true;
            if(i === data.a) li.classList.add('correct');
            else if(i === userAns[idx]) li.classList.add('wrong');
        }

        li.addEventListener('click', () => {
            if(userAns[idx] === null) {
                radio.checked = true; handleAns(idx, i);
            }
        });

        optionsList.appendChild(li);
    });

    if(userAns[idx] !== null) showFb(data.e);
    btnPrev.disabled = idx === 0;
    btnNext.textContent = idx === qd.length - 1 ? 'إنهاء التقييم الصارم' : 'التالي';
}

function handleAns(idx, sel) {
    userAns[idx] = sel;
    const data = qd[idx];
    const items = optionsList.querySelectorAll('.option-item');
    items.forEach((item, i) => {
        item.classList.add('disabled');
        item.querySelector('input').disabled = true;
        if (i === data.a) item.classList.add('correct');
        else if (i === sel && sel !== data.a) item.classList.add('wrong');
    });
    showFb(data.e);
}

function showFb(text) { fbText.textContent = text; fbBox.style.display = 'block'; }

btnNext.addEventListener('click', () => {
    if (currentQ < qd.length - 1) {
        currentQ++; loadQ(currentQ);
    } else {
        let score = userAns.filter((ans, i) => ans === qd[i].a).length;
        document.getElementById('quiz-body').innerHTML = `
            <div style="text-align:center; padding: 50px 20px;">
                <h2 style="color:var(--secondary); font-size: 2.3em; margin-bottom: 20px;">اكتمل الاختبار المتقدم (المحاضرة العاشرة)!</h2>
                <div style="background: #fff; border-radius: 12px; padding: 30px; font-size: 1.6em; border: 3px solid var(--correct-border); display: inline-block;">
                    حصيلتك المعرفية: <br> 
                    <strong style="color: var(--accent); font-size: 2.8em;">${score}</strong> من أصل 60
                </div>
                <p style="color: #455a64; margin-top: 25px; font-size: 1.25em; font-weight: bold;">أثبتّ إتقانك للتمييز بين المرسل الخفي والشاذ وتفكيك العلل العميقة!</p>
            </div>
        `;
        document.querySelector('.nav-buttons').style.display = 'none';
    }
});

btnPrev.addEventListener('click', () => { if (currentQ > 0) { currentQ--; loadQ(currentQ); } });

loadQ(0);
</script>
