<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار الاستنباطي المتقدم: المحاضرة الثالثة عشرة - المدرج، المقلوب، والمشهور</title>
    <style>
        :root { --primary: #154360; --secondary: #1a5276; --accent: #d35400; --correct-bg: #e8f8f5; --correct-border: #1abc9c; --wrong-bg: #fdedec; --wrong-border: #e74c3c; --text: #17202a; --bg: #f4f6f7; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .quiz-container { background: #fff; max-width: 950px; width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 40px; box-sizing: border-box; border-top: 6px solid var(--accent); }
        .header { text-align: center; border-bottom: 2px solid #ebedef; padding-bottom: 15px; margin-bottom: 30px; }
        .header h2 { color: var(--primary); margin: 0; font-size: 1.95em; }
        .progress { color: var(--accent); font-weight: bold; margin-top: 10px; font-size: 1.2em; }
        .question-text { font-size: 1.45em; font-weight: bold; color: var(--secondary); margin-bottom: 25px; line-height: 1.6; }
        .options-list { list-style: none; padding: 0; margin: 0; }
        .option-item { background: #fbfcfc; border: 2px solid #ebedef; border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; font-size: 1.15em; display: flex; align-items: center; }
        .option-item:hover:not(.disabled) { background: #fef5e7; border-color: #f39c12; }
        .option-item input { margin-left: 15px; transform: scale(1.4); cursor: pointer; }
        .option-item.disabled { cursor: not-allowed; opacity: 0.9; }
        .option-item.correct { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #0e6251; font-weight: bold; }
        .option-item.wrong { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: #78281f; text-decoration: line-through; }
        .feedback-box { display: none; background: #fdfefe; border-right: 5px solid var(--accent); padding: 15px 20px; margin-top: 25px; border-radius: 5px; font-size: 1.1em; line-height: 1.7; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .feedback-box span { font-weight: bold; color: var(--accent); display: block; margin-bottom: 8px; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #ebedef; padding-top: 20px; }
        .btn { background: var(--secondary); color: #fff; border: none; padding: 12px 35px; border-radius: 6px; font-size: 1.15em; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn:hover:not(:disabled) { background: var(--primary); }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>الاختبار الاستنباطي المتقدم: المحاضرة الثالثة عشرة</h2>
        <div class="progress" id="progress-text">السؤال 1 من 60</div>
    </div>
    <div id="quiz-body">
        <div class="question-text" id="q-text"></div>
        <ul class="options-list" id="options-list"></ul>
        <div class="feedback-box" id="feedback-box">
            <span>التأصيل المنهجي (مستنبط من النص):</span>
            <p id="feedback-text"></p>
        </div>
    </div>
    <div class="nav-buttons">
        <button class="btn" id="btn-prev" disabled>السابق</button>
        <button class="btn" id="btn-next">التالي</button>
    </div>
</div>

<script>
const qd = [
    // --- الحديث المدرج ---
    {q:"ما هو التعريف الاصطلاحي الدقيق للحديث (المدرج)؟",o:["ما خالف فيه الثقة من هو أوثق منه.","هو الحديث الذي وقعت فيه زيادة ليست منه بطريقة توهم أنها منه.","ما روي على أوجه مختلفة متساوية.","ما سقط من إسناده راويان."],a:1,e:"النص: 'هو الحديث الذي وقعت فيه زيادة ليست منه بطريقة توهم أنها منه'."},
    {q:"الإدراج لغةً هو الإدخال والإقحام، كإدخال ورقة ضمن أوراق لتصبح كأنها منها.",o:["صح","خطأ"],a:0,e:"النص: 'والإدراج هو الإدخال، فيقال: أدرجت ورقة ضمن الأوراق؛ أي أدخلت ورقة وجعلتها من أوراقهم'."},
    {q:"قسم العلماء الإدراج إلى قسمين رئيسيين هما:",o:["إدراج مقصود وإدراج غير مقصود.","إدراج في المتن وإدراج في الإسناد.","إدراج الصحابة وإدراج التابعين.","إدراج قوي وإدراج ضعيف."],a:1,e:"النص: 'قسم العلماء الإدراج... إما أن يقع في المتن؛ وإما أن يقع في الإسناد'."},
    {q:"في حديث (تعاهدوا القرآن... بئسما لأحدهم أن يقول: نسيت آية)، أين وقع الإدراج ومَن قائله؟",o:["في وسط المتن، وهو من كلام الزهري.","في آخر المتن، وهو من كلام ابن عمر.","في أول المتن، وهو من كلام عبد الله بن مسعود، حيث ظن السامع أن الموعظة كلها للنبي ﷺ.","في الإسناد، من كلام سفيان الثوري."],a:2,e:"النص: 'أن الجزء الأول المسطر عليه من الحديث ليس من كلام النبي ﷺ... في الحقيقة هو من كلام ابن مسعود... فهذا مثال لما وقع فيه الإدراج في أول المتن'."},
    {q:"جملة (والخِرِّيت الماهر بالهداية) في حديث الهجرة، هي إدراج من كلام أم المؤمنين عائشة لتشرح للسامعين معنى الكلمة الغريبة.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة نهاية). الجملة من كلام (الإمام الزهري). النص: 'يظن أن جملة (والخريت الماهر بالهداية) من كلام عائشة... والحقيقة أن هذا ليس من كلامها وإنما من كلام الإمام الزهري'."},
    {q:"ما هو الموضع (الأكثر وقوعاً) للإدراج في المتون كما نص العلماء؟",o:["في أول المتن.","في وسط المتن.","في آخر المتن.","بين السند والمتن."],a:2,e:"النص: 'والصورة الأخيرة التي هي الإدراج في آخر المتن هي الأكثر وقوعا كما قال العلماء'."},
    {q:"في حديث (اليد العليا خير من اليد السفلى)، الجملة المدرجة (فاليد العليا هي المنفقة...) هي من تفسير:",o:["أبي هريرة.","الإمام الزهري.","عبد الله بن عمر.","الإمام مالك."],a:2,e:"النص: 'والحقيقة أن جملة: (فاليد العليا هي المنفقة...) هي من كلام ابن عمر يشرح معنى الحديث'."},
    {q:"غالباً ما يكون الإدراج في المتن (متعمداً) من الرواة الثقات لاختبار حفظ الطلاب.",o:["صح","خطأ"],a:1,e:"خطأ. الإدراج غالباً (غير مقصود). النص: 'ملاحظة: صور الإدراج تكون غالبا غير مقصودة من الرواة وإنما بعض السامعين وهم في شيء ما'."},
    {q:"ما هو السبب الرئيسي الذي يدفع الصحابي أو التابعي لإقحام كلام في آخر الحديث (والذي يدرجه السامع خطأً)؟",o:["لتكثير الأسانيد.","للشرح والتفسير أو لبيان معنى خفي غامض في الحديث.","ليختبر الطلاب.","ليُظهر فصاحته."],a:1,e:"النص: 'فغالبا الإقحام هو للشرح والتفسير أو لبيان معنى خفي غامض، فيقع الخطأ في نسبته إلى قائله'."},
    {q:"من صور الإدراج في (السند): أن يروي جماعة الحديث بأسانيد (مختلفة)، فيجمعها راوٍ واحد على إسناد (واحد) دون تبيين الفروق.",o:["صح","خطأ"],a:0,e:"النص: 'أن يروي جماعة الحديث بأسانيد مختلفة... فيرويه عنهم واحد فيجمع الكل على إسناد واحد ولا يبين، فهذا سماه العلماء إدراجا'."},
    {q:"في مثال سفيان الثوري وعبد الرحمن بن مهدي، كان الإدراج في السند بسبب:",o:["أن سفيان أخطأ في اسم الصحابي.","أن عبد الرحمن بن مهدي لم يميز بين رواية منصور والأعمش (المتصلة) ورواية واصل (المنقطعة لنقص رجل)، فجمعهم في إسناد واحد.","أن الحديث مقلوب.","أن المتن طويل جداً."],a:1,e:"النص: 'سفيان الثوري رواه عن واصل لكن دون ذكر عمرو بن شرحبيل... فلما روى تلك الرواية عبد الرحمن بن مهدي لم يميز فأدرج الثلاثة'."},
    {q:"إذا كان الراوي يروي متناً واحداً مفصلاً على إسنادين مختلفين (قسم بسند، وقسم بآخر)، فجاء راوٍ ورواه كأنه قطعة واحدة بسند واحد، فهذا يسمى:",o:["مقلوباً في المتن.","إدراجاً في المتن.","إدراجاً في السند.","حديثاً مضطرباً."],a:2,e:"النص: 'فإذا كان الراوي يروي المتن بإسنادين وجاء أحد الرواة وجعل المتن قسمين... فروى المتن كأنه قطعة واحدة بسند واحد، فهذا يسمى إدراجا (في السند)'."},
    {q:"المُحدّثون يكتشفون الإدراج بالتحزر والتخمين الباطني بناءً على قوة نورانية يمتلكونها.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'الإدراج يعرف بطرق متعددة... فهم لا يتكهنون ولا يتحزرون... وإنما يبحثون ويتأملون بدقة ثم يكتشفون الإدراج بأسباب وقرائن'."},
    {q:"من أقوى طرق معرفة الإدراج:",o:["الاستخارة.","أن ترد رواية أخرى لنفس الحديث (خالية من الإدراج) تفصل بين كلام النبي ﷺ وكلام الراوي.","أن يوافق الحديث العقل.","أن يكون الراوي ضعيفاً."],a:1,e:"النص: 'الطريقة الأولى: أن ترد رواية أخرى خالية من الإدراج'."},
    {q:"في حديث (أسبغوا الوضوء ويل للأعقاب من النار)، كيف عرف المحدثون أن (أسبغوا الوضوء) ليس من كلام النبي ﷺ؟",o:["لاستحالة المعنى عقلاً.","لأن نصاً من إمام مطلع أشار لذلك.","لأن أبا هريرة نص في رواية أخرى مفصلة قائلاً: (أسبغوا الوضوء فإني سمعت أبا القاسم يقول: ويل للأعقاب).","لأن السند مقلوب."],a:2,e:"النص: 'فجاء تفصيل في أحاديث أخرى عن أبي هريرة أنه قال: أسبغوا الوضوء. فإني سمعت أبا القاسم... يقول: (ويل للأعقاب من النار)'."},
    {q:"حديث (لولا الجهاد... لأحببت أن أموت وأنا مملوك) اكتشف العلماء إدراجه بطريقة (استحالة أن يكون النبي ﷺ قاله)، وذلك لسببين هما:",o:["مخالفته للقرآن ومخالفته للسنة.","أن النبي ﷺ توفيت أمه وهو صغير (فلا يبرّها)، ولا يليق بمقام النبوة أن يتمنى العبودية.","أن راويه كذاب، وأن المتن ركيك.","أن الجهاد لم يُشرع بعد."],a:1,e:"النص: 'الأول: لأنه قال ببر أمه؛ وسيدنا محمد والدته توفيت وهو صغير... الثاني: لا يمكن أن يتمنى النبي أن يكون عبدا'."},
    {q:"حكم الإدراج: إذا تعمد الراوي إقحام كلامه في كلام النبي ﷺ، فهذا محرم ويعد من قبيل الوضع.",o:["صح","خطأ"],a:0,e:"النص: 'أما إذا كان الإدراج تعمدا... فهذا لا شك أنه لا يجوز ويدخل في الكذب والوضع في الحديث'."},
    {q:"إذا كان الإدراج بسبب الشرح والتفسير دون قصد الإيهام، فهذا جائز ولا حرج فيه.",o:["صح","خطأ"],a:0,e:"النص: 'إذا كان بقصد التفسير: يجوز'."},
    {q:"إذا اكتشفنا لفظة مدرجة من راوٍ ثقة، فإننا نحكم على (الحديث بأكمله) بالضعف والرد لأنه وقع فيه خطأ.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة مفصلية). النص: 'وإذا اعتبرناها هذه اللفظة المدرجة مرفوعة فيدخل في الحديث الضعيف، أما أصل الحديث فيبقى حديثا صحيحا'."},
    {q:"من العلماء الذين صنفوا كتباً مستقلة في الحديث (المدرج):",o:["البخاري ومسلم.","الخطيب البغدادي، والسيوطي، وابن حجر.","ابن الجوزي حصراً.","الترمذي."],a:1,e:"النص: 'من أمثال الإمام الخطيب البغدادي، والإمام السيوطي وابن حجر لهما كتابان في الحديث المدرج'."},

    // --- الحديث المقلوب ---
    {q:"الحديث (المقلوب) اصطلاحاً هو: الحديث الذي زاد فيه الراوي شيئاً ليست منه بطريقة توهم أنها منه.",o:["صح","خطأ"],a:1,e:"خطأ (هذا تعريف المدرج). المقلوب هو: 'الحديث الذي أبدل فيه راويه شيئًا بآخر'."},
    {q:"حديث (فإذا أمرتكم بشيء فأتوه، وإذا نهيتكم عن شيء فاجتنبوه ما استطعتم) الذي رواه الطبراني، هو مثال للمقلوب في:",o:["السند.","المتن، حيث عكس المعنى فربط الاستطاعة بالنهي بدلاً من الأمر.","المدرج.","الآحاد."],a:1,e:"النص: 'وجاءت في رواية عند الطبراني العكس... فهذا عكس المعنى، الاستطاعة مربوطة بالأمر وأما النهي فلا بد فيه من الاجتناب'."},
    {q:"حديث (حتى لا تعلم يمينه ما تنفق شماله) هو مقلوب في المتن، والصواب (حتى لا تعلم شماله ما تنفق يمينه).",o:["صح","خطأ"],a:0,e:"النص: 'حديث: (ورجل تصدق بصدقة... حتى لا تعلم شماله ما تنفق يمينه)، وبعض رواة قلبها فقال: (حتى لا تعلم يمينه ما تنفق شماله)'."},
    {q:"حديث الحاكم (لا وضوء لمن لم يذكر اسم الله) حيث أبدل الراوي (يعقوب بن سلمة الليثي) بـ (يعقوب بن أبي سلمة) لتشابه الاسمين، يعد مقلوباً في:",o:["المتن.","السند (قلب راوٍ بآخر).","الإدراج.","الآحاد."],a:1,e:"النص: 'فالراوي قلب يعقوب بن سلمة الليثي بيعقوب بن أبي سلمة، للتشابه بين الاسمين، فقلب راوي بآخر خطأ من الراوي... مثال المقلوب في السند'."},
    {q:"في قصة الإمام البخاري في بغداد، قام عشرة من الحفاظ باختباره بـ 100 حديث، فماذا فعلوا بها؟",o:["أدرجوا فيها متوناً.","قلبوها عمداً، فأخذوا متوناً وجعلوها لأسانيد أخرى.","وضعوها واختلقوها.","سرقوها من كتبه."],a:1,e:"النص: 'وهم اتفقوا بين بعضهم وبدلوا أسانيد المتون... أخذ متون من الأحاديث الأخرى وجعلها لأسانيد أحاديث أخرى'."},
    {q:"ما الذي أثار عجب الإمام السخاوي في قصة اختبار البخاري؟",o:["أن البخاري غضب منهم.","أن البخاري حفظ (الخطأ) من مرة واحدة وردّ الصواب لكل خطأ بترتيبه الدقيق.","أن البخاري كان شاباً.","أنهم صدقوه."],a:1,e:"النص: 'يقول الإمام السخاوي... ليس العجب من حفظ الإمام البخاري للصواب، وإنما العجب كيف حفظ الخطأ مباشرة عند الاختبار ثم أعاد لهم أخطاءهم'."},
    {q:"القلب بقصد (الإغراب) هو أن يأخذ الراوي متناً مشهوراً ويركب له إسناداً غريباً ليلفت انتباه الناس، ويسمى هذا الفعل بـ:",o:["التدليس.","الإدراج.","سرقة الحديث (وهو حرام ومكذوب).","الاختبار."],a:2,e:"النص: 'هناك من يقلب أحيانا بقصد الإغراب وهو يسمى بسرقة الحديث... وهذا حرام لا يجوز'."},
    {q:"ما هو الفرق الجوهري والمنهجي بين (التدليس) و(سرقة الحديث / القلب للإغراب)؟",o:["لا فرق بينهما.","السرقة فيها إخفاء فقط، والتدليس فيه كذب ووضع.","التدليس ليس فيه كذب (مجرد إخفاء للواسطة)، بينما السرقة فيها تركيب إسناد لمتن قصداً وهذا كذب وادعاء.","التدليس في المتن، والسرقة في السند."],a:2,e:"النص: 'أن في التدليس الراوي لا يكذب، فهو يخفي فقط... أما السرقة فالمقصود أن هذا الإسناد ليس لهذا المتن؛ فأنا ركبت إسنادا للمتن قصدا، وهذا نوع من الكذب'."},
    {q:"القلب بقصد (الاختبار) لامتحان حفظ العالم جائز بشرط أن:",o:["يكون العالم شاباً.","يُبين الصواب في نفس المجلس ولا يُترك الطلاب يحفظون الخطأ.","يُكتب في الكتب.","يكون في بغداد."],a:1,e:"النص: 'طبعا إذا كان القلب بقصد الاختبار فهذا يجوز، لكن ينبغي أن يُبين... فلا بد أن نبين الصواب في نفس المجلس'."},
    {q:"إذا كان سبب القلب في الحديث هو الغفلة والسهو من الراوي الثقة مرة أو مرتين، فإنه يُعذر ولا تسقط عدالته، ولكن تلك الرواية المقلوبة تُعتبر ضعيفة.",o:["صح","خطأ"],a:0,e:"النص: 'ما وقع فيه القلب سهوًا فهو ضعيف... أما إن أخطأ مرة أو اثنتين وهو ثقة لا بأس'."},

    // --- الحديث المشهور ---
    {q:"التعريف الاصطلاحي للحديث (المشهور) هو: ما له طرق محصورة بأكثر من (اثنين) وبلغ حد (التواتر).",o:["صح","خطأ"],a:1,e:"خطأ (خدعة نهاية). النص: 'ما له طرق محصورة بأكثر من اثنين ولم يبلغ التواتر'."},
    {q:"إذا روي الحديث من (أربعة) أسانيد ولم تتحقق فيه شروط القطع بالصدق، فإنه يُصنف ضمن الحديث:",o:["العزيز.","الغريب.","المشهور (أو المستفيض).","المتواتر."],a:2,e:"النص: 'أما إذا كان له ثلاثة أسانيد، أو أربعة... لم يصل إلى رتبة التواتر... فهذا يسمى حديثا مشهورا بالمعنى الاصطلاحي... وقد يسمى حديثا مستفيضا'."},
    {q:"الحديث المشهور (لغةً) هو المشتهر على ألسنة الناس، وقد يكون هذا الحديث صحيحاً أو ضعيفاً أو حتى موضوعاً كذباً.",o:["صح","خطأ"],a:0,e:"النص: 'وهذا المشهور بالمعنى اللغوي قد يكون صحيحا... وقد يكون ضعيفا... وقد يكون حديثا كذبا موضوعا'."},
    {q:"حديث (إنما الأعمال بالنيات) هو حديث مشهور:",o:["بالمعنى الاصطلاحي فقط (له 3 أسانيد).","بالمعنى اللغوي فقط (مشتهر بين الناس ولكن له إسناد واحد فقط).","ليس مشهوراً أبداً.","متواتر."],a:1,e:"النص: 'وحديث: (إنما الأعمال بالنيات)، مشهور على ألسنة الناس؛ وهو صحيح، لكن ليس له إلا إسناد واحد، فهذا ليس مشهورا بالمعنى الاصطلاحي'."},
    {q:"حديث (اطلبوا العلم ولو بالصين) وحديث (الحسود لا يسود)، هما من الأحاديث:",o:["المشهورة اصطلاحاً والصحيحة.","المشهورة لغةً، ولكن الأول ضعيف والثاني موضوع.","المتواترة.","العزيزة."],a:1,e:"النص: 'وقد يكون ضعيفا، مثل حديث: (اطلبوا العلم ولو بالصين)... وقد يكون حديثا كذبا موضوعا... مثل: (الحسود لا يسود)'."},
    {q:"تعدد الأسانيد في الحديث (المشهور اصطلاحاً) يجعله بالضرورة حديثاً صحيحاً دائماً.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'الحديث المشهور ليس صحيحا بالضرورة... إذا كان كل إسناد فيه راوي مثلا شديد الضعف أو كذاب، فهذا ضعيف لا يتقوى'."},
    {q:"الفرق الجوهري بين المتواتر والمشهور هو أن المتواتر يفيد العلم (القطعي اليقيني) لاستحالة تواطؤ رواته على الكذب، بينما المشهور يبقى في حيز (الظني).",o:["صح","خطأ"],a:0,e:"النص: 'والحديث المتواتر انتقلت رتبة ثبوته إلى رتبة العلم اليقيني القطعي... أما الحديث المشهور فهو... ما يزال في رتبة الحديث الظني'."},

    // --- الحديث العزيز ---
    {q:"الحديث (العزيز) هو الحديث الذي:",o:["تفرد به راوٍ واحد.","له أسانيد كثيرة جداً.","لا يقل رواته في كل طبقة من طبقات سنده عن (اثنين).","رواه الخلفاء الراشدون."],a:2,e:"النص: 'الحديث العزيز... هو: الذي لا يقل رواته في كل طبقة من طبقاته عن اثنين'."},
    {q:"إذا روى الحديث (ثلاثة) من الصحابة، ثم (ثلاثة) من التابعين، وفي طبقة أتباع التابعين رواه (اثنان) فقط، ثم عاد فرواه (أربعة)، فما اسم هذا الحديث؟",o:["مشهور.","عزيز، لأن العبرة بأقل طبقة وهي (اثنان).","غريب.","متواتر."],a:1,e:"النص: 'يعني التقى في طبقة بروايين فقط، وبقية الطبقات لم يقل عن اثنين، ربما رواه ثلاثة أو أربعة... المهم أن إحدى طبقاته كان فيها راويين اثنين'."},
    {q:"سمي الحديث (عزيزاً) لسببين محتملين هما:",o:["لأن رواته أعزة، ولأنه يورث العزة.","إما من القلة (نادر الوجود)، أو من القوة (لأن رواية الاثنين أقوى من الواحد).","لأنه روي في مدينة عزيزة.","لأنه مختص بالعقيدة."],a:1,e:"النص: 'وهذا الحديث سمى عزيزا؛ إما من القلة، فالعزيز هو القليل النادر، وإما من القوة لأن العزيز الذي رواه اثنان أقوى من الذي راوه واحد'."},
    {q:"حديث (لا يؤمن أحدكم حتى أكون أحب إليه من والده...) يُعد مثالاً للحديث العزيز لأن في بعض طبقاته (كمرحلة التابعين أو أتباعهم) لم يروه إلا اثنان.",o:["صح","خطأ"],a:0,e:"النص: 'فلاحظوا أنه ليس هناك أي طبقة من الطبقات مروي فيها عن أقل من اثنين... صورة الحديث العزيز هذه قليلة الوجود'."},
    {q:"الحديث العزيز صحيح دائماً لأنه رواه اثنان في أقل طبقاته فاعتضدا بقوتهما.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'حكم الحديث العزيز مثل حكم المشهور، قد يكون صحيحا، وقد يكون حسنا، وقد يكون ضعيفا أو شديد الضعف'."},

    // --- الحديث الفرد/الغريب والآحاد ---
    {q:"على المشهور عند المتأخرين كابن حجر، الحديث (الفرد) والحديث (الغريب) هما مصطلحان مترادفان لشيء واحد.",o:["صح","خطأ"],a:0,e:"النص: 'فالغريب والفرد شيء واحد كما قال الإمام ابن حجر رحمه الله، إلا في بعض الصور الثانوية'."},
    {q:"الحديث الفرد هو:",o:["ما تفرد بروايته راوٍ بوجه من وجوه التفرد (سواء أصل السند أو أثناءه).","ما رواه اثنان.","ما وافق القرآن.","ما خالف الأصول."],a:0,e:"النص: 'هو الحديث الذي تفرد بروايته راوٍ بوجه من وجوه التفرد'."},
    {q:"حديث (نهى النبي عن بيع الولاء وعن هبته)، لم يروه في الدنيا عن ابن عمر إلا (عبد الله بن دينار)، فهذا يسمى تفرد:",o:["نسبي.","مطلق.","مشهور.","مدرج."],a:1,e:"النص: 'فهذا المتن لم يروه في الدنيا إلا عبد الله بن دينار... نقول إن تفرد ابن دينار... تفرد مطلق'."},
    {q:"التفرد (النسبي) هو تفرد مطلق من أول السند لآخره.",o:["صح","خطأ"],a:1,e:"خطأ. التفرد النسبي يقع (بالنسبة لشيء معين) كراوٍ أو جهة. النص: 'التفرد النسبي هو الذي يقع بالنسبة؛ أي فرد بالنسبة لكذا، فإما بالنسبة لصحابي أو لجهة'."},
    {q:"في حديث (أنا نازل)، جابر بن عبد الله له أسانيد أخرى يروي بها الحديث، ولكن لم يروه (عن جابر) إلا عبد الواحد بن أيمن، فهذا تفرد:",o:["مطلق.","نسبي (تفرد شخص عن شخص).","تفرد أهل بلد عن شخص.","تفرد أهل بلد عن بلد."],a:1,e:"النص: 'ولكن عن جابر رضي الله عنه ما رواه أحد في الدنيا غير عبد الواحد بن أيمن... فهذا تفرد نسبي... بالنسبة لجابر'."},
    {q:"حديث (القضاة ثلاثة...) تفرد بروايته عن بريدة بن الحصيب أهل خراسان، وهذا يعد من التفرد النسبي (تفرد أهل بلد عن شخص).",o:["صح","خطأ"],a:0,e:"النص: 'فعبد الله بن بريدة من خراسان وسنده عن والده، فتفرد بهذا الحديث الخراسانيون... لأن بريدة نزل في خراسان'."},
    {q:"متى يكون تفرّد الراوي بالحديث الغريب/الفرد سبباً للحكم بضعفه الشديد وردّه غالباً؟",o:["إذا كان في كتاب البخاري.","إذا تفرد به راوٍ ضعيف، أو تفرد به إمام متأخر (مثل البزار والطبراني)، فالتفرد في العصور المتأخرة مظنة الضعف.","إذا كان الحديث طويلاً.","إذا كان الراوي من الشام."],a:1,e:"النص: 'أو تفرد به إمام متأخر، من أمثلة الإمام البزار، أو الطبراني... فهنا يغلب على الحديث أن يكون تفرده يدل على ضعفه'."},
    {q:"الحديث (الآحاد) في التقسيم الحديثي والأصولي هو حصراً: الحديث الذي رواه شخص واحد فقط (وهو الفرد).",o:["صح","خطأ"],a:1,e:"خطأ (خدعة مفاهيمية). الآحاد قسمة ثنائية يقابل المتواتر، ويشمل الفرد والعزيز والمشهور. النص: 'ليس نوعا حديثيا وإنما هي قسمة ثنائية، إما متواتر قطعي وإما ظني، فكل الظني يسمى آحادا، وليس الآحاد رواية فرد'."},
    {q:"دعوى عدم إضافة أحاديث (الآحاد) إلى السنة بدعوى أنها ظنية، اعتبرها المحاضر:",o:["منهجاً علمياً دقيقاً.","كلام جهل، وأن القول بعدم الأخذ بالصحيح الذي لم يبلغ التواتر هو كلام إما يكرره الجهلة أو من يريد تبديل الدين.","رأياً فقهياً معتبراً.","قول الإمام البخاري."],a:1,e:"النص: 'وبالتالي مسألة الكلام عن الآحاد وعدم إضافة الآحاد إلى السنة... ما هو إلا كلام جهل... فهذا في الحقيقة كلام إما يكرره الجهلة، وإما يتكلم به بعض من يريد أن يغير'."},
    {q:"حديث ترويه عائشة وابن عباس وأبو هريرة بأسانيد صحيحة، ولم يبلغ التواتر عقلياً، يعتبر حديثاً (آحاداً) ولكنه عند علماء الحديث والفقه (صحيح كالشمس).",o:["صح","خطأ"],a:0,e:"النص: 'لكن بقي في حيّز الآحاد لأنه لم يبلغ التواتر... لكن بالنقل الحديثي... يروا أن هذا الحديث صحيح كالشمس'."},

    // --- أسئلة تعميق واستيعاب (للوصول لـ 60 بتركيز) ---
    {q:"إذا سمع أحدهم المحدث يقول كلاماً ثم يقول (قال رسول الله كذا)، فشرد ذهنه فظن كل الكلام للنبي، فهذا يولد حديثاً:",o:["مقلوباً.","مدرجاً في أول المتن.","عزيزاً.","متواتراً."],a:1,e:"النص: 'فأحد الجالسين يشرد ذهنه فيظن أن الكلام من أوله قاله رسول الله... فهذا سبق وهم من السامع فينسبه كله'."},
    {q:"الزهري التفت لطلابه وقال (والخريت الماهر بالهداية)، هذا الإدراج يُصنف ضمن الإدراج بقصد:",o:["السرقة.","الاختبار.","الشرح والتفسير لبيان معنى خفي في الحديث.","التعمية."],a:2,e:"النص: 'فلما وصل إلى قول عائشة... التفت إليهم ليشرح لهم معنى الخرتيت'."},
    {q:"إذا كان الراوي يكثر جداً من الإدراج في الأحاديث لدرجة الاختلاط، فهذا يدل على قوة حفظه.",o:["صح","خطأ"],a:1,e:"خطأ. يدل على قلة ضبطه وضعفه. النص: 'ولكن إذا كثر الخطأ من الراوي وكان يدرج كثيرا فهذا يدل على قلة الضبط'."},
    {q:"في مثال سفيان الثوري عن (منصور والأعمش) وعن (واصل)، أدرج عبد الرحمن بن مهدي رواية واصل (المنقطعة) مع روايتهما (المتصلة). هذا الإدراج في:",o:["المتن.","السند (الصورة الأولى: جمع أسانيد مختلفة بإسناد واحد).","المتن والسند معاً.","المقلوب."],a:1,e:"النص: 'فأدرجت رواية واصل في رواية منصور والأعمش وهي رواية مختلفة، هذه الصورة الأولى (للإدراج في السند)'."},
    {q:"في مثال أبو داود، جمع بين سند (عاصم بن كليب) وسند (زائدة وشريك) في متن واحد رغم اختلاف المتون والأسانيد، وهذا يسمى:",o:["مقلوب.","إدراج في السند (الصورة الثانية: إدراج متن في متن بإسناد آخر).","مشهور.","فرد مطلق."],a:1,e:"النص: 'فأدرج متنا في متن؛ ولم نعتبره من الإدراج في المتن لأنه هو جمع إسنادين بسند واحد... هذه تسمى رواية مدرجة'."},
    {q:"الطريقة الرابعة لاكتشاف الإدراج هي (استحالة أن يكون النبي قاله)، كحديث (لولا الجهاد... لأحببت أن أموت وأنا مملوك). من الصحابي قائل هذا الكلام المفتخر بالجهاد وبر الأم؟",o:["أبو بكر الصديق.","عمر بن الخطاب.","أبو هريرة.","ابن مسعود."],a:2,e:"النص: 'حديث جاء عن أبي هريرة مرفوعا... ووجدوا أن تلك الزيادة هو كلام أبي هريرة'."},
    {q:"في المقلوب متناً، حديث (إن بلالاً يؤذن بليل فكلوا واشربوا حتى يؤذن ابن أم مكتوم)، قلبه بعض الرواة خطأً فصار:",o:["فلا تأكلوا.","حتى يؤذن الفجر.","إن ابن أم مكتوم يؤذن بليل... حتى يؤذن بلال.","إن بلالاً لا يؤذن."],a:2,e:"النص: 'وبعض الرواة قلبه الحديث فجعله: (إن ابن أم مكتوم يؤذن بليل، فكلوا واشربوا حتى يؤذن بلال)'."},
    {q:"عندما نقول (سرقة الحديث)، فإننا نقصد أن الراوي أخذ متناً معروفاً وركب له إسناداً آخر بقصد الإغراب ولفت الانتباه.",o:["صح","خطأ"],a:0,e:"النص: 'فيختار حديثا آخر ويأخذ السند منه فيروي هذا المتن بذاك السند... وهذا يسمى سرقة الحديث'."},
    {q:"كل تدليس هو سرقة للحديث، وكل سرقة هي تدليس، لا فرق بينهما عند المحدثين.",o:["صح","خطأ"],a:1,e:"خطأ. التدليس ليس فيه كذب بل إخفاء الواسطة، السرقة فيها كذب بتركيب سند لمتن. النص: 'الفرق بين سرقة الحديث والتدليس... إذن التدليس يختلف فليس فيه كذب... أما القلب المقصود فهذا فيه كذب'."},
    {q:"اختبار العلماء بحفظهم عبر أحاديث مقلوبة (كما حدث للبخاري) أمر محرم تماماً ويُسقط العدالة.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة مطلقاً). يجوز إذا بيّن الصواب في نفس المجلس. النص: 'طبعا إذا كان القلب بقصد الاختبار فهذا يجوز، لكن ينبغي أن يبين'."},
    {q:"رواية الإمام البخاري لرد الأحاديث المقلوبة إلى أصولها أثبتت أنه يستحق لقب:",o:["أمير المؤمنين في السياسة.","طبيب الحديث في علله، وأستاذ الأستاذين (كما وصفه الإمام مسلم).","الغريب.","شيخ الإسلام."],a:1,e:"النص: 'كما قال الإمام مسلم: (هو أستاذ الأستاذين، وطبيب الحديث في علله)'."},
    {q:"الحديث المشهور لغةً (كالمتداول بين العوام) لا يُشترط فيه أن يكون له أسانيد متعددة، بل قد يكون حديثاً لا أصل له.",o:["صح","خطأ"],a:0,e:"النص: 'أما المشهور بالمعنى الدارج... قد يكون صحيحا... وقد يكون ضعيفا... وقد يكون حديثا كذبا موضوعا لا أصل له'."},
    {q:"الحديث المستفيض هو مرادف للحديث العزيز تماماً.",o:["صح","خطأ"],a:1,e:"خطأ. هو مرادف للحديث (المشهور). النص: 'وقد يسمى حديثا مستفيضا أيضا عند بعض العلماء، وهذا من الترادف بين المصطلحات'."},
    {q:"في الحديث العزيز (لا يقل عن اثنين في كل طبقة)، إذا كانت طبقة الصحابة فيها (أنس وأبو هريرة)، وطبقة التابعين فيها (قتادة وعبد العزيز)، فهذا يحقق شرط العزة.",o:["صح","خطأ"],a:0,e:"النص: 'في طبقة الصحابة اثنان، وفي طبقة التابعين اثنان... فلاحظوا أنه ليس هناك أي طبقة من الطبقات مروي فيها عن أقل من اثنين'."},
    {q:"التفرد في الحديث قد يقع من (بلد عن شخص) أو (بلد عن بلد) وتعتبر هذه من اللطائف الفنية للأسانيد.",o:["صح","خطأ"],a:0,e:"النص: 'وهذه الصور، فيما عدا الصورة الأولى، نعتبرها من اللطائف الفنية التي لا تلعب دورا كبيرا في الحكم'."},
    {q:"الحديث الفرد المطلق: هو ما تفرد به الراوي (في جزء من سنده) وشاركه غيره في أصله.",o:["صح","خطأ"],a:1,e:"خطأ. هذا الفرد النسبي. الفرد المطلق هو أن يتفرد به عن (كل الرواة). النص: 'الفرد المطلق هو الذي تفرد به الراوي عن كل الرواة'."},
    {q:"حديث جابر في غزوة الخندق (فعرضت كدية شديدة...) رواه عنه عبد الواحد بن أيمن فقط، هذا مثال على التفرد:",o:["المطلق.","النسبي (تفرد شخص عن شخص).","تفرد بلد عن بلد.","المتواتر."],a:1,e:"النص: 'ولكن عن جابر رضي الله عنه ما رواه أحد في الدنيا غير عبد الواحد بن أيمن... فهذا تفرد نسبي... بالنسبة لجابر'."},
    {q:"قول الإمام مسلم عن البخاري (أستاذ الأستاذين) قاله بعد أن:",o:["ألف صحيح البخاري.","اجتاز اختبار بغداد ورد الأحاديث المقلوبة إلى أصولها المعكوسة.","رحل للصين.","كتب في التفسير."],a:1,e:"النص: 'كيف حفظ الخطأ مباشرة عند الاختبار ثم أعاد لهم أخطاءهم... وعند ذلك سلموا بإمامته... كما قال الإمام مسلم: (هو أستاذ الأستاذين)'."},
    {q:"إذا كان الراوي يتعمد قلب الحديث بغرض التعليم والاختبار للطلاب ويصحح لهم بعده، فهذا يسمى:",o:["إدراجاً.","قلب عمد للاختبار.","تدليساً خفياً.","وضعا للحديث."],a:1,e:"النص: 'طبعا إذا كان القلب بقصد الاختبار فهذا يجوز، لكن ينبغي أن يبين... فلا بد أن نبين الصواب في نفس المجلس'."},
    {q:"الأحاديث الآحاد تشمل الأنواع الثلاثة (المشهور، العزيز، والغريب)، وهي تقع في حيز (الظني) عند الأصوليين.",o:["صح","خطأ"],a:0,e:"النص: 'إما متواتر قطعي وإما ظني، فكل الظني يسمى آحادا... مسألة الكلام عن الآحاد وعدم إضافة الآحاد إلى السنة... ما هو إلا كلام جهل'."}
];

let currentQ = 0;
let userAns = new Array(qd.length).fill(null);

const qText = document.getElementById('q-text');
const optionsList = document.getElementById('options-list');
const btnNext = document.getElementById('btn-next');
const btnPrev = document.getElementById('btn-prev');
const progText = document.getElementById('progress-text');
const fbBox = document.getElementById('feedback-box');
const fbText = document.getElementById('feedback-text');

function loadQ(idx) {
    const data = qd[idx];
    qText.textContent = `${idx + 1}. ${data.q}`;
    progText.textContent = `السؤال ${idx + 1} من ${qd.length}`;
    
    optionsList.innerHTML = '';
    fbBox.style.display = 'none';

    data.o.forEach((opt, i) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        const radio = document.createElement('input');
        radio.type = 'radio'; radio.name = 'opt'; radio.value = i;
        const span = document.createElement('span'); span.textContent = opt;

        li.appendChild(radio); li.appendChild(span);

        if(userAns[idx] !== null) {
            li.classList.add('disabled'); radio.disabled = true;
            if(i === data.a) li.classList.add('correct');
            else if(i === userAns[idx]) li.classList.add('wrong');
        }

        li.addEventListener('click', () => {
            if(userAns[idx] === null) {
                radio.checked = true; handleAns(idx, i);
            }
        });

        optionsList.appendChild(li);
    });

    if(userAns[idx] !== null) showFb(data.e);
    btnPrev.disabled = idx === 0;
    btnNext.textContent = idx === qd.length - 1 ? 'إنهاء التقييم الصارم' : 'التالي';
}

function handleAns(idx, sel) {
    userAns[idx] = sel;
    const data = qd[idx];
    const items = optionsList.querySelectorAll('.option-item');
    items.forEach((item, i) => {
        item.classList.add('disabled');
        item.querySelector('input').disabled = true;
        if (i === data.a) item.classList.add('correct');
        else if (i === sel && sel !== data.a) item.classList.add('wrong');
    });
    showFb(data.e);
}

function showFb(text) { fbText.textContent = text; fbBox.style.display = 'block'; }

btnNext.addEventListener('click', () => {
    if (currentQ < qd.length - 1) {
        currentQ++; loadQ(currentQ);
    } else {
        let score = userAns.filter((ans, i) => ans === qd[i].a).length;
        document.getElementById('quiz-body').innerHTML = `
            <div style="text-align:center; padding: 50px 20px;">
                <h2 style="color:var(--secondary); font-size: 2.3em; margin-bottom: 20px;">اكتمل الاختبار المتقدم (المحاضرة الثالثة عشرة)!</h2>
                <div style="background: #fff; border-radius: 12px; padding: 30px; font-size: 1.6em; border: 3px solid var(--correct-border); display: inline-block;">
                    حصيلتك المعرفية: <br> 
                    <strong style="color: var(--accent); font-size: 2.8em;">${score}</strong> من أصل 60
                </div>
                <p style="color: #455a64; margin-top: 25px; font-size: 1.25em; font-weight: bold;">أثبتّ إتقانك لتفكيك الأسانيد المقلوبة، وكشف الإدراج، وتمييز مقامات الآحاد والمشهور!</p>
            </div>
        `;
        document.querySelector('.nav-buttons').style.display = 'none';
    }
});

btnPrev.addEventListener('click', () => { if (currentQ > 0) { currentQ--; loadQ(currentQ); } });

loadQ(0);
</script>
</body>
</html>
