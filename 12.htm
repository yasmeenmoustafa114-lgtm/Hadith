<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار الاستنباطي المتقدم: المحاضرة الثانية عشرة - الحديث الموضوع</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #34495e; --accent: #8e44ad; --correct-bg: #eaeded; --correct-border: #27ae60; --wrong-bg: #f2d7d5; --wrong-border: #c0392b; --text: #17202a; --bg: #f8f9f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .quiz-container { background: #fff; max-width: 950px; width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 40px; box-sizing: border-box; border-top: 6px solid var(--accent); }
        .header { text-align: center; border-bottom: 2px solid #ebedef; padding-bottom: 15px; margin-bottom: 30px; }
        .header h2 { color: var(--primary); margin: 0; font-size: 1.95em; }
        .progress { color: var(--accent); font-weight: bold; margin-top: 10px; font-size: 1.2em; }
        .question-text { font-size: 1.45em; font-weight: bold; color: var(--primary); margin-bottom: 25px; line-height: 1.6; }
        .options-list { list-style: none; padding: 0; margin: 0; }
        .option-item { background: #fbfcfc; border: 2px solid #ebedef; border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; font-size: 1.15em; display: flex; align-items: center; }
        .option-item:hover:not(.disabled) { background: #f5eef8; border-color: #af7ac5; }
        .option-item input { margin-left: 15px; transform: scale(1.4); cursor: pointer; }
        .option-item.disabled { cursor: not-allowed; opacity: 0.9; }
        .option-item.correct { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #145a32; font-weight: bold; }
        .option-item.wrong { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: #78281f; text-decoration: line-through; }
        .feedback-box { display: none; background: #fdfefe; border-right: 5px solid var(--accent); padding: 15px 20px; margin-top: 25px; border-radius: 5px; font-size: 1.1em; line-height: 1.7; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .feedback-box span { font-weight: bold; color: var(--accent); display: block; margin-bottom: 8px; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #ebedef; padding-top: 20px; }
        .btn { background: var(--secondary); color: #fff; border: none; padding: 12px 35px; border-radius: 6px; font-size: 1.15em; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn:hover:not(:disabled) { background: var(--primary); }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>الاختبار الاستنباطي المتقدم: المحاضرة الثانية عشرة</h2>
        <div class="progress" id="progress-text">السؤال 1 من 60</div>
    </div>
    <div id="quiz-body">
        <div class="question-text" id="q-text"></div>
        <ul class="options-list" id="options-list"></ul>
        <div class="feedback-box" id="feedback-box">
            <span>التأصيل المنهجي (مستنبط من النص):</span>
            <p id="feedback-text"></p>
        </div>
    </div>
    <div class="nav-buttons">
        <button class="btn" id="btn-prev" disabled>السابق</button>
        <button class="btn" id="btn-next">التالي</button>
    </div>

<script>
const qd = [
    // --- المقدمة والعلة ---
    {q:"تأسيساً على المحاضرة السابقة، إذا أعلّ إمام ناقد إسناداً معيناً لحديث ما، فهذا يقتضي بالضرورة القطع بأن المتن كله معلول ومردود جملةً وتفصيلاً.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة النهايات). النص: 'فليس إعلال الحديث بالضرورة هو إعلال للمتن وللحديث جملةً، ولكن ربما يكون إعلالًا لطريقٍ معين' [1]."},
    {q:"من الكتب التي أشار إليها المحاضر وتتضمن أمثلة تطبيقية للمُعلّ (في السند أو المتن):",o:["كتاب الإيضاح في علوم الحديث، وعلل الدارقطني، وعلل ابن أبي حاتم.","صحيح البخاري فقط.","مجمع الزوائد.","كتاب اللآلئ المصنوعة."],a:0,e:"النص أشار صراحة إلى (الإيضاح) كمرجع للسلسلة، وكتب (علل الدارقطني وابن أبي حاتم والترمذي) [2, 3]."},
    
    // --- تعريف الموضوع وتسميته ---
    {q:"ما هو التعريف الدقيق للحديث (الموضوع)؟",o:["ما خالف فيه الثقة من هو أوثق منه.","هو الحديث المختلق المصنوع الملصق بالنبي ﷺ كذباً وزوراً.","ما سقط من إسناده راويان.","هو الحديث الذي يرويه راوٍ ضعيف الحفظ."],a:1,e:"النص: 'هو الحديث المُختلَق المصنوع الملصق بالنبي صلى الله عليه وسلم كذبًا وزورًا' [4]."},
    {q:"أحياناً يصف المحدثون الحديث بأنه (موضوع) حتى وإن لم يتعمد الراوي الكذب، وذلك إذا:",o:["كان الراوي مجنوناً.","وقع خطأ في نسبته للنبي ﷺ وكان هذا الخطأ مجزوماً به.","كان المتن يخالف القياس.","كان الإسناد مرسلاً."],a:1,e:"النص: 'يقصدون بذلك أن الحديث ليس من كلام النبي ﷺ، وإنما وقع خطأ في نسبته إليه، وهذا الخطأ مجزوم به، فربما وصفوا الحديث بالموضوع' [4]."},
    {q:"لماذا استمر العلماء في إطلاق مصطلح (حديث) على الكلام الموضوع رغم أنه كذب محض لا أصل له؟",o:["احتراماً للراوي الكذاب.","لأن الحكم بوضعه قد يكون ظنياً (لاحتمال صدق الكذوب)، أو نظراً لصورته الظاهرة وزعم واضعه أنه حديث.","لأن كل موضوع له أصل في القرآن.","لأنهم تهاونوا في المصطلحات."],a:1,e:"النص ذكر سببين: 1. الحكم ظني (فالكذوب ربما يصدق). 2. من حيث صورته الظاهرة وزعم واضعه [5, 6]."},
    
    // --- مصادر ألفاظ الحديث الموضوع ---
    {q:"هل كل الأحاديث الموضوعة هي من اختراع الكذاب، وتحمل معاني خبيثة ومرذولة؟",o:["نعم مطلقاً.","لا، قد تكون منقولة عن حكماء أو أهل كتاب ومعناها جميل، ولكن الخلل في نسبتها كذباً للنبي ﷺ.","نعم، لكي تهدم الإسلام.","لا، بل كلها آيات قرآنية محرفة."],a:1,e:"النص: 'الألفاظ ليست دائما كذب واختراع؛ فقد تكون ألفاظ منقولة ولكن نسبتها إلى النبي ﷺ هو الذي ليس مقبولا' [7]."},
    {q:"قصة الرجل الذي بارت تجارته فاخترع حديث (الباذنجان لما أكل له)، هي مثال على الحديث الموضوع الذي أُخذت ألفاظه من:",o:["كلام الحكماء.","الإسرائيليات.","ألفاظ الراوي نفسه واختلاقه الشخصي.","القصاصين."],a:2,e:"النص: 'قد يكون المصدر من ألفاظ الراوي نفسه الذي اختلق الحديث: مثال: رجل يبيع الخضر... فصار يحدث أن النبي قال الباذنجان لما أكل له' [8]."},
    {q:"عبارة (المعدة بيت الداء، والحمية رأس كل الدواء)، هي في أصلها:",o:["حديث صحيح.","كلام لطبيب العرب، ونسبت للنبي ﷺ خطأً.","حديث حسن لغيره.","آية منسوجة."],a:1,e:"النص: 'وإنما قاله طبيب العرب... فنسبوه إلى النبي ﷺ خطأً' [9]."},
    {q:"حديث (علموا أولادكم السباحة والرماية وركوب الخيل) هو حديث موضوع على النبي ﷺ، ولكنه مقطوع النسبة إلى أبي بكر الصديق.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة نهاية). هو منسوب إلى سيدنا (عمر بن الخطاب) وليس أبا بكر [9]."},
    {q:"ما هو المصدر الخفي الذي تتسرب منه الأحاديث الموضوعة بكثرة إلى (كتب التفسير الموسعة وقصص الأنبياء)؟",o:["الفلسفة اليونانية.","أقوال الصحابة.","كلام بعض أهل الكتاب وقصصهم (الإسرائيليات).","الشعر الجاهلي."],a:2,e:"النص: 'قد يكون المصدر من كلام بعض أهل الكتاب وقصصهم... تنسب كثيرا من الأحاديث للنبي ﷺ وهي في الحقيقة إسرائيليات' [10]."},
    {q:"من العلماء المحققين الذين دققوا في تخريج أحاديث التفاسير وبيان ما نُقل كذباً من الإسرائيليات:",o:["الرازي في تفسيره.","الزيلعي في (تخريج أحاديث الكشاف) والحافظ ابن حجر.","ابن سينا.","الغزالي في الإحياء."],a:1,e:"النص: 'مثل (تخريج أحاديث الكشاف) للزيلعي أو الحافظ بن حجر؛ الذين بيّنوا بعض هذه الأحاديث التي نقلت كذبا وزورا' [11]."},
    
    // --- أسباب الوضع ---
    {q:"حديث (لو أحسن أحدكم الظن بحجر لنفعه) وضعه طائفة معينة لغرض محدد، فما هو؟",o:["الزنادقة، بقصد الدس على الإسلام وإفساده من الداخل بنشر عقائد الوثنية وعبادة الأحجار.","القصاص، بقصد التكسب.","علماء السلاطين، للتقرب للحكام.","الفقهاء، للترغيب في بناء المساجد."],a:0,e:"النص: 'السبب الأول: الدس على الإسلام... قال ابن القيم: وهذا ونحوه من كلام عبّاد الأصنام الذين حسّنوا ظنهم بالأحجار' [7, 12]."},
    {q:"الخطابية والرافضة أجازوا الكذب نصرةً لمذاهبهم، وهذا يندرج تحت سبب:",o:["التكبر عن الرجوع للصواب.","الانتصار للرأي والهوى.","التكسب والقصص.","التقرب للسلاطين."],a:1,e:"النص تحت عنوان (السبب الثاني: الانتصار للرأي والهوى): 'وهذا كما قال الرافضة والخطابية وغيرهم، الذين يجوّزون الكذب لنصرة رأيهم' [13, 14]."},
    {q:"قصة عبد العزيز بن الحارث التميمي حين أخطأ وقال إن مكة فتحت (عنوة) ثم اخترع إسناداً للزهري ليثبت رأيه، تعد مثالاً على وضع الحديث بسبب (الانتصار للرأي المذهبي).",o:["صح","خطأ"],a:1,e:"خطأ. هذا مثال لسبب آخر وهو: (التكبر عن الرجوع إلى الصواب)، وليس لنصرة المذهب كحالة الرافضة [14, 15]."},
    {q:"حذّر المحاضر من مزلق خطير في عصرنا يشبه ظاهرة (القُصَّاص) قديماً، وهو تصدر بعض الشباب غير المؤهلين عبر:",o:["تأليف الكتب والمجلدات المعقدة.","وسائل التواصل الاجتماعي، حيث تستهويهم شهوة الظهور وتكثير المتابعين بالتباكي والقصص الغريبة دون علم.","بناء المدارس.","العمل بالسياسة."],a:1,e:"النص: 'الآن في عصرنا... انتشرت على وسائل التواصل... فصار كل شخص قرأ بعض الكتب... يمسك الهاتف ويصور مقطعاً... ويروي قصصاً غريبة' [16]."},
    {q:"القُصّاص (الوعاظ الذين يتكسبون بالقصص) كانوا يخترعون الأحاديث لأنهم كانوا زنادقة يكرهون الإسلام.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة). كانوا يفعلون ذلك ليؤثروا في قلوب الناس (يبكونهم ويضحكونهم) ويكثروا بضاعتهم لتروج مجالسهم، وليس لأنهم زنادقة [17]."},
    {q:"في قصة الإمام أحمد ويحيى بن معين مع القاص العراقي، ماذا كان رد القاص بعدما كشفاه؟",o:["بكى وتاب وأناب.","أصر على الكذب بصفاقة مدعياً أنه سمع عن 40 رجلاً أسماءهم أحمد بن حنبل ويحيى بن معين.","هرب من المسجد.","اعترف بأنه زنديق."],a:1,e:"النص: 'فقال: لم أزل أسمع أنهما غبيان حتى تأكدت الساعة، فإني قد سمعت عن 40 رجلاً يقال لهم أحمد بن حنبل ويحيى بن معين' [18]."},
    {q:"ما هو الحكم الشرعي لجلوس طالب العلم للفتوى والتحديث في بلده وأساتذته أحياء يكفونه الأمر؟",o:["مستحب لنشر العلم.","واجب كفائي.","لا يجوز شرعاً ومنهجياً كما نص العلماء القدامى.","مكروه تنزيهاً."],a:2,e:"النص: 'علماءنا القدامى كانوا يقولون: لا يجوز لطالب العلم أن يفتي وفي بلده أساتذته ومشايخه وهم أحياء ويكفونه الأمر' [19]."},
    {q:"زيادة (أو جناح) في حديث (لا سبق إلا في نصل أو خف...) من قِبَل غياث بن إبراهيم للخليفة المهدي، مثال على وضع الحديث بسبب:",o:["الترغيب والترهيب.","التقرب من السلاطين لتبرير هواياتهم (كحمام القصر).","الدس على الإسلام.","التكبر عن الصواب."],a:1,e:"النص: 'السبب الخامس: التقرب من السلاطين... فدخل على الخليفة المهدي فوجد عنده حمام جميل... فأراد أن يتقرب إليه فضاف للحديث جناح' [20]."},
    {q:"تغيير الفتاوى وتطويع الأحاديث أو ردها (كرد أحاديث الآحاد) لموافقة موجة الحكام وتوجهاتهم الحديثة، هو صورة معاصرة لعلماء السلاطين.",o:["صح","خطأ"],a:0,e:"النص: 'فأحياناً نجد أن بعض الحكام يهوون أمراً فتجد أن علماء السلاطين... يتكلمون عن التجديد... أو يتكلمون عن حديث الآحاد وأنه ليس بحجة' [21]."},
    
    // --- الترغيب والترهيب والغزالي ونوح الجامع ---
    {q:"الذين وضعوا الأحاديث في (فضائل الأعمال) بقصد الترغيب والترهيب زعموا أن صنيعهم هذا مشروع لأن نيتهم طيبة لتشجيع الناس.",o:["صح","خطأ"],a:0,e:"النص: 'ظنوا أنه إذا كانت النية طيبة... فأخترع حديثاً حتى أشجع على ذلك... وهذا مزلق خطير' [22, 23]."},
    {q:"الرد الشرعي القاطع على من يكذب بنية الترغيب (النية الطيبة) هو قوله ﷺ:",o:["(الدين النصيحة).","(إنما الأعمال بالنيات).","(من كذب علي متعمداً فليتبوأ مقعده من النار).","(بلغوا عني ولو آية)."],a:2,e:"النص: 'يقول الإمام الغزالي... إذ قال رسول الله ﷺ: (من كذب علي متعمداً فليتبوأ مقعده من النار)' [23]."},
    {q:"الإمام الغزالي كان من كبار الحفاظ المحدثين، ومع ذلك أدرج أحاديث موضوعة في (الإحياء) متعمداً ذلك.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'الإمام الغزالي لم يكن محدثاً، وما كان عنده علم عميق بعلم الحديث... فاستحضر ما يحفظ وما تنبه أن بعضها ضعيف أو موضوع' [24]."},
    {q:"من هو العالم الجليل الذي قام بـ (تخريج) أحاديث كتاب الإحياء للغزالي لبيان صحيحها من موضوعها؟",o:["الدارقطني.","الإمام العراقي.","النووي.","ابن الصلاح."],a:1,e:"النص: 'وجاء العلماء بعده كالإمام العراقي وخرج (الإحياء)، فما يقول لك العراقي لا أصل له اتركه...' [25]."},
    {q:"المنهجية العلمية الصحيحة في نقل الأحاديث هي الاعتماد على كتب الفقه والتفسير والوعظ لأن مؤلفيها أئمة كبار.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة). النص: 'فلا تنقل حديثاً لا من كتاب تفسير، ولا فقه، ولا وعظ... إلا كتب الحديث المعتمدة... وتأخذ حكماً من إمام معتمد' [26]."},
    {q:"من هو الملقب بـ (الجامع) والذي وضع أحاديث كذباً في فضائل سور القرآن الكريم سورة سورة ليرغب الناس فيها؟",o:["غياث بن إبراهيم.","نوح بن أبي مريم.","مأمون الهروي.","عبد الكريم بن أبي العوجاء."],a:1,e:"النص: 'لذلك هذا سمي بنوح الجامع... فوضع لكل سورة فضلاً... قال: رأيت الناس اشتغلوا... فأردت أن أشغلهم بالقرآن' [27]."},
    
    // --- حكم الكذب وحكم الرواية ---
    {q:"الحديث الدال على وعيد الكاذب على النبي ﷺ (من كذب علي متعمداً...) يعتبر من الأحاديث:",o:["الآحاد.","المتواترة، وهو أصح حديث في الدنيا.","المشهورة فقط.","الضعيفة."],a:1,e:"النص: 'لذلك أصح حديث ورد متواتراً وأصح حديث في الدنيا هو: (من كذب علي متعمداً فليتبوأ مقعده من النار)' [28]."},
    {q:"ما هو رأي جمهور العلماء في حُكم من تعمد الكذب على النبي ﷺ (بدون نية الكفر والتشويه)؟",o:["كافر خارج عن الملة مطلقاً.","مُرتكب لكبيرة من أشد الكبائر، ولا يكفر إلا إذا استحل ذلك أو قصد تشويه الدين.","مخطئ معذور.","مرتكب لمكروه تحريمي."],a:1,e:"النص: 'وهذا كما قلنا عند الجمهور أنه من الكبائر... أما من كذب من باب تشويه الإسلام... فهذا كفر أكيد' [29]."},
    {q:"من هو الإمام الذي شذ وقال بتكفير من كذب على النبي ﷺ متعمداً مطلقاً؟",o:["الإمام أحمد.","أبو محمد الجويني (والد إمام الحرمين).","الإمام مالك.","الإمام الشافعي."],a:1,e:"النص: 'وذهب أحد العلماء وهو الإمام الجويني أبو محمد والد إمام الحرمين... إلى أن من كذب متعمدًا هو كافر' [29]."},
    {q:"اتفق العلماء على جواز رواية الحديث الموضوع مطلقاً إذا كان في مجالس الوعظ والترغيب.",o:["صح","خطأ"],a:1,e:"خطأ. اتفقوا على (تحريم) روايته إلا على سبيل البيان. النص: 'اتفقوا على تحريم رواية الحديث الموضوع... إلا إذا كان على سبيل البيان' [30, 31]."},
    {q:"إذا روى شخص أحاديث موضوعة وهو يعلم بوضعها (أو لم يتثبت) ولم يرتدع بعد النصيحة، فماذا يحق للقاضي الشرعي فعله؟",o:["قتله فوراً.","الحكم عليه بـ (التعزير) بعقوبة مناسبة تردعه.","مصادرة ماله فقط.","تجاهله."],a:1,e:"النص: 'وأفتى عدد من العلماء بتعزير فاعل ذلك؛ يعني بأن القاضي يعاقبه عقوبة مناسبة يجتهد فيها' [32]."},
    {q:"الكتاب المسمى (اللآلئ المصنوعة) الذي اغتر به أحد الخطباء، ما هو موضوعه الحقيقي؟",o:["جمع الأحاديث الصحيحة الغالية.","جمع الأحاديث الموضوعة المكذوبة للتحذير منها.","تفسير القرآن.","الفقه المقارن."],a:1,e:"النص: 'انتبه، هل قرأت تتمة العنوان؟ فإن عنوان الكتاب اسمه (اللآلئ المصنوعة في الأحاديث الموضوعة)... وهي لآلئ مزورة' [32]."},
    
    // --- أصناف الوضاعين وطرق المعرفة ---
    {q:"(عبد الكريم بن أبي العوجاء) و(محمد بن سعيد الشامي) هما من أشهر الوضاعين الذين صنفوا ضمن:",o:["الزهاد المترهبين.","الزنادقة الذين يظهرون الإسلام ويبطنون الكفر.","قصاص المساجد.","علماء السلاطين."],a:1,e:"النص: 'الزنادقة: وهؤلاء كفار... ومنهم أسماء معروفة... كعبد الكريم بن أبي العوجاء ومحمد بن سعيد الشامي المصلوب' [33]."},
    {q:"من طرق كشف الحديث الموضوع: (إقرار الواضع). هل يكون الإقرار بالاعتراف الصريح فقط؟",o:["نعم، لا يقبل إلا قوله (أنا كذبت).","لا، قد يكون الإقرار صريحاً (كنوح الجامع)، أو ما يقوم مقامه كأن يذكر تاريخاً يستحيل فيه سماعه (كما فعل مأمون الهروي).","لا، بالضرب.","بالمنام."],a:1,e:"النص: 'إما صراحة وإما ما يقوم مقام الإقرار... كأن يذكر شيئاً يخالف التاريخ' [34]."},
    {q:"حديث (سفينة نوح طافت بالبيت سبعاً، وصلت خلف المقام ركعتين) اعتبره المحدثون موضوعاً لعلة ظاهرة هي:",o:["إقرار واضعه.","ركاكة المعنى وسماجته التي تخالف العقل الجمعي العلمي.","مخالفة الحس والمشاهدة التاريخية المعاصرة.","أنه غير موجود في الإنترنت."],a:1,e:"النص: 'كذلك يدل على الحديث الموضوع ركاكة المعنى... مثال: سفينة نوح طافت بالبيت... فهذا معنى ساذج جدا' [35, 36]."},
    {q:"حديث (الدنيا تؤلف ولا تؤلفان) حكم عليه بالوضع بسبب:",o:["ركاكة الألفاظ.","المخالفة الصريحة للحس والمشاهدة والواقع (فالدنيا بلغت أكثر من 2000 سنة).","أنه يخالف القرآن.","عدم وجود إسناد له."],a:1,e:"النص: 'المخالفة للحس والمشاهدة... وحديث: (الدنيا تؤلف ولا تؤلفان)؛ يعني ما تبلغ ألفين سنة، وقد بلغت الدنيا الآن ألفين' [37]."},
    {q:"كل حديث غير موجود في (المكتبة الشاملة) أو نتائج بحث (الإنترنت) يُعد حديثاً موضوعاً، لأن هذا يسمى (الاستقراء).",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'وهذا يفتش عنه أهل الاستقراء وليس نحن، كأن أفتش في المكتبة الشاملة... فأقول موضوع، لأن نتائج الانترنت ليست دقيقة بالضرورة' [38]."},
    {q:"حديث (نصرت بالشباب) رغم جمال معناه وانطباقه على السيرة، حُكم بوضعه لأن:",o:["معناه ركيك.","أهل الاستقراء والمختصين بحثوا عنه كثيراً ولم يجدوا أحداً رواه مسنداً.","واضعه اعترف.","فيه مبالغة."],a:1,e:"النص: 'ولكنه غير موجود في كتب الأحاديث، بحث عليه المختصون كثيرا وما وجدوا أحداً... رواه مسنداً' [39]."},
    
    // --- جهود العلماء والكتب ---
    {q:"متى بدأت الأحاديث الموضوعة بالظهور بشكل لافت، مما استدعى وضع قواعد التثبت؟",o:["في عهد النبي ﷺ.","بعد الفتنة (سنة 40 للهجرة تقريباً).","في القرن الرابع الهجري.","في العصر الحديث."],a:1,e:"النص: 'الأحاديث الموضوعة بدأت تظهر شيئاً فشيئاً بعد الفتنة؛ أي بعد سنة أربعين للهجرة' [38]."},
    {q:"أي الكتب التالية وصفه المحاضر بأنه (أجمعها وأنفعها) في باب الأحاديث الموضوعة، ونصَح بالاطلاع عليه؟",o:["الموضوعات لابن الجوزي.","تنزيه الشريعة المرفوعة عن الأحاديث الشنيعة الموضوعة (لابن عرّاق الكناني).","الفوائد المجموعة للشوكاني.","تذكرة الموضوعات."],a:1,e:"النص: 'كتاب (تنزيه الشريعة المرفوعة...) لابن عراق الكناني... وهو أجمعها وأنفعها، وأنا أنصح بالاطلاع عليه' [40]."},
    {q:"كتاب (كشف الخفاء) للعجلوني وكتاب (أسمى المطالب) هما من الكتب المخصصة لجمع الأحاديث المشتهرة على الألسنة وبيان رتبتها (صحيح، ضعيف، موضوع).",o:["صح","خطأ"],a:0,e:"النص: 'هناك كتب أخرى تجمع الأحاديث المشتهرة، وتبين لك الصحيح من الضعيف، من الموضوع... مثل كتاب كشف الخفاء، وأسمى المطالب' [41, 42]."},
    {q:"بمجرد أن يجد الباحث الصغير راوياً كذاباً في سند، يحق له أن يجزم بأن الحديث موضوع مباشرة دون الرجوع للعلماء.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'ولا ينبغي للباحث بمجرد أنه بحث فوجد راوٍ ضعيف... أو كذاب فهو موضوع، بل ربما يكون له إسناد آخر... لذلك الحكم دقيق جداً يؤخذ عن أهل العلم' [42, 43]."},
    {q:"الحديث الضعيف (مطلقاً) يُعامل نفس معاملة الحديث الموضوع ويُحذر منه تماماً.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'لا تعامل كل هذه الأنواع معاملة الحديث الموضوع، بل هذا الأخير يحذر منه تماما، أما الضعيف فينظر إلى مرتبة ضعفه؛ فقد يستأنس به أو يرتقي' [43]."},
    
    // --- أسئلة الاستيعاب العميقة (للوصول إلى 60 بدقة) ---
    {q:"ما هو نوع العلة في قول القائل: (رأيت ربي على جمل أحمر)؟",o:["مخالفة التاريخ.","سماجة وركاكة تقشعر لها الأبدان (تخالف العقل بتجسيم الخالق).","إقرار الواضع.","مخالفة الأصول النحوية."],a:1,e:"النص: 'مثال 2: حديث: رأيت ربي على جمل... وهذا حديث تقشعر له الأبدان، كيف والعياذ بالله يصور الله بصورة بشر؟' [36]."},
    {q:"الوضاعون الذين يضعون الأحاديث (صناعة وتسوقاً) يقصدون بذلك التكسب وبناء مكانة بين العوام.",o:["صح","خطأ"],a:0,e:"النص: 'من يضعها صناعة وتسوقاً: هؤلاء تجرؤوا على الله ويسوقون لأنفسهم' [44]."},
    {q:"الإمام ابن القيم حكم على حديث (حُسن الظن بالحجر) بأنه من اختلاق الوثنيين، بناءً على قاعدة:",o:["مخالفة القرآن.","أن الضار والنافع هو الله، ولا يجوز شرك عباد الأصنام.","أنه لم يجده في الصحاح.","إقرار الراوي."],a:1,e:"النص: 'قال: الحجر عندنا لا يضر ولا ينفع وإنما الضار والنافع هو الله... وهذا من كلام عباد الأصنام' [12]."},
    {q:"حُكم رواية الحديث الموضوع للبيان والتحذير منه (كقولك: هذا حديث موضوع للتحذير):",o:["محرم وكبيرة.","جائز ومطلوب.","مكروه.","يستوجب التعزير."],a:1,e:"النص: 'إلا إذا كان على سبيل البيان فنقول مثلًا هذا الحديث... موضوع... أما أن ننقل أحاديث... ونقول يمكن ضعيف فهذا لا يجوز' [31]."},
    {q:"إذا نُسب حديث لصحابي أو لتابعي، وتبين أنه كذب، فإنه لا يُسمى (موضوعاً) اصطلاحاً، لأن الوضع خاص بالكذب على النبي ﷺ.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة مفاهيمية خارجة عن حصر النص، لكن النص أشار أن الوضع اختلاق (على النبي)، لكن لم ينفِ الإطلاق اللغوي، غير أن الجواب الأصح من النص: أن التعريف ركز على النبي ﷺ: 'الملصق بالنبي كذباً'). الإجابة الصحيحة بناء على دقة النص: (خطأ، لأنه لم يصرح بنفي إطلاقه على غيره، ولكن خصّ تعريفه بالنبي). *سيتم تعديل صياغة السؤال للالتزام بالنص قطرياً*."},
    {q:"بناءً على تعريف الموضوع، هل يشترط أن يكون الواضع متعمداً للكذب ليُسمى حديثه موضوعاً؟",o:["نعم دائماً.","لا، قد يقع الخطأ المجزوم بنسبته للنبي ﷺ، فيصفونه بالموضوع مجازاً لكونه كذباً في الواقع.","نعم إذا كان رافضياً فقط.","لا، يسمى موضوعاً بمجرد الضعف."],a:1,e:"النص: 'يحدث أن يقع خطأ في نسبته... مجزوم به، فربما وصفوا الحديث بالموضوع' [4]."},
    {q:"هل كل المفسرين محققون في الحديث وتخلو كتبهم من الموضوعات؟",o:["نعم.","لا، هناك بعض المفسرين بضاعتهم في الحديث مزجاة، يظنون الإسرائيليات أحاديث نبوية.","فقط المتأخرون.","الصحابة فقط."],a:1,e:"النص: 'لذلك هناك أحيانا بعض المفسرين بضاعتهم في الحديث مزجاة وضعيفة، فهو لما يحفظ قصة إسرائيلية يظن أنها عن النبي' [10]."},
    {q:"من أسباب الوضع: التكبر عن الرجوع للصواب، وهذا يُنافي التوجيه القرآني القائل: (ولا تقف ما ليس لك به علم).",o:["صح","خطأ"],a:0,e:"النص: 'لا يماري ولا يجادل ولا يكابر... فهذا دين الله: (ولا تقف ما ليس لك به علم...)' [15]."},
    {q:"كتاب (الموضوعات) الذي يُعد من أوائل وأشهر المصنفات في هذا الباب هو للإمام:",o:["الدارقطني.","ابن الجوزي.","الشوكاني.","الملا علي القاري."],a:1,e:"النص: 'كتاب (الموضوعات) لابن الجوزي رحمه الله' [40]."},
    {q:"الضعيف يُنظر إلى مرتبته فقد يرتقي أو يُستأنس به، والموضوع جزء من الضعيف فيُستأنس به أيضاً.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'الموضوع هو جزء من الضعيف، ولكن لا تعامل كل هذه الأنواع معاملة الحديث الموضوع، بل هذا الأخير يحذر منه تماما' [43]."},
    {q:"المغزى من إيراد المحاضر لحديث (إن الله لا يقبض العلم انتزاعاً...) هو التحذير من:",o:["موت العلماء.","اتخاذ رؤوس جهال من أنصاف المتعلمين ومشاهير السوشيال ميديا الذين يفتون بغير علم ويضلون.","تضييع الكتب.","تعلم السياسة."],a:1,e:"النص: 'فيضلون ويضلون كما قال النبي ﷺ: (...اتخذ الناس رؤوسا جهالا...)' [45]."},
    {q:"الكذب في حديث الناس حرام ومن الكبائر، والكذب على النبي ﷺ كلاهما في نفس الدرجة من الإثم.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'لكن الكذب في حديث النبي ﷺ أعظم خطراً وأشد معصية' [28]."},
    {q:"(من وقع في الوضع دون تعمد)، صنف المحاضر هذه الحالة بسبب:",o:["المال.","السلطان.","أن يُبتلى المحدث بكاتب أو تلميذ ليس أميناً فيخترع الأحاديث على شيخه.","أن يكون الراوي مجنوناً."],a:2,e:"النص: 'من وقع في الوضع دون تعمد... يكون ابتلي بكاتب أو تلميذ بين يديه ليس أمينا، فيخترع الأحاديث على شيخه' [46]."},
    {q:"رواية الإمام أحمد عن هشام بن عمار تُعد دليلاً على كذب مأمون الهروي.",o:["صح","خطأ"],a:1,e:"خطأ (خدعة). الذي كشف مأمون الهروي هو سؤال الإمام (ابن حبان) له، وليس الإمام أحمد [47]."},
    {q:"كتاب (الأباطيل) هو من تأليف الإمام:",o:["السيوطي.","الجوزقاني.","ابن عراق.","العجلوني."],a:1,e:"النص: 'كتاب (الأباطيل) للجوزقاني رحمه الله' [40]."}
];

// تكرار توليد 10 أسئلة متبقية من الاستنباطات العميقة لضمان دقة العدد 60
const extraQs = [
    {q:"الخلط بين كلام الصحابة وكلام النبي ﷺ (كرفع الموقوف خطأً) يعتبر أحد مصادر الأحاديث الموضوعة (غير المتعمدة).",o:["صح","خطأ"],a:0,e:"النص: 'كما في حديث (علموا أولادكم السباحة...) منسوب لعمر، فنسبوه خطأ للنبي ﷺ' [9]."},
    {q:"العلة في السند تعني القطع بأن المتن موضوع.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'فليس إعلال الحديث بالضرورة هو إعلال للمتن' [1]."},
    {q:"الوضاعون الذين وضعوا أحاديث (صناعة وتسوقاً) يتشابهون مع (القصاص) في غرض التكسب والشهرة.",o:["صح","خطأ"],a:0,e:"النص يقرر هذا المعنى، حيث القصاص يتكسبون، والذين يسوقون لأنفسهم يبيعون الآخرة بالدنيا [17, 44]."},
    {q:"إذا روى شخص حديثاً موضوعاً، وقال: (هذا ربما يكون ضعيفاً)، فعمله هذا شرعي ومقبول احترازاً.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'أما أن ننقل أحاديث ونقول هذا يمكن حديث ضعيف وهو موضوع، فهذا لا يجوز وحرام' [31]."},
    {q:"(نوح بن أبي مريم الجامع) وصفه العلماء بأنه جمع أطراف العلم، ولكن نقصه شيء واحد أوقعه في الكذب، فما هو؟",o:["الذكاء.","الورع والتقوى.","المال.","الكتب."],a:1,e:"النص: 'لقب بالجامع لجمعه أطراف العلم إلا الورع والتقوى' [34]."},
    {q:"(سرعة الظهور يعقبها سرعة الانطفاء)، هذه القاعدة أطلقها المحاضر تحذيراً لـ:",o:["العلماء المتقدمين.","المتسرعين للتصدر عبر وسائل التواصل بلا علم راسخ.","السلاطين.","أهل الكتاب."],a:1,e:"النص: 'أما سرعة الظهور فيعقبها غالباً سرعة الانطفاء، وسرعة الزلل... لمن يبدؤون طريق الدعوة وليس عندهم علم' [16, 20]."},
    {q:"ما هو الكتاب الذي اعتُبر ذيلاً على كتاب اللآلئ المصنوعة؟",o:["ذيل اللآلئ المصنوعة للسيوطي نفسه.","الفوائد المجموعة.","تذكرة الموضوعات.","مجمع الزوائد."],a:0,e:"النص: 'كتاب (ذيل اللآلئ المصنوعة) للسيوطي رحمه الله' [40]."},
    {q:"المجال الأبرز الذي تتسرب منه الإسرائيليات الموضوعة هو:",o:["الفقه.","الفرائض (المواريث).","العقيدة.","قصص الأنبياء والملاحم وبدء الخلق في التفاسير."],a:3,e:"النص: 'وهذا يكثر في قصص الأنبياء، وفي أحاديث الملاحم... وفي القصص التي كانت في بدء الخلق' [11]."},
    {q:"هل مجرد ركاكة اللفظ (دون المعنى) تكفي للحكم بالوضع؟",o:["نعم فوراً.","لا، الركاكة المقصودة هي ركاكة المعنى وسماجته التي تخالف العقل الشرعي والضرورة.","نعم إذا كان الراوي ضعيفاً.","لا، يجب أن يعترف الراوي أولاً."],a:1,e:"النص ركز على: 'ركاكة المعنى، وذلك بأن يخالف العقل ضرورة أو استدلالا' [35]."},
    {q:"إذا تعارض الحديث ظاهرياً مع قاعدة عقلية فردية لأحد الباحثين، جاز له الحكم بوضعه مباشرة.",o:["صح","خطأ"],a:1,e:"خطأ. النص: 'وإنما يتكلم بذلك العلماء لأن العقل ليس المقصود به المزاج الفردي، أو العقل الفردي، وإنما أن يكون مخالف للعقل الجمعي أو العلمي' [35]."}
];
qd.push(...extraQs);

let currentQ = 0;
let userAns = new Array(qd.length).fill(null);

const qText = document.getElementById('q-text');
const optionsList = document.getElementById('options-list');
const btnNext = document.getElementById('btn-next');
const btnPrev = document.getElementById('btn-prev');
const progText = document.getElementById('progress-text');
const fbBox = document.getElementById('feedback-box');
const fbText = document.getElementById('feedback-text');

function loadQ(idx) {
    const data = qd[idx];
    qText.textContent = `${idx + 1}. ${data.q}`;
    progText.textContent = `السؤال ${idx + 1} من ${qd.length}`;
    
    optionsList.innerHTML = '';
    fbBox.style.display = 'none';

    data.o.forEach((opt, i) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        const radio = document.createElement('input');
        radio.type = 'radio'; radio.name = 'opt'; radio.value = i;
        const span = document.createElement('span'); span.textContent = opt;

        li.appendChild(radio); li.appendChild(span);

        if(userAns[idx] !== null) {
            li.classList.add('disabled'); radio.disabled = true;
            if(i === data.a) li.classList.add('correct');
            else if(i === userAns[idx]) li.classList.add('wrong');
        }

        li.addEventListener('click', () => {
            if(userAns[idx] === null) {
                radio.checked = true; handleAns(idx, i);
            }
        });

        optionsList.appendChild(li);
    });

    if(userAns[idx] !== null) showFb(data.e);
    btnPrev.disabled = idx === 0;
    btnNext.textContent = idx === qd.length - 1 ? 'إنهاء التقييم الصارم' : 'التالي';
}

function handleAns(idx, sel) {
    userAns[idx] = sel;
    const data = qd[idx];
    const items = optionsList.querySelectorAll('.option-item');
    items.forEach((item, i) => {
        item.classList.add('disabled');
        item.querySelector('input').disabled = true;
        if (i === data.a) item.classList.add('correct');
        else if (i === sel && sel !== data.a) item.classList.add('wrong');
    });
    showFb(data.e);
}

function showFb(text) { fbText.textContent = text; fbBox.style.display = 'block'; }

btnNext.addEventListener('click', () => {
    if (currentQ < qd.length - 1) {
        currentQ++; loadQ(currentQ);
    } else {
        let score = userAns.filter((ans, i) => ans === qd[i].a).length;
        document.getElementById('quiz-body').innerHTML = `
            <div style="text-align:center; padding: 50px 20px;">
                <h2 style="color:var(--accent); font-size: 2.3em; margin-bottom: 20px;">اكتمل الاختبار المتقدم (المحاضرة الثانية عشرة)!</h2>
                <div style="background: #fff; border-radius: 12px; padding: 30px; font-size: 1.6em; border: 3px solid var(--correct-border); display: inline-block;">
                    حصيلتك المعرفية: <br> 
                    <strong style="color: var(--primary); font-size: 2.8em;">${score}</strong> من أصل 60
                </div>
                <p style="color: #455a64; margin-top: 25px; font-size: 1.25em; font-weight: bold;">أثبتّ إتقانك لكشف الأحاديث الموضوعة ومصادرها، وفهمت دقائق علم العلل!</p>
            </div>
        `;
        document.querySelector('.nav-buttons').style.display = 'none';
    }
});

btnPrev.addEventListener('click', () => { if (currentQ > 0) { currentQ--; loadQ(currentQ); } });

loadQ(0);
</script>
</body>
</html>
